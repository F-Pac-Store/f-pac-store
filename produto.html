<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto | F Pac Store</title>

  CSS/global.css
  https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css
</head>

<body>

<div id="header-placeholder"></div>

<main class="container" style="padding-top:140px">

  <div style="max-width:800px;margin:auto;text-align:center">
    <img src="assets/img/cards/F-PAC-ESCRITA-peito C.png" style="width:100%;max-width:300px">
    <h1>Camisa F PAC</h1>
    <p>Modelo PRIME – Alta qualidade</p>
    <button onclick="adicionarCarrinho()">Adicionar ao Carrinho</button>
  </div>

</main>

<script>
fetch('inclui/header.html')
  .then(r=>r.text())
  .then(html=>{
    document.getElementById('header-placeholder').innerHTML=html;
    const s=document.createElement('script');
    s.src='js/header.js';
    document.body.appendChild(s);
  });

function adicionarCarrinho(){
  const carrinho=JSON.parse(localStorage.getItem("fpacCarrinho"))||[];
  carrinho.push({nome:"Camisa F PAC"});
  localStorage.setItem("fpacCarrinho",JSON.stringify(carrinho));
  alert("Produto adicionado!");
}
</script>

</body>
</html>
