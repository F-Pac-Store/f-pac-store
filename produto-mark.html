<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark | F Pac Store</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
.card{max-width:400px;margin:auto;background:#fff;padding:20px;border-radius:10px;text-align:center}
img{width:100%;height:250px;object-fit:contain}
button{background:#FFC107;border:none;padding:12px;width:100%;margin-top:15px;font-weight:bold}
</style>
</head>

<body>

<div class="card">
<img src="imagens/logo-no-peito.jpg">

<h2>Camisa Mark</h2>
<p>Modelo com estampas</p>

<label>Tamanho</label>
<select id="tamanho">
<option>P</option>
<option>M</option>
<option>G</option>
<option>GG</option>
</select>

<label>Quantidade</label>
<input type="number" id="qtd" value="1" min="1">

<button onclick="comprar()">Adicionar ao Carrinho</button>
</div>

<script>
function comprar(){
const item={
id:"MARK-"+Date.now(),
nome:"Camisa Mark",
tamanho:document.getElementById("tamanho").value,
quantidade:Number(document.getElementById("qtd").value),
preco:89.90,
imagem:"imagens/logo-no-peito.jpg"
}

let carrinho=JSON.parse(localStorage.getItem("fpacCarrinho"))||[]
carrinho.push(item)

localStorage.setItem("fpacCarrinho",JSON.stringify(carrinho))
window.location.href="carrinho.html"
}
</script>

</body>
</html>
