<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark | F Pac Store</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}

.card{
  max-width:400px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

img{
  width:100%;
  height:250px;
  object-fit:contain;
}

label{display:block;margin-top:10px;font-weight:bold}

input{width:100%;padding:10px;margin-top:5px}

button{
  background:#000;
  color:#fff;
  border:none;
  padding:12px;
  width:100%;
  margin-top:15px;
  cursor:pointer;
}

/* CORES */
.cores{display:flex;gap:10px;justify-content:center;margin-top:10px}

.cor{
  width:28px;
  height:28px;
  border-radius:50%;
  cursor:pointer;
  border:2px solid transparent;
}

.cor:hover{transform:scale(1.1)}
.cor.ativo{border:2px solid #000}

.branco{background:#fff;border:1px solid #ccc}
.preto{background:#000}
.offwhite{background:#f3e9dc}

.cor.indisponivel{
  opacity:.3;
  pointer-events:none;
}

/* TAMANHOS */
.sizes{display:flex;gap:10px;justify-content:center;margin-top:10px}

.size{
  width:45px;
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #ccc;
  border-radius:6px;
  cursor:pointer;
}

.size.ativo{
  background:#000;
  color:#fff;
}
</style>
</head>

<body>

<div class="card">

<img src="imagens/logo-no-peito.jpg">

<h2>Camisa Mark</h2>

<label>Cor</label>

<div class="cores">
<div class="cor branco" onclick="selCor('Branco')"></div>
<div class="cor preto" onclick="selCor('Preto')"></div>
<div class="cor offwhite" onclick="selCor('Off White')"></div>
</div>

<input type="hidden" id="cor" value="Branco">

<label>Tamanho</label>

<div class="sizes">
<div class="size" onclick="selTam('P')">P</div>
<div class="size" onclick="selTam('M')">M</div>
<div class="size" onclick="selTam('G')">G</div>
<div class="size" onclick="selTam('GG')">GG</div>
</div>

<input type="hidden" id="tamanho" value="M">

<label>Quantidade</label>
<input type="number" id="qtd" value="1">

<button onclick="comprar()">Adicionar ao Carrinho</button>

</div>

<script>

const estoqueCores = {
  "Branco": true,
  "Preto": false,
  "Off White": true
};

// bloqueio cores
document.addEventListener("DOMContentLoaded",()=>{
Object.keys(estoqueCores).forEach(c=>{
if(!estoqueCores[c]){
const el=document.querySelector(".cor."+c.toLowerCase().replace(" ",""));
if(el) el.classList.add("indisponivel");
}
});
});

// cor
function selCor(cor){
if(!estoqueCores[cor]) return;

document.getElementById("cor").value = cor;

document.querySelectorAll(".cor").forEach(e=>e.classList.remove("ativo"));

if(cor==="Branco")document.querySelector(".branco").classList.add("ativo");
if(cor==="Preto")document.querySelector(".preto").classList.add("ativo");
if(cor==="Off White")document.querySelector(".offwhite").classList.add("ativo");
}

// tamanho
function selTam(t){
document.getElementById("tamanho").value = t;
document.querySelectorAll(".size").forEach(e=>e.classList.remove("ativo"));
}

// carrinho
function comprar(){

const cor=document.getElementById("cor").value;

if(!estoqueCores[cor]) return alert("Indisponível");

let carrinho = JSON.parse(localStorage.getItem("fpacCarrinho")) || [];

carrinho.push({
id:"MARK-"+Date.now(),
nome:"Camisa Mark",
cor,
tamanho:document.getElementById("tamanho").value,
quantidade:Number(document.getElementById("qtd").value),
preco:89.90
});

localStorage.setItem("fpacCarrinho",JSON.stringify(carrinho));
window.location.href="carrinho.html";
}

</script>

  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 CONFIG FIREBASE (substituir pelos teus dados) */
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* =========================
   VERIFICA ESTOQUE
========================= */
async function temEstoque(produto, cor, tamanho){

  const snap = await getDoc(
    doc(db, "estoque", produto + "_" + cor)
  );

  if(!snap.exists()) return false;

  const data = snap.data();

  return (data[tamanho] || 0) > 0;
}

/* =========================
   COMPRA COM BLOQUEIO
========================= */
window.comprar = async function(){

  const produto = "PRIME"; // ajusta por produto (MARK / FORCE / PRIME)
  const cor = document.getElementById("cor").value;
  const tamanho = document.getElementById("tamanho").value;
  const qtd = Number(document.getElementById("qtd").value);

  // 🔒 BLOQUEIO DE ESTOQUE (COR + TAMANHO)
  const ok = await temEstoque(produto, cor, tamanho);

  if(!ok){
    alert("Sem estoque para essa variação");
    return;
  }

  // 🛒 carrinho
  let carrinho = JSON.parse(localStorage.getItem("fpacCarrinho")) || [];

  carrinho.push({
    id: produto + "-" + Date.now(),
    nome: "Camisa " + produto,
    cor,
    tamanho,
    quantidade: qtd,
    preco: 109.90
  });

  localStorage.setItem("fpacCarrinho", JSON.stringify(carrinho));

  // 🔁 redireciona
  window.location.href = "carrinho.html";
};

</script>

</body>
</html>
