<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Carrinho | F Pac Store</title>

<style>
:root {
  --primary:#003366;   /* Azul F Pac */
  --accent:#FFC107;    /* Amarelo F Pac */
  --success:#28c75f;   /* Verde ação */
  --danger:#ff4d4f;    /* Vermelho remover */
  --bg:#f4f6f8;        /* Fundo suave */
  --text:#1f2933;      /* Texto principal */
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Inter, sans-serif;
  background:var(--bg);
  display:flex;
  justify-content:center;
  padding:40px 16px;
}

.carrinho-wrap {
  width:100%;
  max-width:900px;
}

.carrinho-topo {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.carrinho-topo h1 {
  margin: 0;
  font-size: 2.2rem;
  font-weight: 800;
  color: var(--primary);
}

.btn-voltar {
  background: var(--primary);
  color: var(--accent);
  border-radius: 8px;
  font-weight: 700;
  padding: 10px 18px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.12);
}

.pedido-id {
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 24px;
  border-left: 6px solid var(--accent);
  padding-left: 12px;
}

.item {
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 18px;
  background: #ffffff;
}

.item strong {
  font-size: 1.1rem;
  color: var(--primary);
}

.item-linha {
  margin-top:6px;
  font-size:0.9rem;
}

.item input {
  width:80px;
  padding:6px;
  margin-left:6px;
}

.subtotal {
  background: rgba(255,193,7,0.15);
  padding: 8px 12px;
  border-radius: 8px;
  display: inline-block;
}

.btn-remover {
  margin-top:12px;
  background:var(--danger);
  color:white;
  border:none;
  padding:10px;
  width:100%;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

.total {
  margin-top:24px;
  font-size:1.6rem;
  font-weight:800;
  text-align:right;
}

.acoes {
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.btn-finalizar {
  background:var(--success);
  color:white;
  border:none;
  padding:16px;
  border-radius:8px;
  font-size:1rem;
  font-weight:800;
  cursor:pointer;
}

.btn-limpar {
  background:#ddd;
  color:#333;
  border:none;
  padding:14px;
  border-radius:6px;
  font-weight:700;
  cursor:pointer;
}

.vazio {
  text-align:center;
  font-size:1.1rem;
}
</style>
</head>

<body>

<div class="carrinho-wrap">

  <div class="carrinho-topo">
    <h1>Seu Carrinho</h1>
    <a href="index.html" class="btn-voltar">⬅ Voltar ao início</a>
  </div>

  <div class="card">
    <div id="lista"></div>
    <div class="total" id="total"></div>

    <div class="acoes">
      <button type="button" class="btn-finalizar" onclick="finalizarCompra()">
  Finalizar Compra
</button>

<button type="button" class="btn-limpar" onclick="limparCarrinho()">
  Limpar Carrinho
</button>

    </div>
  </div>

</div>

<script>
const lista = document.getElementById('lista');
const totalEl = document.getElementById('total');
const carrinho = JSON.parse(localStorage.getItem('carrinho'));

if (!carrinho || carrinho.itens.length === 0) {
  lista.innerHTML = '<p class="vazio">Carrinho vazio.</p>';
  totalEl.innerHTML = '';
} else {

  lista.innerHTML = `<p class="pedido-id">Pedido: ${carrinho.id}</p>`;

  carrinho.itens.forEach((item, index) => {
    lista.innerHTML += `
      <div class="item">
        <strong>${item.nome}</strong>

        <div class="item-linha">
          Cor: ${item.cor} | Tamanho: ${item.tamanho}
        </div>

        <div class="item-linha">
          Quantidade:
          <input type="number" min="1"
  value="${item.qtd}"
  oninput="alterarQuantidade(event, ${index}, this.value)">
        </div>

        <div class="subtotal">
          Subtotal: R$ ${item.subtotal.toFixed(2).replace('.', ',')}
        </div>

        <button class="btn-remover" onclick="removerItem(${index})">
          Remover
        </button>
      </div>
    `;
  });

  totalEl.innerHTML =
    'Total do Pedido: R$ ' +
    carrinho.total.toFixed(2).replace('.', ',');
}

function alterarQuantidade(event, index, novaQtd) {
  event.preventDefault();
  event.stopPropagation();

  const carrinho = JSON.parse(localStorage.getItem('carrinho'));
  if (!carrinho) return;

  const qtd = Number(novaQtd);

  if (qtd <= 0) {
    carrinho.itens.splice(index, 1);
  } else {
    carrinho.itens[index].qtd = qtd;
    carrinho.itens[index].subtotal =
      carrinho.itens[index].preco * qtd;
  }

  carrinho.total = carrinho.itens.reduce(
    (s, i) => s + i.subtotal, 0
  );

  localStorage.setItem('carrinho', JSON.stringify(carrinho));

  // ✅ Atualiza sem sair da página
  location.reload();
}

function removerItem(index) {
  const carrinho = JSON.parse(localStorage.getItem('carrinho'));
  carrinho.itens.splice(index,1);
  carrinho.total = carrinho.itens.reduce(
    (s,i)=>s+i.subtotal,0
  );
  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  location.reload();
}

function limparCarrinho() {
  if (confirm('Deseja limpar o carrinho?')) {
    localStorage.removeItem('carrinho');
    location.reload();
  }
}

function finalizarCompra() {
  let msg = `Olá! Quero finalizar meu pedido:%0A%0A`;
  msg += `Pedido: ${carrinho.id}%0A%0A`;

  carrinho.itens.forEach(i => {
    msg += `• ${i.nome} (${i.cor}, ${i.tamanho}) x${i.qtd}%0A`;
  });

  msg += `%0ATotal: R$ ${carrinho.total.toFixed(2).replace('.', ',')}`;
  msg += `%0A%0APagamento: Pix`;

  window.open(
    `https://wa.me/5547997465602?text=${msg}`,
    '_blank'
  );
}
</script>

</body>
</html>
``
