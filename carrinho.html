<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrinho | F Pac Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f5f5f5;
      margin: 0;
    }

    header {
      background: #003366;
      color: #FFC107;
      padding: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 1.4rem;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .item {
      background: white;
      display: flex;
      gap: 15px;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      align-items: center;
    }

    .item img {
      width: 90px;
      border-radius: 6px;
    }

    .info {
      flex: 1;
    }

    .qtd {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }

    .qtd button {
      width: 28px;
      height: 28px;
      background: #FFC107;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .remover {
      background: none;
      border: none;
      color: red;
      cursor: pointer;
      margin-top: 8px;
    }

    .resumo {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    .finalizar {
      background: #25D366;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 15px;
    }

/* Checkout – Bairro e Pagamento */
.checkout-form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 15px;
  margin-bottom: 20px;
}

.checkout-form .campo {
  display: flex;
  flex-direction: column;
  text-align: left;
}

.checkout-form label {
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 6px;
  color: #333;
}

.checkout-form input,
.checkout-form select {
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 0.95rem;
}

/* Mobile */
@media (max-width: 600px) {
  .checkout-form {
    grid-template-columns: 1fr;
  }
}

    /* === Validação visual do bairro === */
#bairro.valido {
  border: 2px solid #2ecc71;
  background: #f0fff4;
}

#bairro.invalido {
  border: 2px solid #e74c3c;
  background: #fff5f5;
}

/* Botão Finalizar desativado */
.finalizar:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
    
  </style>
</head>

<body>

<header>🛒 Seu Carrinho</header>

<div class="container" id="lista"></div>

<div class="container resumo">
  <h3>Total</h3>
  <p id="total"></p>
  <p id="frete-preview">Frete: —</p>
<p id="total-final-preview"><strong>Total com frete: —</strong></p>
<div class="checkout-form">
  <div class="campo">
    <label for="bairro">Bairro para entrega (Joinville)</label>
<input
  type="text" 
  id="bairro" 
  placeholder="Ex: Jardim Paraíso" 
  list="lista-bairros"
/>

<datalist id="lista-bairros">
  <option value="Adhemar Garcia">
  <option value="América">
  <option value="Atiradores">
  <option value="Aventureiro">
  <option value="Boa Vista">
  <option value="Boehmerwald">
  <option value="Bom Retiro">
  <option value="Centro">
  <option value="Comasa">
  <option value="Costa e Silva">
  <option value="Espinheiros">
  <option value="Fátima">
  <option value="Floresta">
  <option value="Glória">
  <option value="Guanabara">
  <option value="Iririú">
  <option value="Itaum">
  <option value="Jarivatuba">
  <option value="Jardim Iririú">
  <option value="Jardim Sofia">
  <option value="João Costa">
  <option value="Morro do Meio">
  <option value="Nova Brasília">
  <option value="Paranaguamirim">
  <option value="Parque Guarani">
  <option value="Petrópolis">
  <option value="Profipo">
  <option value="Saguaçu">
  <option value="Santa Catarina">
  <option value="Santo Antônio">
  <option value="São Marcos">
  <option value="Ulysses Guimarães">
</datalist>

  <div class="campo">
    <label for="pagamento">Forma de pagamento</label>
    <select id="pagamento">
      <option value="">Selecione</option>
      <option>Pix</option>
      <option>Cartão de Crédito</option>
      <option>Cartão de Débito</option>
    </select>
  </div>
</div>

<button class="finalizar" onclick="finalizar()" disabled>
  Finalizar Pedido
</button>

<div id="pix-qrcode" style="display:none; margin-top:20px;">
  <p><strong>Pagamento via Pix</strong></p>
  <img id="qr-img" src="" alt="QR Code Pix">
</div>
  
</div>

<script>
let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
const lista = document.getElementById("lista");
const totalEl = document.getElementById("total");

const fretePorBairro = {
  "paranaguamirim": 7,
  "joao costa": 12,
  "jarivatuba": 13,
  "adhemar garcia": 13,
  "ulysses guimaraes": 13,
  "fatima": 14,
  "santa catarina": 14,
  "profipo": 14,
  "parque guarani": 13,
  "petropolis": 13,
  "boehmerwald": 13,
  "itaum": 12,
  "floresta": 14,
  "guanabara": 13,
  "aventureiro": 18,
  "boa vista": 17,
  "comasa": 17,
  "espinheiros": 18,
  "iririu": 17,
  "jardim iririu": 17,
  "america": 17,
  "atiradores": 17,
  "bom retiro": 18,
  "centro": 16,
  "costa e silva": 18,
  "gloria": 17,
  "saguacu": 17,
  "santo antonio": 18,
  "jardim sofia": 18,
  "morro do meio": 20,
  "nova brasilia": 20,
  "sao marcos": 20
};

function normalizarBairro(v) {
  return v.trim().toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function bairroEhValido(bairroDigitado) {
  const bairroNormalizado = normalizarBairro(bairroDigitado);
  const bairrosValidos = Object.keys(fretePorBairro);
  return bairrosValidos.includes(bairroNormalizado);
}

const inputBairro = document.getElementById("bairro");
const selectPagamento = document.getElementById("pagamento");
const btnFinalizar = document.querySelector(".finalizar");

function normalizarListaBairros() {
  return Object.keys(fretePorBairro);
}

function autoselecionarBairro(valorDigitado) {
  const valorNormalizado = normalizarBairro(valorDigitado);
  return normalizarListaBairros().find(b => b === valorNormalizado) || null;
}

function atualizarFreteETotal(bairroDigitado) {
  const previewFrete = document.getElementById("frete-preview");
  const previewTotal = document.getElementById("total-final-preview");

  if (!bairroEhValido(bairroDigitado)) {
    previewFrete.innerText = "Frete: —";
    previewTotal.innerHTML = "<strong>Total com frete: —</strong>";
    return;
  }

  const frete = fretePorBairro[normalizarBairro(bairroDigitado)];
  const totalProdutos = Number(
    totalEl.innerText.replace("R$", "").replace(",", ".")
  );

  const totalFinal = totalProdutos + frete;

  previewFrete.innerText = `Frete: R$ ${frete.toFixed(2)}`;
  previewTotal.innerHTML =
    `<strong>Total com frete: R$ ${totalFinal.toFixed(2)}</strong>`;
}

function validarCamposCheckout() {
  const bairro = inputBairro.value;
  const pagamento = selectPagamento.value;
  const confirmacao = autoselecionarBairro(bairro);

  if (confirmacao) {
    inputBairro.classList.remove("invalido");
    inputBairro.classList.add("valido");

    atualizarFreteETotal(bairro);
    btnFinalizar.disabled = !pagamento;
  } else if (bairro) {
    inputBairro.classList.remove("valido");
    inputBairro.classList.add("invalido");

    atualizarFreteETotal(null);
    btnFinalizar.disabled = true;
  } else {
    inputBairro.classList.remove("valido", "invalido");
    atualizarFreteETotal(null);
    btnFinalizar.disabled = true;
  }
}

inputBairro.addEventListener("input", validarCamposCheckout);
selectPagamento.addEventListener("change", validarCamposCheckout);

  function normalizarListaBairros() {
  return Object.keys(fretePorBairro);
}

function autoselecionarBairro(valorDigitado) {
  const valorNormalizado = normalizarBairro(valorDigitado);
  const bairrosValidos = normalizarListaBairros();

  // verifica correspondência EXATA
  return bairrosValidos.find(b => b === valorNormalizado) || null;
}

  function atualizarFreteETotal(bairroDigitado) {
  const previewFrete = document.getElementById("frete-preview");
  const previewTotal = document.getElementById("total-final-preview");

  if (!bairroEhValido(bairroDigitado)) {
    previewFrete.innerText = "Frete: —";
    previewTotal.innerHTML = "<strong>Total com frete: —</strong>";
    return;
  }

  const bairroNormalizado = normalizarBairro(bairroDigitado);
  const frete = fretePorBairro[bairroNormalizado] ?? 20;

  const totalProdutos = Number(
    totalEl.innerText.replace("R$", "").replace(",", ".")
  );

  const totalFinal = totalProdutos + frete;

  previewFrete.innerText = `Frete: R$ ${frete.toFixed(2)}`;
  previewTotal.innerHTML =
    `<strong>Total com frete: R$ ${totalFinal.toFixed(2)}</strong>`;
}

function render() {
  lista.innerHTML = "";
  let total = 0;

  if (carrinho.length === 0) {
    lista.innerHTML = "<p>🛒 Seu carrinho está vazio.</p>";
    totalEl.innerText = "R$ 0,00";
    return;
  }

  carrinho.forEach((p, i) => {
    const preco = Number(p.preco.replace("R$", "").replace(",", "."));
    total += preco * p.quantidade;

  lista.innerHTML += `
  <div class="item">
    <img src="${p.imagem}" alt="${p.nome}">
    <div class="info">
      <strong>${p.nome}</strong>
      <p>Cor: ${p.cor} | Tamanho: ${p.tamanho}</p>
      <p>Preço: ${p.preco}</p>

      <div class="qtd">
        <button onclick="alterar(${i}, -1)">-</button>
        <span>${p.quantidade}</span>
        <button onclick="alterar(${i}, 1)">+</button>
      </div>

      <button class="remover" onclick="remover(${i})">
        Remover item
      </button>
    </div>
  </div>
`;

  });

  totalEl.innerText = `R$ ${total.toFixed(2)}`;
}

function alterar(i, v) {
  carrinho[i].quantidade += v;
  if (carrinho[i].quantidade <= 0) carrinho.splice(i, 1);
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  render();
}

function remover(i) {
  carrinho.splice(i, 1);
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  render();
}

function finalizar() {
  const bairro = document.getElementById("bairro").value;
  const pagamento = document.getElementById("pagamento").value;

  if (!bairro || !pagamento) {
    alert("Informe o bairro e a forma de pagamento.");
    return;
  }

  // ✅ valida se o bairro está na lista
  if (!bairroEhValido(bairro)) {
    alert(
      "Bairro inválido.\n\n" +
      "Selecione um bairro da lista para entrega em Joinville."
    );
    return;
  }

  const frete = fretePorBairro[normalizarBairro(bairro)] ?? 20;
  const total = Number(totalEl.innerText.replace("R$", "").replace(",", "."));
  const totalFinal = total + frete;

  let msg = "🟡 PEDIDO F PAC STORE\n\n";
  carrinho.forEach(p => {
    msg += `${p.nome} - ${p.quantidade}x\n`;
  });

  msg += `\n🚚 Bairro: ${bairro}\n💰 Total: R$ ${totalFinal.toFixed(2)}`;

  fetch("https://script.google.com/macros/s/AKfycbxWHR0AmN0yGU1TCJchxDkThVUV0dwkmhFdnP03k3ITCFLFRtQdq1muENMKJTmXhoA/exec", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      itens: carrinho,
      bairro,
      frete,
      pagamento,
      total: totalFinal
    })
  });

  window.open(
    "https://wa.me/5547997465602?text=" + encodeURIComponent(msg),
    "_blank"
  );

  localStorage.removeItem("carrinho");
  carrinho = [];
  render();
}

render();
</script>
</body>
</html>
