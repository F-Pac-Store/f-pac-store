<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Carrinho | F Pac Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">

  <!-- ÍCONES -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous">

  <!-- CSS DO CABEÇALHO -->
  <link rel="stylesheet" href="css/cabecalho.css">

  <!-- CSS DO CARRINHO -->
  <style>
    .carrinho-wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 16px 80px;
    }

    .carrinho-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .carrinho-topo h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
    }

    .btn-voltar {
      background: var(--primary);
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 8px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.12);
    }

    .resumo {
      margin-top: 30px;
      text-align: right;
    }

    .total {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 24px;
    }

    .acoes {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn-finalizar {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-limpar {
      background: #e5e7eb;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- HEADER PADRÃO -->
  <header class="header">
    <div class="container header-content">

      <a href="index.html" class="logo">
        <img src="imagens/logo-fpac.png" class="logo-img" alt="F Pac Store">
        <span class="logo-text">F PAC STORE</span>
      </a>

      <nav class="nav" id="nav">
        <div class="menu-links">
          <a href="index.html#inicio">Início</a>
          <a href="catalogo.html">Catálogo</a>
          <a href="index.html#produtos">Produtos</a>
        </div>

        <a href="carrinho.html" class="carrinho-icone">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="carrinho-qtd" id="carrinhoQtd">0</span>
        </a>

        <div class="menu-social">
          <a href="https://wa.me/5547997465602" target="_blank">
            <i class="fab fa-whatsapp"></i>
          </a>
          <a href="https://instagram.com/f_pac_store/" target="_blank">
            <i class="fab fa-instagram"></i>
          </a>
        </div>
      </nav>

      <button class="menu-toggle" id="toggle">
        <i class="fas fa-bars"></i>
      </button>

    </div>
  </header>

  <!-- CONTEÚDO DO CARRINHO -->
  <div class="carrinho-wrap">

    <div class="carrinho-topo">
      <h1>Seu Carrinho</h1>
      <a href="index.html" class="btn-voltar">⬅ Voltar ao início</a>
    </div>

    <div class="card">
      <div id="lista"></div>

      <div class="resumo">
        <div class="total" id="total"></div>

        <div class="acoes">
          <button class="btn-finalizar" onclick="finalizarCompra()">Finalizar Compra</button>
          <button class="btn-limpar" onclick="limparCarrinho()">Limpar Carrinho</button>
        </div>
      </div>
    </div>

  </div>

  <!-- JS DO MENU -->
  <script>
    const toggle = document.getElementById('toggle');
    const nav = document.getElementById('nav');

    if (toggle && nav) {
      toggle.onclick = () => nav.classList.toggle('active');
    }
  </script>

</body>
</html>
