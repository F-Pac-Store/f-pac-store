<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho | F Pac Store</title>

  <!-- CSS GLOBAL -->
  <link rel="stylesheet" href="css/header.css">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f4f6f8;
      padding-top: 120px;
    }

    .wrap {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      background: #22c55e;
      border: none;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="container header-content">
    <a href="index.html" class="logo">
      <img src="imagens/logo-fpac.png" class="logo-img">
      <span class="logo-text">F PAC STORE</span>
    </a>
  </div>
</header>

<div class="wrap">
  <div class="card">

    <h1>Seu Carrinho</h1>

    <!-- LISTA -->
    <div id="lista"></div>

    <!-- TOTAL -->
    <div id="totalFinal" style="margin-top:20px; font-size:18px; font-weight:bold;"></div>

    <div style="margin:20px 0;">
  <h3>Calcular frete</h3>

  <input type="text" id="cep" placeholder="Digite seu CEP"
         style="padding:8px; width:160px;">

  <div id="freteResultado" style="margin-top:10px;"></div>
</div>

    <!-- BOTÃO -->
    <button onclick="window.location.href='checkout.html'">
      Ir para Checkout
    </button>

  </div>
</div>

<!-- JS CENTRAL -->
<script src="js/carrinho.js"></script>

</body>
</html>
