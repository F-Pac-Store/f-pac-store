<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrinho | F Pac Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding-top: 80px;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: #003366;
      color: #FFC107;
      text-align: center;
      padding: 20px;
      font-weight: 800;
      z-index: 10;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .item {
      display: flex;
      gap: 16px;
      background: #fff;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      align-items: center;
    }

    .item img {
      width: 90px;
      border-radius: 6px;
    }

    .info {
      flex: 1;
    }

    .info strong {
      display: block;
      margin-bottom: 4px;
    }

    .qtd {
      margin-top: 8px;
      font-weight: 600;
    }

    .total-box {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      text-align: center;
      margin-top: 30px;
    }

    .finalizar {
      margin-top: 12px;
      background: #25D366;
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .vazio {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header>🛒 Seu Carrinho</header>

<div class="container" id="lista"></div>

<div class="container total-box">
  <h3>Total</h3>
  <p id="total">R$ 0,00</p>
  <button class="finalizar">Finalizar Pedido</button>
</div>

<script>
function renderCarrinho() {
  const lista = document.getElementById("lista");
  const totalEl = document.getElementById("total");

  const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

  lista.innerHTML = "";
  let total = 0;

  if (carrinho.length === 0) {
    lista.innerHTML = '<p class="vazio">🛒 Seu carrinho está vazio.</p>';
    totalEl.innerText = "R$ 0,00";
    return;
  }

  carrinho.forEach((item, index) => {
    const preco = Number(
      item.preco.replace("R$", "").replace(",", ".")
    );

    total += preco * item.quantidade;

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <img src="${item.imagem}" alt="${item">
        <strong>${item.nome}</strong>
        <div>Cor: ${item.cor}</div>
        <div>Tamanho: ${item.tamanho}</div>
        <div class="qtd">Quantidade: ${item.quantidade}</div>
        <div><strong>${item.preco}</strong></div>

        <button onclick="removerItem(${index})"
          style="margin-top:10px;background:none;border:none;color:red;font-weight:bold;cursor:pointer">
          Remover
        </button>
      </div>
    `;

    lista.appendChild(div);
  });

  totalEl.innerText =
    "R$ " + total.toFixed(2).replace(".", ",");
}

function removerItem(index) {
  const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

  carrinho.splice(index, 1);

  localStorage.setItem("carrinho", JSON.stringify(carrinho));

  renderCarrinho();
}

// ✅ ESTA LINHA É OBRIGATÓRIA
renderCarrinho();
</script>
</body>
</html>
