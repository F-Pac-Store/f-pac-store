<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carrinho | F Pac Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
font-family:Inter,sans-serif;
background:#f5f5f5;
margin:0;
padding-top:120px;
}

.header{
background:#003366;
position:fixed;
top:0;
width:100%;
height:100px;
display:flex;
align-items:center;
padding:0 20px;
}

.header a{
color:white;
text-decoration:none;
font-weight:700;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
}

.item strong{display:block}

.qtd{
width:60px;
padding:6px;
}

.remove{
background:none;
border:none;
color:#d00;
cursor:pointer;
}

.total{
margin-top:20px;
font-size:1.3rem;
font-weight:800;
}

.btn{
margin-top:30px;
width:100%;
padding:16px;
background:#000;
color:#fff;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:800;
}
</style>
</head>

<body>

<header class="header">
  index.html← Continuar comprando</a>
</header>

<div class="container">
  <div class="card">

    <h1>Seu carrinho</h1>

    <div id="lista"></div>

    <div class="total" id="total"></div>

    <button class="btn" onclick="window.location.href='checkout.html'"></script>

<script>
function renderCarrinho(){
  const lista = document.getElementById("lista");
  const totalDiv = document.getElementById("total");
  const carrinho = getCarrinho();

  lista.innerHTML = "";

  if(carrinho.length === 0){
    lista.innerHTML = "<p>Seu carrinho está vazio.</p>";
    totalDiv.innerText = "";
    return;
  }

  carrinho.forEach((item,index)=>{
    const div = document.createElement("div");
    div.className="item";
    div.innerHTML = `
      <div>
        <strong>${item.nome}</strong>
        <small>${item.variacao?.cor || ""} ${item.variacao?.tamanho || ""}</small>
      </div>
      <input class="qtd" type="number" min="1"
        value="${item.quantidade}"
        onchange="atualizarQuantidade(${index},this.value)">
      <span>R$ ${(item.preco*item.quantidade).toFixed(2)}</span>
      <button class="remove" onclick="removerItem(${index});renderCarrinho()">x</button>
    `;
    lista.appendChild(div);
  });

  totalDiv.innerText = "Total: R$ " + calcularTotal().toFixed(2);
}

renderCarrinho();
</script>

</body>
</html>
