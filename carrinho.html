<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrinho | F Pac Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f5f5f5;
      margin: 0;
    }

    header {
      background: #003366;
      color: #FFC107;
      padding: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 1.4rem;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .item {
      background: white;
      display: flex;
      gap: 15px;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      align-items: center;
    }

    .item img {
      width: 90px;
      border-radius: 6px;
    }

    .info {
      flex: 1;
    }

    .qtd {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }

    .qtd button {
      width: 28px;
      height: 28px;
      background: #FFC107;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .remover {
      background: none;
      border: none;
      color: red;
      cursor: pointer;
      margin-top: 8px;
    }

    .resumo {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    .finalizar {
      background: #25D366;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 15px;
    }

/* Checkout – Bairro e Pagamento */
.checkout-form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 15px;
  margin-bottom: 20px;
}

.checkout-form .campo {
  display: flex;
  flex-direction: column;
  text-align: left;
}

.checkout-form label {
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 6px;
  color: #333;
}

.checkout-form input,
.checkout-form select {
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 0.95rem;
}

/* Mobile */
@media (max-width: 600px) {
  .checkout-form {
    grid-template-columns: 1fr;
  }
}
    
  </style>
</head>

<body>

<header>🛒 Seu Carrinho</header>

<div class="container" id="lista"></div>

<div class="container resumo">
  <h3>Total</h3>
  <p id="total"></p>
<div class="checkout-form">
  <div class="campo">
    <label for="bairro">Bairro para entrega (Joinville)</label>
    <input type="text" id="bairro" placeholder="Ex: Jardim Paraíso">
  </div>

  <div class="campo">
    <label for="pagamento">Forma de pagamento</label>
    <select id="pagamento">
      <option value="">Selecione</option>
      <option>Pix</option>
      <option>Cartão de Crédito</option>
      <option>Cartão de Débito</option>
    </select>
  </div>
</div>

<button class="finalizar" onclick="finalizar()">
  Finalizar Pedido
</button>
</div>

<script>
  let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
  const lista = document.getElementById("lista");
  const totalEl = document.getElementById("total");

const fretePorBairro = {
  "paranaguamirim": 7,
  "joao costa": 12,
  "jarivatuba": 13,
  "adhemar garcia": 13,
  "ulysses guimaraes": 13,
  "fatima": 14,
  "santa catarina": 14,
  "profipo": 14,
  "parque guarani": 13,
  "petropolis": 13,
  "boehmerwald": 13,
  "itaum": 12,
  "floresta": 14,
  "guanabara": 13,

  "aventureiro": 18,
  "boa vista": 17,
  "comasa": 17,
  "espinheiros": 18,
  "iririu": 17,
  "jardim iririu": 17,

  "america": 17,
  "atiradores": 17,
  "bom retiro": 18,
  "centro": 16,
  "costa e silva": 18,
  "gloria": 17,
  "saguacu": 17,
  "santo antonio": 18,
  "jardim sofia": 18,

  "morro do meio": 20,
  "nova brasilia": 20,
  "sao marcos": 20
};

function normalizarBairro(valor) {
  return valor
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

  function render() {
  lista.innerHTML = "";
  let total = 0;

  // ✅ Carrinho vazio → botão desativado
  if (carrinho.length === 0) {
    lista.innerHTML = "<p>🛒 Seu carrinho está vazio.</p>";
    totalEl.innerText = "R$ 0,00";

    const btnFinalizar = document.querySelector(".finalizar");
if (btnFinalizar) {
  btnFinalizar.disabled = true;
  btnFinalizar.style.opacity = "0.6";
}

    return;
  }

  // ✅ Passo 3 — Reativa botão quando houver itens
  document.querySelector(".finalizar").disabled = false;
  document.querySelector(".finalizar").style.opacity = "1";

  carrinho.forEach((p, i) => {
    let preco = Number(
      p.preco.replace("R$", "").replace(",", ".")
    );
    total += preco * p.quantidade;

    lista.innerHTML += `
  <div class="item">
    <img src="${p.imagem}" alt="${p.nome}">
    <div class="info">
          <strong>${p.nome}</strong>
          <p>Cor: ${p.cor} | Tamanho: ${p.tamanho}</p>
          <p>Preço: ${p.preco}</p>

          <div class="qtd">
            <button onclick="alterar(${i}, -1)">-</button>
            <span>${p.quantidade}</span>
            <button onclick="alterar(${i}, 1)">+</button>
          </div>

          <button class="remover" onclick="remover(${i})">
            Remover item
          </button>
        </div>
      </div>
    `;
  });

  totalEl.innerText = "R$ " + total.toFixed(2);
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
}

  function alterar(i, v) {
    carrinho[i].quantidade += v;
    if (carrinho[i].quantidade <= 0) carrinho.splice(i, 1);
    render();
  }

  function remover(i) {
    carrinho.splice(i, 1);
    render();
  }

  function finalizar() {
  const bairro = document.getElementById("bairro").value;
  const pagamento = document.getElementById("pagamento").value;
const chavePix = "f.pac.store@gmail.com"; // ajuste para a sua chave real
  if (!bairro || !pagamento) {
    alert("Informe o bairro e a forma de pagamento.");
    return;
  }

  let msg = "🟡 PEDIDO F PAC STORE\n\n";

  carrinho.forEach(p => {
    msg +=
      `👕 ${p.nome}\n` +
      `🎨 Cor: ${p.cor} | 📏 Tamanho: ${p.tamanho}\n` +
      `📦 Quantidade: ${p.quantidade}\n` +
      `💰 ${p.preco}\n\n`;
  });

// Calcula frete
const bairroNormalizado = normalizarBairro(bairro);
const frete = fretePorBairro[bairroNormalizado] ?? 20;

// Total dos produtos
const valorProdutos = Number(
  totalEl.innerText.replace("R$", "").replace(",", ".")
);

    if (!fretePorBairro[bairroNormalizado]) {
  msg += "⚠️ Frete calculado como valor padrão\n";
}

// Total final
const totalFinal = valorProdutos + frete;

msg += `🚚 Entrega: ${bairro}\n`;
msg += `🚚 Frete: R$ ${frete.toFixed(2)}\n`;
msg += `💳 Pagamento: ${pagamento}\n`;

if (pagamento === "Pix") {
  msg += `🔑 Chave Pix: ${chavePix}\n`;
}

msg +=
  `\n✅ TOTAL: R$ ${totalFinal.toFixed(2)}\n\n` +
  `Envio este pedido para confirmação.`;

  window.open(
    "https://wa.me/5547997465602?text=" + encodeURIComponent(msg),
    "_blank"
  );
    
// ✅ limpa o carrinho depois do envio
carrinho = [];
localStorage.removeItem("carrinho");
render();

}
  
  render();
</script>
  
</body>
</html>
