<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrinho | F PAC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONTE -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheetel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.cssnk rel="stylesheet" href="css/global.cssECÍFICO DO CARRINHO */
    .cart-container{
      max-width:800px;
      margin:auto;
      padding:40px 20px;
    }

    .cart-card{
      background:#fff;
      border-radius:16px;
      padding:24px;
      box-shadow:0 10px 30px rgba(0,0,0,.1);
    }

    .cart-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:12px 0;
      border-bottom:1px solid #eee;
    }

    .cart-item:last-child{
      border-bottom:none;
    }

    .cart-item strong{
      display:block;
    }

    .cart-item input{
      width:60px;
      padding:6px;
    }

    .remove{
      background:none;
      border:none;
      color:#d00;
      cursor:pointer;
      font-weight:800;
    }

    .total{
      margin-top:20px;
      font-size:1.3rem;
      font-weight:800;
      text-align:right;
    }

    .btn-checkout{
      margin-top:30px;
      width:100%;
      padding:16px;
      background:#000;
      color:#fff;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:800;
    }
  </style>
</head>

<body>

  <!-- HEADER GLOBAL -->
  <div id="header-placeholder"></div>

  <main class="cart-container">

    <div class="cart-card">
      <h1>Seu carrinho</h1>

      <div id="lista"></div>

      <div class="total" id="total"></div>

      <button class="btn-checkout" onclick="window.location.href='checkout.htmlin>

  <!-- FOOTER GLOBAL -->
  <div id="footer-placeholder"></div>

  <!-- JS GLOBAL -->
  <script src="js/layout.jsscript src="js/header.js"></script>

  <script>
    /* ======== LÓGICA DO CARRINHO ======== */

    function getCarrinho(){
      return JSON.parse(localStorage.getItem("fpacCarrinho")) || [];
    }

    function salvarCarrinho(carrinho){
      localStorage.setItem("fpacCarrinho", JSON.stringify(carrinho));
    }

    function calcularTotal(){
      return getCarrinho().reduce((acc,item)=>{
        return acc + item.preco * item.quantidade;
      },0);
    }

    function removerItem(index){
      const carrinho = getCarrinho();
      carrinho.splice(index,1);
      salvarCarrinho(carrinho);
      renderCarrinho();
    }

    function atualizarQuantidade(index,qtd){
      const carrinho = getCarrinho();
      carrinho[index].quantidade = Number(qtd);
      salvarCarrinho(carrinho);
      renderCarrinho();
    }

    function renderCarrinho(){
      const lista = document.getElementById("lista");
      const totalDiv = document.getElementById("total");
      const carrinho = getCarrinho();

      lista.innerHTML = "";
      totalDiv.innerText = "";

      if(carrinho.length === 0){
        lista.innerHTML = "<p>Seu carrinho está vazio.</p>";
        return;
      }

      carrinho.forEach((item,index)=>{
        const div = document.createElement("div");
        div.className = "cart-item";

        div.innerHTML = `
          <div>
            <strong>${item.nome}</strong>
            <small>${item.variacao || ""}</small>
          </div>
          <input type="number" min="1" value="${item.quantidade}"
            onchange="atualizarQuantidade(${index},this.value)">
          <span>R$ ${(item.preco * item.quantidade).toFixed(2)}</span>
          <button class="remove" onclick="removerItem(${index})">x</button>
        `;

        lista.appendChild(div);
      });

      totalDiv.innerText = "Total: R$ " + calcularTotal().toFixed(2);
    }

    renderCarrinho();
  </script>

</body>
</html>
