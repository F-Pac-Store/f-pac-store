<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Carrinho | F Pac Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">

  <!-- ICONES -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous">

  <!-- HEADER GLOBAL -->
  <link rel="stylesheet" href="css/header.css">

  <!-- CSS DO CARRINHO -->
  <style>
:root {
  --primary:#003366;
  --accent:#FFC107;
  --success:#22c55e;
  --danger:#ef4444;
  --bg:#f4f6f8;
  --text:#1f2933;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  padding-top: 120px; /* header fixo */
}

.carrinho-wrap {
  max-width: 980px;
  margin: 0 auto;
  padding: 40px 16px 80px;
}

.carrinho-topo {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom: 30px;
}

.carrinho-topo h1 {
  font-size: 2.2rem;
  font-weight: 800;
  color: var(--primary);
}

.btn-voltar {
  background: var(--primary);
  color: var(--accent);
  text-decoration: none;
  font-weight: 700;
  padding: 10px 18px;
  border-radius: 8px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.12);
}

.pedido-id {
  font-weight: 800;
  margin-bottom: 24px;
  color: var(--primary);
  border-left: 5px solid var(--accent);
  padding-left: 12px;
}

.item {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 16px;
  padding: 18px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  margin-bottom: 16px;
}

.item-img {
  width: 90px;
  height: 110px;
  background: #f1f5f9;
  border-radius: 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.item-img img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.item-info strong {
  font-size: 1.05rem;
  color: var(--primary);
  display:block;
  margin-bottom: 4px;
}

.item-linha {
  font-size: 0.85rem;
  margin-top: 6px;
}

.item input {
  width: 80px;
  padding: 6px;
  margin-left: 8px;
}

.subtotal {
  margin-top: 10px;
  background: rgba(255,193,7,0.2);
  padding: 6px 10px;
  border-radius: 6px;
  display:inline-block;
  font-weight: 700;
}

.btn-remover {
  margin-top: 12px;
  background: var(--danger);
  color: #fff;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
}

.resumo {
  margin-top: 30px;
  border-top: 1px solid #e5e7eb;
  padding-top: 24px;
  text-align: right;
}

.total {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 24px;
}

.acoes {
  display:flex;
  flex-direction:column;
  gap:14px;
}

.btn-finalizar {
  background: var(--success);
  color: #fff;
  border: none;
  padding: 16px;
  border-radius: 10px;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
}

.btn-limpar {
  background: #e5e7eb;
  border: none;
  padding: 14px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
}

.vazio {
  text-align:center;
  font-size: 1.1rem;
  padding: 40px 0;
}

@media (max-width: 640px) {
  .item {
    grid-template-columns: 1fr;
    text-align: center;
  }

  .item-img {
    margin: 0 auto;
  }

  .resumo {
    text-align: center;
  }
}
  </style>
</head>

<body>

<!-- HEADER IGUAL AO INDEX -->
<header class="header">
  <div class="container header-content">

    <a href="index.html" class="logo">
      <img src="imagens/logo-fpac.png" class="logo-img" alt="F Pac Store">
      <span class="logo-text">F PAC STORE</span>
    </a>

    <nav class="nav" id="nav">
      <div class="menu-links">
        <a href="index.html#inicio">Início</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="index.html#produtos">Produtos</a>
      </div>

      <a href="carrinho.html" class="carrinho-icone">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="carrinho-qtd" id="carrinhoQtd">0</span>
      </a>

      <div class="menu-social">
        <a href="https://wa.me/5547997465602" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="https://instagram.com/f_pac_store/" target="_blank"><i class="fab fa-instagram"></i></a>
      </div>
    </nav>

    <button class="menu-toggle" id="toggle">
      <i class="fas fa-bars"></i>
    </button>

  </div>
</header>

<!-- CONTEÚDO -->
<div class="carrinho-wrap">

  <div class="carrinho-topo">
    <h1>Seu Carrinho</h1>
    <a href="index.html" class="btn-voltar">⬅ Voltar ao início</a>
  </div>

  <div class="card">
    <div id="lista"></div>

    <div class="resumo">
      <div class="total" id="total"></div>

      <div class="acoes">
        <button class="btn-finalizar" onclick="finalizarCompra()">Finalizar Compra</button>
        <button class="btn-limpar" onclick="limparCarrinho()">Limpar Carrinho</button>
      </div>
    </div>
  </div>

</div>

<script>
const toggle = document.getElementById('toggle');
const nav = document.getElementById('nav');
if (toggle && nav) toggle.onclick = () => nav.classList.toggle('active');
</script>

<!-- TODO O JS DO CARRINHO PERMANECE IGUAL AO SEU -->
</body>
</html>
