<html lang="pt-BR">

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">

  <!-- CSS DO CARRINHO -->
<style>

:root {
  --primary:#003366;
  --accent:#FFC107;
  --success:#22c55e;
  --danger:#ef4444;
  --bg:#f4f6f8;
  --text:#1f2933;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  padding-top: 120px; /* header fixo */
}

.carrinho-wrap {
  max-width: 980px;
  margin: 0 auto;
  padding: 40px 16px 80px;
}

.carrinho-topo {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom: 30px;
}

.carrinho-topo h1 {
  font-size: 2.2rem;
  font-weight: 800;
  color: var(--primary);
}

.btn-voltar {
  background: var(--primary);
  color: var(--accent);
  text-decoration: none;
  font-weight: 700;
  padding: 10px 18px;
  border-radius: 8px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.12);
}

.pedido-id {
  font-weight: 800;
  margin-bottom: 24px;
  color: var(--primary);
  border-left: 5px solid var(--accent);
  padding-left: 12px;
}

.item {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 16px;
  padding: 18px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  margin-bottom: 16px;
}

.item-img {
  width: 90px;
  height: 110px;
  background: #f1f5f9;
  border-radius: 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.item-img img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.item-info strong {
  font-size: 1.05rem;
  color: var(--primary);
  display:block;
  margin-bottom: 4px;
}

.item input {
  width: 80px;
  padding: 6px;
  margin-left: 8px;
}

.btn-remover {
  margin-top: 12px;
  background: var(--danger);
  color: #fff;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
}

.resumo {
  margin-top: 30px;
  border-top: 1px solid #e5e7eb;
  padding-top: 24px;
  text-align: right;
}

.total {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 24px;
}

.acoes {
  display:flex;
  flex-direction:column;
  gap:14px;
}

.btn-finalizar {
  background: var(--success);
  color: #fff;
  border: none;
  padding: 16px;
  border-radius: 10px;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
}

.btn-limpar {
  background: #e5e7eb;
  border: none;
  padding: 14px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
}

.vazio {
  text-align:center;
  font-size: 1.1rem;
  padding: 40px 0;
}

@media (max-width: 640px) {
  .item {
    grid-template-columns: 1fr;
    text-align: center;
  }

  .item-img {
    margin: 0 auto;
  }

  .resumo {
    text-align: center;
  }
}

/* =============================
   MELHORIA DE LEITURA DO ITEM
============================= */

/* Nome do produto */
.item-info > strong {
  font-size: 1rem;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 8px;
}

/* Linhas de informação (layout vertical limpo) */
.item-linha {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 0.9rem;
  color: #374151;
  margin-top: 6px;
}

/* Rótulo */
.item-linha strong {
  color: #111827;
  font-weight: 600;
  white-space: nowrap;
}

/* Valor */
.item-linha span {
  color: #374151;
}

/* Preço destacado */
.subtotal {
  margin-top: 12px;
  background: #fef3c7;
  color: #92400e;
  font-size: 1rem;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 800;
}
  
  </style>
</head>

<body>

<!-- HEADER IGUAL AO INDEX -->
<header class="header">
  <div class="container header-content">

    <a href="index.html" class="logo">
      <img src="imagens/logo-fpac.png" class="logo-img" alt="F Pac Store">
      <span class="logo-text">F PAC STORE</span>
    </a>

    <nav class="nav" id="nav">
  <div class="menu-links">
    <a href="index.html#inicio">Início</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="index.html#produtos">Produtos</a>
  </div>

  <div class="menu-social">
    <a href="https://wa.me/5547997465602" target="_blank">
      <i class="fab fa-whatsapp"></i>

    <a href="https://instagram.com/f_pac_store/" target="_blank">

<!-- CONTEÚDO -->
<div class="carrinho-wrap">

  <div class="carrinho-topo">
    <h1>Seu Carrinho</h1>
    <a href="index.html" class="btn-voltar">⬅ Voltar ao início</a>
  </div>

  <div class="card">
    <div id="lista"></div>

    <div class="resumo">
      <div class="total" id="total"></div>

      <div class="acoes">

  <!-- FINALIZAR PEDIDO -->
  <button class="btn-finalizar" onclick="irParaCheckout()">
    Finalizar Pedido
  </button>

  <!-- LIMPAR CARRINHO -->
  <button class="btn-limpar" onclick="abrirModalLimpar()">
  Limpar Carrinho
</button>
        
</div>

    </div>
  </div>

</div>

<script>
const toggle = document.getElementById('toggle');
const nav = document.getElementById('nav');
if (toggle && nav) toggle.onclick = () => nav.classList.toggle('active');

<!-- TODO O JS DO CARRINHO PERMANECE IGUAL AO SEU -->

<script>
/* =============================
   CARRINHO GLOBAL – F PAC STORE
============================= */

function getCarrinho() {
  return JSON.parse(localStorage.getItem('fpacCarrinho')) || [];
}

function salvarCarrinho(carrinho) {
  localStorage.setItem('fpacCarrinho', JSON.stringify(carrinho));
}

function atualizarContadorCarrinho() {
  const carrinho = getCarrinho();
  const total = carrinho.reduce((soma, item) => soma + item.quantidade, 0);

  document.querySelectorAll('#carrinhoQtd').forEach(el => {
    el.textContent = total;
    el.style.display = total > 0 ? 'inline-block' : 'none';
  });
}

</script>
  
  <script>
function renderCarrinho() {
  const lista = document.getElementById('lista');
  const totalEl = document.getElementById('total');
  const carrinho = getCarrinho();

  lista.innerHTML = '';
  totalEl.innerHTML = '';

  if (carrinho.length === 0) {
    lista.innerHTML = '<p class="vazio">Seu carrinho está vazio.</p>';
    return;
  }

  let total = 0;

  carrinho.forEach(item => {
  const subtotal = item.preco * item.quantidade;
    total += subtotal;

  let detalhes = '';

  // 🔥 PRIME (com personalização)
  if (item.modelo === 'PRIME') {
    detalhes = `
      <div class="pedido-id">
        Nº do Pedido: ${item.pedido?.data || ''} - ${item.pedido?.codigo || ''}
      </div>

      <strong>${item.nome}</strong>

      <div class="item-linha"><strong>Cor da camisa:</strong> ${item.cor}</div>
      <div class="item-linha"><strong>Tamanho da camisa:</strong> ${item.tamanho}</div>

      <div class="item-linha"><strong>Estampa:</strong> ${item.estampa}</div>
      <div class="item-linha"><strong>Local da estampa:</strong> ${item.localEstampa}</div>
      <div class="item-linha"><strong>Tamanho da estampa:</strong> ${item.tamanhoEstampa}</div>

      ${item.observacoes ? `
        <div class="item-linha">
          <strong>Observações:</strong><br>
          ${item.observacoes}
        </div>
      ` : ''}
    `;
  }

  // ✅ FORCE e MARK (modelo pronto)
  else {
  detalhes = `
    <strong>${item.nome}</strong>

    <div class="item-linha"><strong>Cor da camisa:</strong> ${item.cor}</div>
    <div class="item-linha"><strong>Tamanho da camisa:</strong> ${item.tamanho}</div>

    ${item.observacoes ? `
      <div class="item-linha">
        <strong>Observações:</strong><br>
        ${item.observacoes}
      </div>
    ` : ''}
  `;
}

  lista.innerHTML += `
  <div class="item">
    <div class="item-info">

      ${detalhes}

      <div class="item-linha qtd-linha">
  <strong>Quantidade:</strong>

  <div class="qtd-controle">
    <button onclick="alterarQuantidade('${item.id}', -1)">−</button>
    <span class="qtd-valor">${item.quantidade}</span>
    <button onclick="alterarQuantidade('${item.id}', 1)">+</button>
  </div>
</div>

      <div class="subtotal">
        R$ ${subtotal.toFixed(2)}
      </div>

      <button class="btn-remover" onclick="removerItem('${item.id}')">
        Remover
      </button>

    </div>
  </div>
`;
});

  totalEl.innerHTML = 'Total: <strong>R$ ' + total.toFixed(2) + '</strong>';
}

document.addEventListener('DOMContentLoaded', () => {
  atualizarContadorCarrinho();
  renderCarrinho();
});
</script>

<script>
function removerItem(id) {
  const carrinho = getCarrinho().filter(item => item.id !== id);
  salvarCarrinho(carrinho);
  atualizarContadorCarrinho();
  renderCarrinho();
}

function irParaCheckout() {
  const carrinho = getCarrinho();

  if (carrinho.length === 0) {
    alert('Seu carrinho está vazio.');
    return;
  }

  window.location.href = 'checkout.html';
}
</script>

  <script>
function abrirModalLimpar() {
  document.getElementById('confirmarLimpeza').style.display = 'flex';
}

function fecharModalLimpar() {
  document.getElementById('confirmarLimpeza').style.display = 'none';
}

function confirmarLimparCarrinho() {
  localStorage.removeItem('fpacCarrinho');
  atualizarContadorCarrinho();
  renderCarrinho();

  fecharModalLimpar();
  alert('✅ Carrinho limpo com sucesso!');
}
</script>

  <div id="confirmarLimpeza" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  z-index:9999;
  align-items:center;
  justify-content:center;
">

  <div style="
    background:#fff;
    padding:24px;
    border-radius:12px;
    max-width:360px;
    width:90%;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
  ">
    <h3 style="margin-bottom:12px;">⚠️ Limpar carrinho?</h3>
    <p style="font-size:0.95rem; margin-bottom:20px;">
      Tem certeza que deseja remover todos os itens do carrinho?
      <br><strong>Essa ação não poderá ser desfeita.</strong>
    </p>

    <div style="display:flex; gap:12px;">
      <button onclick="confirmarLimparCarrinho()" style="
        flex:1;
        background:#ef4444;
        color:#fff;
        border:none;
        padding:12px;
        border-radius:8px;
        font-weight:700;
        cursor:pointer;
      ">
        Sim, limpar
      </button>

      <button onclick="fecharModalLimpar()" style="
        flex:1;
        background:#e5e7eb;
        border:none;
        padding:12px;
        border-radius:8px;
        font-weight:700;
        cursor:pointer;
      ">
        Cancelar
      </button>
    </div>
  </div>
</div>
