<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime | F Pac Store</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}

.card{
  max-width:500px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
}

label{display:block;margin-top:10px;font-weight:bold}
input,select{width:100%;padding:8px;margin-top:5px}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#000;
  color:#fff;
  border:none;
  cursor:pointer;
}

/* CORES */
.cores{display:flex;gap:10px;margin-top:10px}
.cor{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.cor.ativo{border:2px solid #000}
.branco{background:#fff;border:1px solid #ccc}
.preto{background:#000}
.offwhite{background:#f3e9dc}

/* TAMANHOS */
.sizes{display:flex;gap:10px;margin-top:10px}
.size{width:45px;height:45px;display:flex;align-items:center;justify-content:center;border:1px solid #ccc;border-radius:6px;cursor:pointer}
.size.ativo{background:#000;color:#fff}
</style>
</head>

<body>

<div class="card">

<h2>Camisa PRIME</h2>

<label>Cor</label>
<div class="cores">
<div class="cor branco" onclick="selCor('Branco')"></div>
<div class="cor preto" onclick="selCor('Preto')"></div>
<div class="cor offwhite" onclick="selCor('Off White')"></div>
</div>
<input type="hidden" id="cor" value="Branco">

<label>Tamanho</label>
<div class="sizes">
<div class="size" onclick="selTam('P')">P</div>
<div class="size" onclick="selTam('M')">M</div>
<div class="size" onclick="selTam('G')">G</div>
<div class="size" onclick="selTam('GG')">GG</div>
</div>
<input type="hidden" id="tamanho" value="M">

<label>Quantidade</label>
<input type="number" id="qtd" value="1">

<button onclick="comprar()">Adicionar ao Carrinho</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, increment } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function temEstoque(produto, cor, tamanho){
  const snap = await getDoc(doc(db,"estoque",produto+"_"+cor));
  if(!snap.exists()) return false;
  return (snap.data()[tamanho]||0)>0;
}

async function atualizar(){
  const ok = await temEstoque("PRIME",
  document.getElementById("cor").value,
  document.getElementById("tamanho").value);

  const btn=document.querySelector("button");
  btn.disabled=!ok;
  btn.style.background=ok?"#000":"#999";
  btn.innerText=ok?"Adicionar ao Carrinho":"Esgotado";
}

window.selCor=async function(c){
document.getElementById("cor").value=c;
await atualizar();
}

window.selTam=async function(t){
document.getElementById("tamanho").value=t;
await atualizar();
}

window.comprar=async function(){

const cor=document.getElementById("cor").value;
const tam=document.getElementById("tamanho").value;
const qtd=Number(document.getElementById("qtd").value);

if(!await temEstoque("PRIME",cor,tam)){
alert("Sem estoque");
return;
}

await updateDoc(doc(db,"estoque","PRIME_"+cor),{
[tam]:increment(-qtd)
});

let c=JSON.parse(localStorage.getItem("fpacCarrinho"))||[];

c.push({id:"PRIME-"+Date.now(),nome:"PRIME",cor,tamanho:tam,quantidade:qtd,preco:109.9});

localStorage.setItem("fpacCarrinho",JSON.stringify(c));

window.location.href="carrinho.html";
}

document.addEventListener("DOMContentLoaded",atualizar);

</script>

</body>
</html>
