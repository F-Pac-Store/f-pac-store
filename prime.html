<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PRIME | F PAC STORE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONTE -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- ICONES -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS GLOBAL -->
  <link rel="stylesheet" href="css/global.css">
</head>

<body>

  <!-- HEADER -->
  <div id="header-placeholder"></div>

  <main>

    <!-- PRIME HERO + MOCK -->
    <section class="container produto">

      <!-- MOCK CAMISA -->
      <div class="produto-img prime-mock">

        <img src="assets/img/mocks/camisa-base.png" alt="Camisa PRIME" class="camisa-base">

        <!-- ESTAMPA MOCK -->
        <div id="mock-estampa" class="mock-estampa peito-esquerdo">
          F PAC
        </div>

      </div>

      <!-- INFO -->
      <div class="produto-info">
        <h1>Modelo PRIME</h1>
        <div class="subtitulo">Linha PRIME · Criação exclusiva</div>

        <div class="beneficios">
          <div>✔ Até 3 estampas</div>
          <div>✔ Posições exclusivas</div>
          <div>✔ Ombro incluso</div>
          <div>✔ Peça única</div>
        </div>

        <div class="descricao">
          Visualize em tempo real onde sua estampa será aplicada.
          Cada PRIME é única.
        </div>

        <a href="#builder" class="cta-link">Criar minha PRIME</a>
      </div>

    </section>

    <!-- BUILDER -->
    <section id="builder" class="prime-builder">

      <h2>Monte sua PRIME</h2>
      <p class="prime-intro">Veja sua criação ganhar forma.</p>

      <!-- POSIÇÕES -->
      <div class="prime-step">
        <h3>Posição da estampa</h3>
        <div class="prime-options" data-step="posicao">
          <button data-value="peito-esquerdo">Peito esquerdo</button>
          <button data-value="peito-central">Peito central</button>
          <button data-value="peito-direito">Peito direito</button>
          <button data-value="costas">Costas</button>
          <button data-value="ombro">Ombro (exclusivo)</button>
        </div>
      </div>

      <button class="btn-prime">Continuar personalização</button>

    </section>

  </main>

  <!-- FOOTER -->
  <div id="footer-placeholder"></div>

  <!-- JS -->
  <script src="js/layout.js"></script>
  <script src="js/header.js"></script>
  <script src="js/prime-mock.js"></script>

</body>
</html>
