<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>PRIME | F PAC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* MESMO CSS DO MARK (mantido igual para padrão absoluto) */
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#003366;--accent:#FFC107}
body{font-family:'Inter',sans-serif;background:#f5f5f5}

/* HEADER + NAV + ÍCONES iguais */
.header{background:var(--primary);position:fixed;top:0;width:100%;z-index:1000}
.header-content{display:flex;justify-content:space-between;align-items:center;height:100px;padding:0 30px}
.logo img{height:70px}
.nav{display:flex;gap:42px}
.nav a{color:#fff;text-decoration:none;letter-spacing:2px}
.nav a i{font-size:1.9rem}

.icon-cart i{color:var(--accent);font-size:1.9rem}
.icon-whatsapp i{color:#25D366;font-size:1.9rem}
.icon-instagram i{color:#E1306C;font-size:1.9rem}

/* LAYOUT */
.produto{
max-width:1100px;
margin:140px auto 60px;
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
padding:20px;
}

.produto-img img{
width:100%;
border-radius:18px;
background:#fff;
padding:20px;
}

.beneficios{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin:20px 0;
}

.beneficios div{
background:#fff;
padding:14px;
border-radius:10px;
font-weight:600;
text-align:center;
}

.descricao{margin:20px 0;line-height:1.6}

@media(max-width:768px){
.nav{display:none}
.produto{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="header">
<div class="header-content">
<a href="index.html" class="logo">
<img src="assets/img/logos/f-pac-color.png">
</a>

<nav class="nav">
<a href="index.html">INÍCIO</a>
<a href="index.html#produtos">PRODUTOS</a>
<a href="catalogo.html">CATÁLOGO</a>
</nav>
</div>
</header>

<section class="produto">

<div class="produto-img">
<img src="assets/img/cards/F-PAC-frente-e-costas.png">
</div>

<div class="produto-info">
<h1>Modelo PRIME</h1>

<div class="beneficios">
<div>✔ Tecido leve e resistente</div>
<div>✔ Caimento confortável</div>
<div>✔ Ideal para uso diário</div>
<div>✔ Base para qualquer estampa</div>
</div>

<div class="descricao">
A PRIME é a base da F PAC...
</div>

</section>

</body>
</html>
