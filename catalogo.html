<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Completo | F Pac Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">

  <!-- ÍCONES -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- HEADER GLOBAL -->
  <link rel="stylesheet" href="css/header.css">

  <!-- CSS DO CATÁLOGO -->
  <style>
    :root {
      --primary:#003366;
      --accent:#FFC107;
      --bg:#f4f6f8;
      --text:#1f2933;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      padding-top: 120px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 0 16px;
    }

    /* ============================= */
/* HEADER ESTICADO IGUAL AO INDEX */
/* ============================= */

.header .container {
  max-width: 100%;
  padding-left: 30px;
  padding-right: 30px;
}

    /* ============================= */
    /* CABEÇALHO DA PÁGINA           */
    /* ============================= */

    .catalogo-header {
      text-align: center;
      padding: 40px 0;
    }

    .catalogo-header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .catalogo-header p {
      color: #555;
      font-size: 1.1rem;
    }

    /* ============================= */
    /* GRID DE PRODUTOS              */
    /* ============================= */

    .catalogo-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr); /* ✅ exatamente 5 por linha */
  gap: 24px;
  padding-bottom: 80px;
}

    .card-produto {
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  overflow: hidden;
  transition: transform .25s ease, box-shadow .25s ease;
  text-decoration: none;
  color: inherit;

  max-width: 230px;  /* ✅ deixa o card um pouco maior */
  margin: 0 auto;    /* ✅ centraliza dentro da coluna */
}

    .card-produto:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.2);
    }

    /* IMAGEM */
    .card-produto img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #f8fafc;
      padding: 12px;
    }

    /* INFO */
    .card-info {
      padding: 14px;
      text-align: center;
    }

    .card-info span {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .catalogo-header h1 {
        font-size: 1.9rem;
      }
    }
  </style>
</head>

<body>

<!-- HEADER IGUAL AO INDEX -->
<header class="header">
  <div class="container header-content">

    <a href="index.html" class="logo">
      <img src="imagens/logo-fpac.png" class="logo-img" alt="F Pac Store">
      <span class="logo-text">F PAC STORE</span>
    </a>

    <nav class="nav" id="nav">
      <div class="menu-links">
        <a href="index.html">Início</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="index.html#produtos">Produtos</a>
      </div>

      <a href="carrinho.html" class="carrinho-icone">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="carrinho-qtd" id="carrinhoQtd">0</span>
      </a>

      <div class="menu-social">
        <a href="https://wa.me/5547997465602" target="_blank">
          <i class="fab fa-whatsapp"></i>
        </a>
        <a href="https://instagram.com/f_pac_store/" target="_blank">
          <i class="fab fa-instagram"></i>
        </a>
      </div>
    </nav>

    <button class="menu-toggle" id="toggle">
      <i class="fas fa-bars"></i>
    </button>

  </div>
</header>

<!-- CONTEÚDO -->
<main class="container">

  <div class="catalogo-header">
    <h1>Catálogo Completo</h1>
    <p>Explore todas as estampas disponíveis da F Pac Store</p>
  </div>

  <div class="catalogo-grid">
    <div class="card-produto">
      <img src="imagens/estampas/e1.jpeg" alt="Tropa Urbana">
      <div class="card-info">
        <span>Tropa Urbana – Com Fundo</span>
      </div>
    </div>

    <!-- DUPLIQUE OS CARDS AQUI -->
  </div>

</main>

<script>
const toggle = document.getElementById('toggle');
const nav = document.getElementById('nav');
if (toggle && nav) toggle.onclick = () => nav.classList.toggle('active');

/* =============================
   CONTADOR DO CARRINHO (PADRÃO)
============================= */
function atualizarQtdCarrinho() {
  const carrinho = JSON.parse(localStorage.getItem('fpacCarrinho')) || [];
  const total = carrinho.reduce((soma, item) => soma + item.quantidade, 0);

  const el = document.getElementById('carrinhoQtd');
  if (!el) return;

  el.textContent = total;
  el.style.display = total > 0 ? 'inline-block' : 'none';
}

document.addEventListener('DOMContentLoaded', atualizarQtdCarrinho);
</script>
  
<script>
/* =============================
   CARRINHO GLOBAL – F PAC STORE
============================= */

function getCarrinho() {
  return JSON.parse(localStorage.getItem('fpacCarrinho')) || [];
}

function salvarCarrinho(carrinho) {
  localStorage.setItem('fpacCarrinho', JSON.stringify(carrinho));
}

function adicionarItem(item) {
  const carrinho = getCarrinho();
  const existente = carrinho.find(p => p.id === item.id);

  if (existente) {
    existente.quantidade += item.quantidade;
  } else {
    carrinho.push(item);
  }

  salvarCarrinho(carrinho);
  atualizarContadorCarrinho();
}

function removerItem(id) {
  const carrinho = getCarrinho().filter(item => item.id !== id);
  salvarCarrinho(carrinho);
  atualizarContadorCarrinho();
}

function atualizarContadorCarrinho() {
  const carrinho = getCarrinho();
  const total = carrinho.reduce((soma, item) => soma + item.quantidade, 0);

  document.querySelectorAll('#carrinhoQtd').forEach(el => {
    el.textContent = total;
    el.style.display = total > 0 ? 'inline-block' : 'none';
  });
}

document.addEventListener('DOMContentLoaded', atualizarContadorCarrinho);
</script>
  
</body>
</html>
