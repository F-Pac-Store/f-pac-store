<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Catálogo Completo | F Pac Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box}

:root{
--primary:#003366cc;
--accent:#FFC107;
--bg:#f5f5f5;
--text:#333;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
}

/* ================= HEADER (IGUAL AO INDEX) ================= */

.header{
background:var(--primary);
backdrop-filter:blur(10px);
position:fixed;
width:100%;
top:0;
z-index:1000;
transition:.3s;
}

.header.shrink{
background:#003366ee;
}

.header-content{
display:flex;
justify-content:space-between;
align-items:center;
height:100px;
padding:0 20px;
transition:.3s;
}

.header.shrink .header-content{height:70px}

.logo img{
height:70px;
transition:.3s;
}

.header.shrink .logo img{
height:50px;
}

/* NAV */
.nav{
display:flex;
gap:30px;
align-items:center;
}

.nav a,
.nav button{
color:white;
text-decoration:none;
font-weight:600;
background:none;
border:none;
cursor:pointer;
font-size:1rem;
}

/* DROPDOWN */
.dropdown{position:relative}

.dropdown-menu{
position:absolute;
top:150%;
left:0;
background:#001a33;
min-width:180px;
border-radius:12px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.4);
opacity:0;
visibility:hidden;
transform:translateY(-10px);
transition:.3s;
}

.dropdown.open .dropdown-menu{
opacity:1;
visibility:visible;
transform:none;
}

.dropdown-menu a{
display:block;
padding:14px 18px;
color:white;
}

/* ================= HERO CATÁLOGO ================= */

.hero{
margin-top:100px;
height:260px;
background:url('assets/img/hero-003.png') no-repeat center / cover;
display:flex;
align-items:center;
justify-content:center;
position:relative;
color:white;
text-align:center;
}

.hero::after{
content:'';
position:absolute;
inset:0;
background:linear-gradient(to bottom,rgba(0,0,0,.4),rgba(0,0,0,.7));
}

.hero-content{
position:relative;
z-index:1;
}

.hero h1{
font-size:2.5rem;
font-weight:800;
}

.hero p{
margin-top:10px;
color:#ddd;
}

/* ================= GRID ================= */

.container{
max-width:1200px;
margin:auto;
padding:80px 20px;
}

.catalogo-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:30px;
}

.card-produto{
background:#fff;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
overflow:hidden;
transition:.3s;
cursor:pointer;
}

.card-produto:hover{
transform:translateY(-6px);
box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.card-produto img{
width:100%;
height:280px;
object-fit:contain;
background:#f8fafc;
padding:16px;
}

.card-info{
text-align:center;
padding:14px;
font-weight:800;
color:var(--primary);
}

/* ================= MODAL ================= */

.modal-preview{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

.modal-preview.ativo{display:flex}

.modal-conteudo{
background:#fff;
border-radius:12px;
padding:16px;
max-width:90vw;
max-height:90vh;
position:relative;
}

.modal-conteudo img{
max-width:100%;
max-height:80vh;
object-fit:contain;
}

.modal-fechar{
position:absolute;
top:-10px;
right:-10px;
width:34px;
height:34px;
border-radius:50%;
border:none;
background:#ef4444;
color:white;
font-size:20px;
cursor:pointer;
}

</style>
</head>

<body>

<header class="header" id="header">
  <div class="header-content">
    <a href="index.html" class="logo">
      <img src="assets/img/logos/f-pac-color.png">
    </a>

    <nav class="nav">
      <a href="index.html">Início</a>

      <div class="dropdown" id="dropdownProdutos">
        <button id="btnProdutos">Produtos <i class="fa fa-chevron-down"></i></button>
        <div class="dropdown-menu">
          <a href="force.html">Force</a>
          <a href="mark.html">Mark</a>
          <a href="prime.html">Prime</a>
        </div>
      </div>

      <a href="catalogo.html">Catálogo</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Catálogo Completo</h1>
    <p>Explore todas as estampas disponíveis da F Pac Store</p>
  </div>
</section>

<main class="container">
  <div class="catalogo-grid">

    <div class="card-produto" onclick="abrirPreview(this.querySelector('img').src)">
      <img src="assets/img/estampas/f-pac-color.png">
      <div class="card-info">F PAC</div>
    </div>

    <div class="card-produto" onclick="abrirPreview(this.querySelector('img').src)">
      <img src="assets/img/estampas/f-pac-camaleao.png">
      <div class="card-info">F PAC Camaleão</div>
    </div>

    <!-- DUPLIQUE OS CARDS -->

  </div>
</main>

<div id="modalPreview" class="modal-preview">
  <div class="modal-conteudo">
    <button class="modal-fechar" onclick="fecharPreview()">×</button>
    <img id="modalImagem">
  </div>
</div>

<script>
// header shrink
window.addEventListener("scroll",()=>{
document.getElementById("header")
.classList.toggle("shrink",window.scrollY>50);
});

// dropdown
const dropdown=document.getElementById("dropdownProdutos");
document.getElementById("btnProdutos").onclick=e=>{
e.stopPropagation();
dropdown.classList.toggle("open");
};
document.onclick=()=>dropdown.classList.remove("open");

// modal
function abrirPreview(src){
document.getElementById("modalImagem").src=src;
document.getElementById("modalPreview").classList.add("ativo");
}
function fecharPreview(){
document.getElementById("modalPreview").classList.remove("ativo");
}
</script>

</body>
</html>
``
