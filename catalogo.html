<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Completo | F Pac Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte padrão -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    
    body {
  font-family: 'Inter', sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding-top: 140px; /* ✅ espaço para o header */
}

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #555;
      margin-bottom: 40px;
    }

    .catalogo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .estampa {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      text-align: center;
    }

    .estampa img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .estampa span {
      font-size: 0.85rem;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .catalogo-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

.header {
              background: var(--primary);
              color: var(--white);
              position: fixed;
              width: 100%;
              top: 0;
              z-index: 1000;
            }
        /* HEADER - FAIXA DO MENU (DESKTOP) */
        
        .header-content {
          display: flex;
          align-items: center;
          justify-content: space-between;
        
          height: 120px;      /* aumenta a faixa azul */
          padding: 0 15px;   /* respiro lateral */
        }
        
            /* LOGO */
        
            .logo {
              display: flex;
              align-items: center;
              gap: 14px;
              text-decoration: none;
            }
        
            .logo-img {
              max-height: 85px;
            }
        
            .logo-text {
              font-family: 'blacklisted', sans-serif;
              font-size: 2.2rem;
              letter-spacing: 3px;
              line-height: 1;
              color: #000000;
              -webkit-text-stroke: 2.3px #FFC107;
              display: flex;
              align-items: center;
            }
        
            @media (min-width: 768px) {
              .logo-img {
                max-height: 90px;
              }
        
              .logo-text {
          color: #FFC107;
          -webkit-text-stroke: 1.5px #000;
          text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
        }
            }
            /* MENU DE NAVEGAÇÃO */
        
            .nav {
              display: none;
              gap: 25px;
            }
        /* LINKS DO MENU (PADRONIZAÇÃO) */
        /* Mesma fonte, tamanho e peso */
            
        .nav a {
          font-family: 'Inter', sans-serif; /* Fonte única */
          font-size: 1rem;                  /* Mesmo tamanho */
          font-weight: 600;                 /* Mesmo peso */
          color: white;
          text-decoration: none;
        }
        
            .menu-toggle {
              font-size: 2rem;
              background: none;
              border: none;
              color: white;
            }
        
        /* Hover opcional (desktop) */
        
        .menu-toggle {
          font-size: 1.6rem;
          background: none;
          border: none;
          color: white;
          transition: color 0.3s ease;
        }
        
            .nav.active {
              display: flex;
              flex-direction: column;
              position: absolute;
              width: 100%;
              background: var(--primary);
              top: 90px;
              left: 0;
              padding: 20px;
              gap: 15px;
            }
        
            @media (min-width: 768px) {
              .nav {
                display: flex;
              }
        
              .menu-toggle {
                display: none;
              }
            }
    
  </style>

</head>

  <header class="header">
        <div class="container header-content">

            <a href="#" class="logo">
                <img src="imagens/logo-fpac.png" class="logo-img" alt="F Pac Store">
                <span class="logo-text">F PAC STORE</span>
            </a>

            <nav class="nav" id="nav">

    <!-- LINKS DO MENU -->
    <div class="menu-links">
  <a href="index.html">Início</a>
  <a href="catalogo.html">Catálogo</a>
  <a href="index.html#produtos">Produtos</a>
  <a href="index.html#criar" class="menu-vertical">Criar Camisa</a>
</div>

   <!-- ICONES SOCIAIS -->
<div class="menu-social">

    <!-- ✅ Carrinho será reativado na Parte 1 -->

    <!-- WhatsApp -->
    <a href="https://wa.me/5547997465602" target="_blank" aria-label="WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Instagram -->
    <a href="https://instagram.com/f_pac_store/" target="_blank" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
    </a>

</div>

</nav>

            <button class="menu-toggle" id="toggle">
                <i class="fas fa-bars"></i>
            </button>

        </div>
    </header>

  <div class="container">
    <h1>Catálogo Completo</h1>
    <p>Todas as estampas disponíveis</p>

    <div class="catalogo-grid">

      <!-- ESTAMPA 1 -->
      <div class="estampa">
        <img src="imagens/estampas/e1.jpeg">
        <span>E01 – Tropa Urbana – Com Fundo</span>
      </div>

      <!-- ESTAMPA 2 -->
      <div class="estampa">
        <img src="imagens/estampas/e2.png">
        <span>E01 – Tropa Urbana – Sem Fundo</span>
      </div>

      <!-- ESTAMPA 3 -->
      <div class="estampa">
        <img src="imagens/estampas/e3.jpeg">
        <span>E02 – Tropa Urbana – Com Fundo</span>
      </div>

      <!-- ESTAMPA 4 -->
      <div class="estampa">
        <img src="imagens/estampas/e4.png">
        <span>E02 – Tropa Urbana – Sem Fundo</span>
      </div>

      <!-- ✅ continue adicionando aqui -->

    </div>
  </div>

</body>

</html>
