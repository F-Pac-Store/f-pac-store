<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Catálogo Completo | F Pac Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--primary:#003366cc;
--accent:#FFC107;
--bg:#f5f5f5;
--text:#333;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
}

/* HEADER */
.header{
background:var(--primary);
backdrop-filter:blur(10px);
position:fixed;
width:100%;
top:0;
z-index:1000;
transition:.3s;
}

.header.shrink{background:#003366ee}

.header-content{
display:flex;
justify-content:space-between;
align-items:center;
height:100px;
padding:0 20px;
}

.logo img{height:70px}

/* NAV */
.nav{
display:flex;
gap:30px;
align-items:center;
}

.nav a,
.nav button{
color:white;
text-decoration:none;
font-weight:600;
background:none;
border:none;
cursor:pointer;
}

/* HERO */
.hero{
margin-top:100px;
height:260px;
background:url('assets/img/hero-003.png') center/cover;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.container{
max-width:1200px;
margin:auto;
padding:80px 20px;
}

.catalogo-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:30px;
}

.card-produto{
background:#fff;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
cursor:pointer;
overflow:hidden;
}

.card-produto img{
width:100%;
height:280px;
object-fit:contain;
padding:16px;
}
.card-info{
font-weight:800;
text-align:center;
padding:14px;
}
</style>
</head>

<body>

<header class="header">
  <div class="header-content">
    <a href="index.html" class="logo">
      <img src="assets/img/logos/f-pac-color.png">
    </a>
    <nav class="nav">
      <a href="index.html">Início</a>
      <a href="catalogo.html">Catálogo</a>
    </nav>
  </div>
</header>

<section class="hero">
  <h1>Catálogo Completo</h1>
</section>

<main class="container">
<div class="catalogo-grid">

  <div class="card-produto" onclick="location='produto.html?id=force'">
    <img src="assets/img/estampas/f-pac-color.png">
    <div class="card-info">Force</div>
  </div>

  <div class="card-produto" onclick=
    <img src="assets/img/estampas/f-pac-camaleao.png">
    <div class="card-info">Mark</div>
  </div>

  <div class="card-produto" onclick="location='produto.html?id=prime'">
    <img src="assets/img/estampas/f-pac-color.png">
    <div class="card-info">Prime</div>
  </div>

</div>
</main>

</body>
</html>
``
