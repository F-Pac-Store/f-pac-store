<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo | F PAC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONTE -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

  <!-- ICONES -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS GLOBAL -->
  <link rel="stylesheet" href="css/global.css">

  <style>
    /* TÍTULO */
    .titulo{
      text-align:center;
      margin-bottom:40px;
    }

    .titulo h1{
      font-size:2rem;
      font-weight:800;
    }

    .titulo p{
      color:#666;
      margin-top:10px;
    }

    /* GRID */
    .produtos-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:30px;
      max-width:1200px;
      margin:auto;
    }

    /* CARD PADRÃO INDEX */
    .card-produto{
      height:380px;
      border-radius:20px;
      overflow:hidden;
      background:#111;
      position:relative;
      transition:.3s;
      cursor:pointer;
    }

    .card-produto img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .card-produto:hover{
      transform:scale(1.03);
    }

    /* OVERLAY PROFISSIONAL */
    .card-produto::after{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(to top, rgba(0,0,0,0.4), transparent);
      opacity:0;
      transition:.3s;
    }

    .card-produto:hover::after{
      opacity:1;
    }

    /* PLACEHOLDER */
    .placeholder{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#aaa;
      font-weight:600;
      font-size:.9rem;
      letter-spacing:1px;
    }
  </style>
</head>

<body>

  <!-- HEADER GLOBAL -->
  <div id="header-placeholder"></div>

  <main class="container">

    <div class="titulo">
      <h1>Catálogo Completo</h1>
      <p>Todas as estampas disponíveis para sua PRIME.</p>
    </div>

    <div class="produtos-grid">

      <div class="card-produto">
        <img src="assets/img/logos/f-pac-color.png" alt="">
      </div>

      <div class="card-produto"><span class="placeholder">Em breve</span></div>
      <div class="card-produto"><span class="placeholder">Em breve</span></div>

      <div class="card-produto">
        <img src="assets/img/logos/FP-preto.png" alt="">
      </div>

      <div class="card-produto"><span class="placeholder">Em breve</span></div>
      <div class="card-produto"><span class="placeholder">Em breve</span></div>

      <div class="card-produto">
        <img src="assets/img/estampas/f-pac-camaleao.png" alt="">
      </div>

      <div class="card-produto"><span class="placeholder">Em breve</span></div>
      <div class="card-produto"><span class="placeholder">Em breve</span></div>

      <div class="card-produto">
        <img src="assets/img/estampas/FP-agua.png" alt="">
      </div>

      <div class="card-produto"><span class="placeholder">Em breve</span></div>
      <div class="card-produto"><span class="placeholder">Em breve</span></div>

      <div class="card-produto">
        <img src="assets/img/estampas/f-pac-bordado.png" alt="">
      </div>

      <div class="card-produto"><span class="placeholder">Em breve</span></div>
      <div class="card-produto"><span class="placeholder">Em breve</span></div>

      <div class="card-produto">
        <img src="assets/img/estampas/FP-pixel.png" alt="">
      </div>

      <div class="card-produto"><span class="placeholder">Em breve</span></div>
      <div class="card-produto"><span class="placeholder">Em breve</span></div>

      <div class="card-produto"><span class="placeholder">Em breve</span></div>

    </div>

  </main>

  <!-- FOOTER GLOBAL -->
  <div id="footer-placeholder"></div>

  <!-- JS GLOBAL -->
  <script src="js/layout.js"></script>
  <script src="js/header.js"></script>

</body>
</html>
