<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Catálogo Completo | F Pac Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FONTES -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- ÍCONES -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- HEADER GLOBAL -->
<link rel="stylesheet" href="css/header.css">

<style>
:root{
--primary:#003366;
--accent:#FFC107;
--bg:#f4f6f8;
--text:#1f2933;
}

body{
margin:0;
font-family:'Inter',sans-serif;
background:var(--bg);
padding-top:120px;
}

.container{
max-width:1200px;
margin:auto;
padding:0 16px;
}

/* header esticado */
.header .container{
max-width:100%;
padding:0 30px;
}

/* CABEÇALHO */
.catalogo-header{
text-align:center;
padding:40px 0;
}
.catalogo-header h1{
font-size:2.4rem;
font-weight:800;
color:var(--primary);
}
.catalogo-header p{
color:#555;
font-size:1.1rem;
}

/* GRID */
.catalogo-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:32px;
padding-bottom:120px;
}

.card-produto{
background:#fff;
border-radius:14px;
box-shadow:0 8px 24px rgba(0,0,0,.12);
max-width:320px;
margin:0 auto;
display:flex;
flex-direction:column;
position:relative;
overflow:hidden;
opacity:0;
transform:translateY(30px);
animation:fadeUp .6s ease forwards;
}

.card-produto img{
width:100%;
height:310px;
object-fit:contain;
background:#f8fafc;
padding:12px;
}

.card-info{
padding:14px;
text-align:center;
margin-top:auto;
}
.card-info span{
font-weight:800;
color:var(--primary);
}

.card-produto::before{
content:"© 2026 F Pac Store";
position:absolute;
top:42%;
left:50%;
transform:translate(-50%,-50%) rotate(-18deg);
font-size:.7rem;
letter-spacing:.12em;
color:rgba(0,0,0,.1);
pointer-events:none;
}

.card-produto::after{
content:"Não é só roupa. É identidade.";
position:absolute;
top:52%;
left:50%;
transform:translate(-50%,-50%) rotate(-18deg);
font-size:.85rem;
letter-spacing:.14em;
color:rgba(0,0,0,.1);
white-space:nowrap;
pointer-events:none;
}

@keyframes fadeUp{
to{opacity:1;transform:none}
}

/* RESPONSIVO */
@media(max-width:1200px){
.catalogo-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
.catalogo-grid{grid-template-columns:1fr}
}

/* MODAL */
.modal-preview{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}
.modal-preview.ativo{display:flex}
.modal-conteudo{
background:#fff;
border-radius:12px;
padding:16px;
max-width:90vw;
max-height:90vh;
position:relative;
}
.modal-conteudo img{
max-width:100%;
max-height:80vh;
object-fit:contain;
}
.modal-fechar{
position:absolute;
top:-12px;
right:-12px;
width:36px;
height:36px;
border-radius:50%;
border:none;
background:#ef4444;
color:#fff;
font-size:20px;
cursor:pointer;
}
</style>
</head>

<body>

<header class="header">
  <div class="container header-content">

    <!-- LOGO SEM TEXTO -->
    <a href="index.html" class="logo">
      <img src="assets/img/estampas/f-pac-color.png" alt="F Pac Store">
    </a>

    <nav class="nav" id="nav">
      <div class="menu-links">
        <a href="index.html">Início</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="index.html#produtos">Produtos</a>
      </div>

      <a href="carrinho.html" class="carrinho-icone">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="carrinho-qtd" id="carrinhoQtd">0</span>
      </a>

      <div class="menu-social">
        <a href="https://wa.me/5547997465602" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="https://instagram.com/f_pac_store/" target="_blank"><i class="fab fa-instagram"></i></a>
      </div>
    </nav>

    <button class="menu-toggle" id="toggle"><i class="fas fa-bars"></i></button>
  </div>
</header>

<main class="container">
  <div class="catalogo-header">
    <h1>Catálogo Completo</h1>
    <p>Explore todas as estampas disponíveis da F Pac Store</p>
  </div>

  <div class="catalogo-grid">

    <div class="card-produto">
      <img src="assets/img/estampas/f-pac-color.png" onclick="abrirPreview(this.src)">
      <div class="card-info"><span>F PAC</span></div>
    </div>

    <div class="card-produto">
      <img src="assets/img/estampas/f-pac-camaleao.png" onclick="abrirPreview(this.src)">
      <div class="card-info"><span>F PAC Camaleão</span></div>
    </div>

    <!-- DUPLIQUE OS CARDS AQUI -->

  </div>
</main>

<div id="modalPreview" class="modal-preview">
  <div class="modal-conteudo">
    <button class="modal-fechar" onclick="fecharPreview()">×</button>
    <img id="modalImagem">
  </div>
</div>

<script>
function abrirPreview(src){
document.getElementById("modalImagem").src=src;
document.getElementById("modalPreview").classList.add("ativo");
}
function fecharPreview(){
document.getElementById("modalPreview").classList.remove("ativo");
}
</script>

</body>
</html>
