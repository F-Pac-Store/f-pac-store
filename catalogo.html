<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Completo | F Pac Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte padrão -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
body {
  padding-top: 140px; /* ✅ espaço para header fixo */
}
    
    body {
  font-family: 'Inter', sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding-top: 140px; /* ✅ espaço para o header */
}

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #555;
      margin-bottom: 40px;
    }

    .catalogo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .estampa {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      text-align: center;
    }

    .estampa img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .estampa span {
      font-size: 0.85rem;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .catalogo-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>

</head>

<body>

  <header class="header">
        <div class="container header-content">

            <a href="#" class="logo">
                <img src="imagens/logo-fpac.png" class="logo-img" alt="F Pac Store">

            </a>

            <nav class="nav" id="nav">

    <!-- LINKS DO MENU -->
    <div class="menu-links">
        <a href="#inicio">Início</a>
        <a href="#catalogo">Catálogo</a>
        <a href="#produtos">Produtos</a>
        <a href="#criar" class="menu-vertical">Criar Camisa</a>
    </div>

   <!-- ICONES SOCIAIS -->
<div class="menu-social">

    <!-- ✅ Carrinho será reativado na Parte 1 -->

    <!-- WhatsApp -->
    <a href="https://wa.me/5547997465602" target="_blank" aria-label="WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Instagram -->
    <a href="https://instagram.com/f_pac_store/" target="_blank" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
    </a>

</div>

</nav>

            <button class="menu-toggle" id="toggle">
                <i class="fas fa-bars"></i>
            </button>

        </div>
    </header>

  <div class="container">

      <div class="estampa">

      </div>

      <!-- ESTAMPA 2 -->

        <img src="imagens/estampas/e2.png">

        <img src="imagens/estampas/e3.jpeg">

  </div>
