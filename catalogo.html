  <style>
    :root {
      --primary:#003366;
      --accent:#FFC107;
      --bg:#f4f6f8;
      --text:#1f2933;
    }

    body {
      margin: 0;

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 0 16px;

    /* ============================= */
/* HEADER ESTICADO IGUAL AO INDEX */
/* ============================= */

.header .container {
  max-width: 100%;
  padding-left: 30px;
  padding-right: 30px;
}

    /* ============================= */
    /* CABEÇALHO DA PÁGINA           */
    /* ============================= */

    .catalogo-header {
      text-align: center;
      padding: 40px 0;
    }

    .catalogo-header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .catalogo-header p {
      color: #555;
      font-size: 1.1rem;
    }

    /* ============================= */
    /* GRID DE PRODUTOS              */
    /* ============================= */

    .catalogo-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* ✅ 4 cards grandes por linha */
  gap: 32px;                             /* ✅ mais respiro */
  padding-bottom: 120px;                /* ✅ evita “corte” no final */
}

    .card-produto {
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  transition: transform .25s ease, box-shadow .25s ease;
  text-decoration: none;
  color: inherit;

  max-width: 320px;      /* ✅ card realmente grande */
  height: 100%;          /* ✅ nunca corta */
  display: flex;
  flex-direction: column;

  margin: 0 auto;
}

    /* =============================
   ANIMAÇÃO DE ENTRADA DOS CARDS
============================= */

.card-produto {
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 0.6s ease forwards;
}

/* Delay progressivo para efeito cascata */
.card-produto:nth-child(1) { animation-delay: 0.05s; }
.card-produto:nth-child(2) { animation-delay: 0.10s; }
.card-produto:nth-child(3) { animation-delay: 0.15s; }
.card-produto:nth-child(4) { animation-delay: 0.20s; }
.card-produto:nth-child(5) { animation-delay: 0.25s; }
.card-produto:nth-child(6) { animation-delay: 0.30s; }
.card-produto:nth-child(7) { animation-delay: 0.35s; }
.card-produto:nth-child(8) { animation-delay: 0.40s; }

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

    .card-produto:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.2);
    }

    /* IMAGEM */
    .card-produto img {
  width: 100%;
  height: 310px;          /* ✅ proporcional ao card maior */

  object-fit: contain;

  display: block;
  margin: 0 auto;

  background: #f8fafc;
  padding: 12px;
  box-sizing: border-box;
}

    /* INFO */
    .card-info {
  padding: 14px;
  text-align: center;

  margin-top: auto; /* ✅ empurra o texto para o fundo do card */
}
    .card-info span {
  display: block;
  font-size: 1.05rem; /* 🔼 mais forte */
  font-weight: 800;
  color: var(--primary);
}

    /* MOBILE */
    @media (max-width: 600px) {
      .catalogo-header h1 {
        font-size: 1.9rem;
      }
    }

/* =============================
   RESPONSIVIDADE DO GRID
============================= */

/* Tablet */
@media (max-width: 1200px) {
  .catalogo-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .catalogo-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 480px) {
  .catalogo-grid {
    grid-template-columns: 1fr;
  }
}

    /* =============================

============================= */

  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.modal-preview.ativo {

.modal-conteudo {

  background: #fff;

  padding: 16px;
  max-width: 90vw;
  max-height: 90vh;
}

.modal-conteudo img {

.modal-fechar {

  top: -12px;
  right: -12px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: #ef4444;
  color: #fff;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
}

<script>
const toggle = document.getElementById('toggle');
const nav = document.getElementById('nav');
if (toggle && nav) toggle.onclick = () => nav.classList.toggle('active');

/* =============================
   CONTADOR DO CARRINHO (PADRÃO)
============================= */
function atualizarQtdCarrinho() {
  const carrinho = JSON.parse(localStorage.getItem('fpacCarrinho')) || [];
  const total = carrinho.reduce((soma, item) => soma + item.quantidade, 0);

  const el = document.getElementById('carrinhoQtd');
  if (!el) return;

  el.textContent = total;
  el.style.display = total > 0 ? 'inline-block' : 'none';
}

document.addEventListener('DOMContentLoaded', atualizarQtdCarrinho);
</script>
  
<script>
/* =============================
   CARRINHO GLOBAL – F PAC STORE
============================= */

function getCarrinho() {
  return JSON.parse(localStorage.getItem('fpacCarrinho')) || [];
}

function salvarCarrinho(carrinho) {
  localStorage.setItem('fpacCarrinho', JSON.stringify(carrinho));
}

function adicionarItem(item) {
  const carrinho = getCarrinho();
  const existente = carrinho.find(p => p.id === item.id);

  if (existente) {
    existente.quantidade += item.quantidade;
  } else {
    carrinho.push(item);
  }

  salvarCarrinho(carrinho);
  atualizarContadorCarrinho();
}

function removerItem(id) {
  const carrinho = getCarrinho().filter(item => item.id !== id);
  salvarCarrinho(carrinho);
  atualizarContadorCarrinho();
}

function atualizarContadorCarrinho() {
  const carrinho = getCarrinho();
  const total = carrinho.reduce((soma, item) => soma + item.quantidade, 0);

  document.querySelectorAll('#carrinhoQtd').forEach(el => {
    el.textContent = total;
    el.style.display = total > 0 ? 'inline-block' : 'none';
  });
}

document.addEventListener('DOMContentLoaded', atualizarContadorCarrinho);
</script>

  <!-- MODAL DE PREVIEW DA ESTAMPA -->
<div id="modalPreview" class="modal-preview">
  <div class="modal-conteudo">
    <button class="modal-fechar" onclick="fecharPreview()">×</button>
    <img id="modalImagem" src="" alt="Preview da Estampa">
  </div>
</div>

  <script>
function abrirPreview(src) {
  const modal = document.getElementById('modalPreview');
  const img = document.getElementById('modalImagem');

  img.src = src;
  modal.classList.add('ativo');
}

function fecharPreview() {
  const modal = document.getElementById('modalPreview');
  modal.classList.remove('ativo');
}

/* Fecha ao clicar fora da imagem */
document.getElementById('modalPreview').addEventListener('click', (e) => {
  if (e.target.id === 'modalPreview') {
    fecharPreview();
  }
});
</script>

  <script>
const cards = document.querySelectorAll('.card-produto');

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('aparecer');
    }
  });
}, {
  threshold: 0.2
});

cards.forEach(card => observer.observe(card));
</script>
