    .icon-whatsapp i{color:#25D366}
    .icon-instagram i{color:#E1306C}

    .icon-cart{position:relative}
    .cart-badge{
      position:absolute;
      top:-6px;
      right:-10px;
      background:var(--accent);
      color:#000;
      font-size:11px;
      font-weight:800;
      border-radius:50%;
      padding:3px 6px;
    }

    /* CONTEÚDO */
    .container{
      max-width:1400px;
      margin:auto;
      padding:140px 30px 80px;
    }

    .titulo{
      text-align:center;
      margin-bottom:50px;
    }

    .titulo h1{
      font-size:2.2rem;
      font-weight:800;
    }

    .titulo p{
      margin-top:14px;
      color:#555;
      max-width:700px;
      margin-left:auto;
      margin-right:auto;
      line-height:1.6;
    }

    /* GRID DE PRODUTOS - PADRÃO DESTAQUES */
    .produtos-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:30px;
    }

    .card-full{
      height:260px;
      border-radius:18px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 10px 25px rgba(0,0,0,.10);
      transition:.3s ease;
      cursor:pointer;
    }

    .card-full img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .card-full:hover{
      transform:translateY(-6px);
      box-shadow:0 18px 40px rgba(0,0,0,.15);
    }

    /* RESPONSIVO */
    @media(max-width:1200px){
      .produtos-grid{
        grid-template-columns:repeat(3,1fr);
      }
    }

    @media(max-width:900px){
      .produtos-grid{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:600px){
      .produtos-grid{
        grid-template-columns:1fr;
      }
      .nav{display:none}
    }
  </style>
</head>
