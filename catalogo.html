<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Catálogo Completo | F Pac Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary:#003366;
      --accent:#FFC107;
      --bg:#f5f5f5;
      --text:#333;
      --header-height:120px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:'Inter', sans-serif;
      background:var(--bg);
      color:var(--text);
      padding-top:var(--header-height);
    }

    .container {
      max-width:1200px;
      margin:auto;
      padding:0 20px;
    }

    /* HEADER */
    .header {
      background:var(--primary);
      position:fixed;
      top:0;
      width:100%;
      z-index:1000;
    }

    .header-content {
      display:flex;
      justify-content:space-between;
      align-items:center;
      height:var(--header-height);
    }

    .logo {
      display:flex;
      align-items:center;
      gap:14px;
      text-decoration:none;
    }

    .logo-img {
      max-height:85px;
    }

    .logo-text {
      font-family:'blacklisted',sans-serif;
      font-size:2.2rem;
      letter-spacing:3px;
      color:#FFC107;
      -webkit-text-stroke:1.5px #000;
      text-shadow:2px 2px 6px rgba(0,0,0,.6);
    }

    .nav {
      display:none;
      gap:25px;
      align-items:center;
    }

    .menu-links {
      display:flex;
      gap:25px;
    }

    .menu-links a {
      color:#fff;
      font-weight:600;
      text-decoration:none;
    }

    .menu-social {
      display:flex;
      gap:15px;
    }

    .menu-social i {
      font-size:2.4rem;
    }

    .menu-toggle {
      font-size:2rem;
      background:none;
      border:none;
      color:white;
    }

    .nav.active {
      display:flex;
      flex-direction:column;
      position:absolute;
      top:120px;
      left:0;
      width:100%;
      background:var(--primary);
      padding:20px;
      gap:20px;
    }

    @media (min-width:768px) {
      .nav { display:flex; }
      .menu-toggle { display:none; }
    }

    .carrinho-icone {
      position:relative;
      color:#fff;
      font-size:1.6rem;
    }

    .carrinho-qtd {
      position:absolute;
      top:-6px;
      right:-10px;
      background:#FFC107;
      color:#000;
      font-size:.7rem;
      padding:2px 6px;
      border-radius:50%;
      font-weight:700;
    }

    /* CATÁLOGO */
    .catalogo-page {
      padding:40px 0 80px;
    }

    .catalogo-page h1 {
      text-align:center;
      font-size:2.4rem;
      margin-bottom:40px;
      font-weight:800;
    }

    .catalogo-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:16px;
    }

    .estampa {
      background:#fff;
      border-radius:10px;
      padding:8px;
      text-align:center;
      box-shadow:0 6px 18px rgba(0,0,0,.12);
    }

    .estampa img {
      width:100%;
      height:160px;
      object-fit:contain;
    }

    .estampa span {
      display:block;
      font-size:.85rem;
      font-weight:600;
      margin:6px 0;
    }

    .estampa button {
      width:100%;
      padding:8px;
      background:var(--primary);
      color:#fff;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<header class="header">
  <div class="container header-content">

    <a href="index.html" class="logo">
      <img src="imagens/logo-fpac.png" class="logo-img" alt="F Pac Store">
      <span class="logo-text">F PAC STORE</span>
    </a>

    <nav class="nav" id="nav">
      <div class="menu-links">
        <a href="index.html">Início</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="index.html#produtos">Produtos</a>
      </div>

      <a href="carrinho.html" class="carrinho-icone">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="carrinho-qtd" id="carrinhoQtd">0</span>
      </a>

      <div class="menu-social">
        <a href="https://wa.me/5547997465602" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="https://instagram.com/f_pac_store/" target="_blank"><i class="fab fa-instagram"></i></a>
      </div>
    </nav>

    <button class="menu-toggle" id="toggle">
      <i class="fas fa-bars"></i>
    </button>

  </div>
</header>

<main class="catalogo-page">
  <div class="container">
    <h1>Catálogo Completo</h1>

    <div class="catalogo-grid">
      <div class="estampa">
        <img src="imagens/estampas/e1.jpeg" alt="Tropa Urbana – Com Fundo">
        <span>Tropa Urbana – Com Fundo</span>
        <button onclick="adicionarCarrinho('Tropa Urbana – Com Fundo', 49.90)">Adicionar ao carrinho</button>
      </div>
    </div>

  </div>
</main>

<script>
const toggle = document.getElementById('toggle');
const nav = document.getElementById('nav');

toggle.onclick = () => nav.classList.toggle('active');

function atualizarQtdCarrinho() {
  const c = JSON.parse(localStorage.getItem('carrinho'));
  const el = document.getElementById('carrinhoQtd');
  if (!c || !el) return;
  el.textContent = c.itens.reduce((s,i)=>s+i.qtd,0);
}

document.addEventListener('DOMContentLoaded', atualizarQtdCarrinho);
</script>

</body>
</html>
