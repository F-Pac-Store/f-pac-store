  <style>
    :root {
      --primary: #003366;
      --accent: #FFC107;
      --bg: #f5f5f5;
      --text: #333;
      --white: #fff;
      --header-height: 120px;

      margin: 0;

      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: var(--header-height);
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px;
    }

    /* HEADER */
    .header {
      background: var(--primary);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: var(--header-height);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .logo-img {
      max-height: 85px;
    }

    .logo-text {
      font-family: 'blacklisted', sans-serif;
      font-size: 2.2rem;

    /* CATÁLOGO */
    .catalogo-page {

    }

    .catalogo-page h1 {
      text-align: center;
      font-size: 2.4rem;
      font-weight: 800;
    }

    .catalogo-grid {
  display: grid;

  /* ✅ 5 cards por linha no desktop */
  grid-template-columns: repeat(5, 1fr);

  /* ✅ espaço menor entre os cards */
  gap: 14px;

  /* ✅ evita grid muito largo */
  max-width: 1200px;
  margin: 0 auto;
}

    .estampa {
  background: #fff;
  border-radius: 10px;

  /* ✅ card mais compacto */
  padding: 8px;

  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  text-align: center;
  cursor: pointer;

  transition: transform 0.2s ease;
}
    .estampa:hover {
      transform: translateY(-4px);
    }

    .estampa img {
  width: 100%;
  aspect-ratio: 1 / 1;

  /* ✅ mantém a imagem inteira visível */
  object-fit: contain;

  margin-bottom: 6px;
}

    .estampa span {
      font-size: .85rem;
      font-weight: 600;
    }

    /* RESPONSIVO */
    @media (max-width: 1024px) {
      .catalogo-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .catalogo-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
  .catalogo-grid {
    grid-template-columns: 1fr;
  }
}

<div class="estampa" onclick="selecionarEstampa('CF-001')">

  <script>
function selecionarEstampa(codigoEstampa) {
  const slot = localStorage.getItem('primeSlot');

  if (slot === '1') {
    localStorage.setItem('primeEstampa1', codigoEstampa);
  }

  if (slot === '2') {
    localStorage.setItem('primeEstampa2', codigoEstampa);
  }

  window.location.href = 'index.html#criar';
}

/* ============================= */
/* ADD AO CARRINHO               */
/* ============================= */
function adicionarCarrinho(nome, preco, img) {
  let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

  const existente = carrinho.find(item => item.nome === nome);

  if (existente) {
    existente.qtd += 1;
  } else {
    carrinho.push({
      nome,
      preco,
      img,
      qtd: 1
    });
  }

  localStorage.setItem('carrinho', JSON.stringify(carrinho));
  window.location.href = 'carrinho.html';
}

    /* ============================= */
/* ATUALIZAR ÍCONE DO CARRINHO  */
/* ============================= */
function atualizarQtdCarrinho() {
  const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
  const totalItens = carrinho.reduce((soma, item) => soma + item.qtd, 0);

  const qtd = document.getElementById('carrinhoQtd');
  if (qtd) {
    qtd.textContent = totalItens;
    qtd.style.display = totalItens > 0 ? 'block' : 'none';
  }
}

atualizarQtdCarrinho();
  
</script>

<script>
const toggle = document.getElementById('toggle');
const nav = document.getElementById('nav');

if (toggle && nav) {
  toggle.onclick = () => {
    nav.classList.toggle('active');
  };

  document.querySelectorAll('.nav a').forEach(link => {
    link.addEventListener('click', () => {
      nav.classList.remove('active');
    });
  });
}
