</main>

<script>
function obterCarrinho() {
  return JSON.parse(localStorage.getItem('carrinho')) || {
    id: 'FPAC-' + Date.now(),
    itens: [],
    total: 0
  };
}

function salvarCarrinho(c) {
  c.total = c.itens.reduce((s,i)=>s+i.subtotal,0);
  localStorage.setItem('carrinho', JSON.stringify(c));
}

function adicionarCarrinho(nome, preco) {
  const c = obterCarrinho();
  c.itens.push({
    nome, cor:'—', tamanho:'—', qtd:1, preco, subtotal:preco
  });
  salvarCarrinho(c);
  atualizarQtdCarrinho();
  window.location.href = 'carrinho.html';
}

function atualizarQtdCarrinho() {
  const c = JSON.parse(localStorage.getItem('carrinho'));
  const el = document.getElementById('carrinhoQtd');
  if (!c || !el) return;
  el.textContent = c.itens.reduce((s,i)=>s+i.qtd,0);
}
document.addEventListener('DOMContentLoaded', atualizarQtdCarrinho);

/* MENU MOBILE */
toggle.onclick = ()=> nav.classList.toggle('active');
</script>
