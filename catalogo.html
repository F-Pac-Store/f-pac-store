<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Catálogo Completo | F Pac Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    crossorigin="anonymous">

  <style>
    :root {
      --primary: #003366;
      --accent: #FFC107;
      --bg: #f5f5f5;
      --text: #333;
      --white: #fff;
      --header-height: 120px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: var(--header-height);
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px;
    }

    /* HEADER */
    .header {
      background: var(--primary);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: var(--header-height);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .logo-img {
      max-height: 85px;
    }

    .logo-text {
      font-family: 'blacklisted', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 3px;
      color: #FFC107;
      -webkit-text-stroke: 1.5px #000;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, .6);
    }

    /* CATÁLOGO */
    .catalogo-page {
      padding: 40px 0 80px;
    }

    .catalogo-page h1 {
      text-align: center;
      font-size: 2.4rem;
      font-weight: 800;
    }

    .catalogo-page p {
      text-align: center;
      margin-bottom: 30px;
      color: #666;
    }

    .catalogo-grid {
  display: grid;

  /* ✅ 5 cards por linha no desktop */
  grid-template-columns: repeat(5, 1fr);

  /* ✅ espaço menor entre os cards */
  gap: 14px;

  /* ✅ evita grid muito largo */
  max-width: 1200px;
  margin: 0 auto;
}

    .estampa {
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
      text-align: center;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .estampa:hover {
      transform: translateY(-4px);
    }

    .estampa img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .estampa span {
      font-size: .85rem;
      font-weight: 600;
    }

    /* SUBTÍTULO CENTRAL */
    .subtitulo-centralizado {
      grid-column: 1 / -1;
      text-align: center;
      margin: 30px 0;
      font-size: 1.1rem;
      font-weight: 600;
      color: #555;
    }

    /* RESPONSIVO */
    @media (max-width: 1024px) {
      .catalogo-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .catalogo-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .catalogo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-content">
      <a href="index.html" class="logo">
        <img src="imagens/logo-fpac.png" class="logo-img" alt="F Pac Store">
        <span class="logo-text">F PAC STORE</span>
      </a>
    </div>
  </header>

  <!-- CATÁLOGO -->
  <main class="catalogo-page">
    <div class="container">

      <h1>Catálogo Completo</h1>
      <p>Todas as estampas com fundo</p>

      <div class="catalogo-grid">

        <!-- COM FUNDO -->
        <div class="estampa" onclick="selecionarEstampa('CF-001')">
          <img src="imagens/estampas/e1.jpeg" alt="E01 – Tropa Urbana – Com Fundo">
          <span>E01 – Tropa Urbana – Com Fundo</span>
        </div>

        <div class="estampa" onclick="selecionarEstampa('CF-002')">
          <img src="imagens/estampas/e3.jpeg" alt="E02 – Tropa Urbana – Com Fundo">
          <span>E02 – Tropa Urbana – Com Fundo</span>
        </div>

        <!-- SUBTÍTULO -->
        <p class="subtitulo-centralizado">Todas as estampas Sem fundo</p>

        <!-- SEM FUNDO -->
        <div class="estampa" onclick="selecionarEstampa('SF-001')">
          <img src="imagens/estampas/e2.png" alt="E01 – Tropa Urbana – Sem Fundo">
          <span>E01 – Tropa Urbana – Sem Fundo</span>
        </div>

        <div class="estampa" onclick="selecionarEstampa('SF-002')">
          <img src="imagens/estampas/e4.png" alt="E02 – Tropa Urbana – Sem Fundo">
          <span>E02 – Tropa Urbana – Sem Fundo</span>
        </div>

      </div>

    </div>
  </main>

  <script>
    function selecionarEstampa(estampa) {
      localStorage.setItem('estampaSelecionada', estampa);
      window.location.href = 'index.html#criar';
    }
  </script>

</body>
</html>
``
