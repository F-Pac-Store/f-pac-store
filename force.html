<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>FORCE | F PAC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body{font-family:'Inter',sans-serif;background:#f5f5f5}

    .produto{
      max-width:1100px;
      margin:60px auto;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:40px;
      padding:20px;
    }

    .produto-img img{
      width:100%;
      border-radius:18px;
      background:#fff;
      padding:20px;
    }

    .produto-info h1{font-size:2.2rem}

    .beneficios{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin:20px 0;
    }

    .beneficios div{
      background:#fff;
      padding:14px;
      border-radius:10px;
      font-weight:600;
      text-align:center;
    }

    .descricao{margin:20px 0;line-height:1.6}
  </style>
</head>

<body>

<section class="produto">
  <div class="produto-img">
    <img src="assets/img/cards/F-PAC-ESCRITA-peito C.png">
  </div>

  <div class="produto-info">
    <h1>Modelo FORCE</h1>

    <div class="beneficios">
      <div>✔ Tecido encorpado premium</div>
      <div>✔ Caimento estruturado</div>
      <div>✔ Alta durabilidade</div>
      <div>✔ Estilo forte e marcante</div>
    </div>

    <div class="descricao">
      A FORCE foi criada para quem prefere comunicar com clareza...
    </div>
  </div>
</section>

</body>
</html>
