<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Force | F Pac Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Inter',sans-serif;
background:#f5f5f5;
}

/* HEADER */
.header{
background:#003366;
position:fixed;
top:0;
width:100%;
height:100px;
display:flex;
align-items:center;
padding:0 30px;
z-index:1000;
}

.logo{
display:flex;
align-items:center;
gap:10px;
color:#FFC107;
font-family:'blacklisted';
text-decoration:none;
}

/* PAGE */
.main{
margin-top:140px;
display:flex;
justify-content:center;
padding:20px;
}

.card{
background:#fff;
border-radius:16px;
padding:24px;
max-width:420px;
width:100%;
box-shadow:0 10px 40px rgba(0,0,0,.15);
text-align:center;
}

.card img{
width:100%;
height:280px;
object-fit:contain;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#000;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:700;
}

/* VARIAÇÕES */
.cores,.sizes{
display:flex;
gap:10px;
justify-content:center;
margin:12px 0;
}

.cor,.size{
border-radius:50%;
cursor:pointer;
}

.cor{
width:28px;height:28px;
border:2px solid transparent;
}

.cor.ativo{border-color:#000}

.branco{background:#fff;border:1px solid #ccc}
.preto{background:#000}
.offwhite{background:#f3e9dc}

.size{
width:42px;height:42px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid #ccc;
border-radius:8px;
}

.size.ativo{
background:#000;
color:#fff;
}
</style>
</head>

<body>

<header class="header">
  <a href="index.html" class="logo">F PAC</a>
</header>

<main class="main">
<div class="card">

<img src="imagens/logo-no-peito.jpg">

<h2>Camisa Force</h2>

<label>Cor</label>
<div class="cores">
  <div class="cor branco ativo" onclick="selCor('Branco')"></div>
  <div class="cor preto" onclick="selCor('Preto')"></div>
  <div class="cor offwhite" onclick="selCor('Off White')"></div>
</div>

<label>Tamanho</label>
<div class="sizes">
  <div class="size" onclick="selTam('P')">P</div>
  <div class="size ativo" onclick="selTam('M')">M</div>
  <div class="size" onclick="selTam('G')">G</div>
  <div class="size" onclick="selTam('GG')">GG</div>
</div>

<label>Quantidade</label>
<input type="number" id="qtd" value="1" min="1">

<button onclick="comprar()">Adicionar ao Carrinho</button>

<input type="hidden" id="cor" value="Branco">
<input type="hidden" id="tamanho" value="M">

</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, increment } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"SUA_API_KEY",
  authDomain:"SEU_PROJETO.firebaseapp.com",
  projectId:"SEU_PROJETO"
});
const db = getFirestore(app);

async function temEstoque(cor,tam){
  const snap = await getDoc(doc(db,"estoque","FORCE_"+cor));
  return snap.exists() && (snap.data()[tam]||0)>0;
}

async function comprar(){
  const cor=corInput.value;
  const tam=tamInput.value;
  const qtd=Number(qtdInput.value);

  if(!await temEstoque(cor,tam)){alert("Sem estoque");return;}

  await updateDoc(doc(db,"estoque","FORCE_"+cor),{[tam]:increment(-qtd)});

  const carrinho=JSON.parse(localStorage.getItem("fpacCarrinho"))||[];
  carrinho.push({id:"FORCE-"+Date.now(),nome:"Force",cor,tamanho:tam,quantidade:qtd,preco:89.9});
  localStorage.setItem("fpacCarrinho",JSON.stringify(carrinho));

  location.href="carrinho.html";
}

const corInput=document.getElementById("cor");
const tamInput=document.getElementById("tamanho");
const qtdInput=document.getElementById("qtd");

window.selCor=c=>{corInput.value=c;};
window.selTam=t=>{tamInput.value=t;};
window.comprar=comprar;
</script>

</body>
</html>
