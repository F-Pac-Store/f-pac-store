<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Force | F Pac Store</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}

.card{
  max-width:400px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  text-align:center;
}

img{width:100%;height:250px;object-fit:contain}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#000;
  color:#fff;
  border:none;
  cursor:pointer;
}

/* CORES */
.cores{display:flex;gap:10px;justify-content:center;margin-top:10px}
.cor{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.cor.ativo{border:2px solid #000}
.branco{background:#fff;border:1px solid #ccc}
.preto{background:#000}
.offwhite{background:#f3e9dc}

/* TAMANHOS */
.sizes{display:flex;gap:10px;justify-content:center;margin-top:10px}
.size{width:45px;height:45px;display:flex;align-items:center;justify-content:center;border:1px solid #ccc;border-radius:6px;cursor:pointer}
.size.ativo{background:#000;color:#fff}
</style>
</head>

<body>

<div class="card">

<img src="imagens/logo-no-peito.jpg">

<h2>Camisa Force</h2>

<label>Cor</label>
<div class="cores">
  <div class="cor branco" onclick="selCor('Branco')"></div>
  <div class="cor preto" onclick="selCor('Preto')"></div>
  <div class="cor offwhite" onclick="selCor('Off White')"></div>
</div>
<input type="hidden" id="cor" value="Branco">

<label>Tamanho</label>
<div class="sizes">
  <div class="size" onclick="selTam('P')">P</div>
  <div class="size" onclick="selTam('M')">M</div>
  <div class="size" onclick="selTam('G')">G</div>
  <div class="size" onclick="selTam('GG')">GG</div>
</div>
<input type="hidden" id="tamanho" value="M">

<label>Quantidade</label>
<input type="number" id="qtd" value="1" min="1">

<button onclick="comprar()">Adicionar ao Carrinho</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, increment } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function temEstoque(produto, cor, tamanho){
  const snap = await getDoc(doc(db,"estoque",produto+"_"+cor));
  if(!snap.exists()) return false;
  return (snap.data()[tamanho]||0)>0;
}

async function atualizar(){
  const ok = await temEstoque(
    "FORCE",
    document.getElementById("cor").value,
    document.getElementById("tamanho").value
  );

  const btn = document.querySelector("button");
  btn.disabled = !ok;
  btn.style.background = ok ? "#000" : "#999";
  btn.innerText = ok ? "Adicionar ao Carrinho" : "Esgotado";
}

window.selCor = async function(cor){
  document.getElementById("cor").value = cor;

  document.querySelectorAll(".cor").forEach(e=>e.classList.remove("ativo"));
  if(cor==="Branco")document.querySelector(".branco").classList.add("ativo");
  if(cor==="Preto")document.querySelector(".preto").classList.add("ativo");
  if(cor==="Off White")document.querySelector(".offwhite").classList.add("ativo");

  await atualizar();
}

window.selTam = async function(t){
  document.getElementById("tamanho").value = t;

  document.querySelectorAll(".size").forEach(e=>e.classList.remove("ativo"));

  const map={P:0,M:1,G:2,GG:3};
  document.querySelectorAll(".size")[map[t]].classList.add("ativo");

  await atualizar();
}

window.comprar = async function(){

  const cor = document.getElementById("cor").value;
  const tamanho = document.getElementById("tamanho").value;
  const qtd = Number(document.getElementById("qtd").value);

  if(!await temEstoque("FORCE",cor,tamanho)){
    alert("Sem estoque");
    return;
  }

  await updateDoc(doc(db,"estoque","FORCE_"+cor),{
    [tamanho]:increment(-qtd)
  });

  let carrinho = JSON.parse(localStorage.getItem("fpacCarrinho"))||[];

  carrinho.push({
    id:"FORCE-"+Date.now(),
    nome:"Camisa Force",
    cor,
    tamanho,
    quantidade:qtd,
    preco:89.90
  });

  localStorage.setItem("fpacCarrinho",JSON.stringify(carrinho));

  window.location.href="carrinho.html";
}

document.addEventListener("DOMContentLoaded",atualizar);

</script>

</body>
</html>
