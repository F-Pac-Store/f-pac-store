<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F Pac Store | Não é só roupa. É identidade!</title>

  <meta name="description" content="Camisas masculinas estampadas para quem se recusa a vestir o comum.">
  <meta name="author" content="F Pac Store">

  <!-- FONTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS (mantido + corrigido) -->
  <style>
    /* ⚠️ CSS IDÊNTICO AO SEU — APENAS LIMPO E ORGANIZADO */
    /* (não removi identidade visual nenhuma) */
    
    :root {
      --primary: #003366;
      --accent: #FFC107;
      --bg: #f5f5f5;
      --text: #333;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* HEADER */
    .header {
      background: var(--primary);
      color: white;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 120px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-img {
      max-height: 80px;
    }

    .logo-text {
      font-family: 'blacklisted';
      letter-spacing: 3px;
      font-size: 2rem;
      color: #FFC107;
      -webkit-text-stroke: 1px #000;
    }

    /* HERO */
    .hero {
      margin-top: 120px;
      min-height: 70vh;
      background: url('https://raw.githubusercontent.com/F-Pac-Store/f-pac-store/main/imagens/capa%20de%20fundo.jpeg') center / cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      position: relative;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.6);
    }

    .hero-content {
      position: relative;
      text-align: center;
      max-width: 700px;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      background: var(--accent);
      color: black;
      padding: 14px 30px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
    }

    /* FOOTER */
    .footer {
      background: #001a33;
      padding: 25px;
      text-align: center;
      color: white;
    }
  </style>
</head>

<body>

<header class="header">
  <div class="container header-content">
    <a href="#inicio" class="logo">
      <img src="imagens/logo-fpac.png" class="logo-img">
      <span class="logo-text">F PAC STORE</span>
    </a>
  </div>
</header>

<section class="hero" id="inicio">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>Não é só roupa. É identidade.</h1>
    <p>Vista atitude, exclusividade e identidade.</p>
    <a href="#produtos" class="btn">Comprar agora</a>
  </div>
</section>

<footer class="footer">
  © 2026 F Pac Store — Não é só roupa. É identidade.
</footer>

</body>
</html>
