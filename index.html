/* ============================= */

/* permite sobrepor conteúdo abaixo */
.basica,
.basica .container,
.basica-grid {
  overflow: visible;
}

/* card vira referência para posicionamento absoluto */
section#basica .basica-card,
section#mark .basica-card {
  position: relative;
  overflow: visible;
  z-index: 1;
}

/* quando o painel abrir, esse card fica acima dos outros */
section#basica .basica-card.aberto,
section#mark .basica-card.aberto {
  z-index: 30;
}

/* painel flutuante */
section#basica .painel-flutuante,
section#mark .painel-flutuante {
  position: absolute;
  top: calc(100% - 14px);
  left: 0;
  width: 100%;
  background: #fff;
  border: 2px solid rgba(255, 193, 7, 0.9);
  border-top: none;
  border-radius: 0 0 12px 12px;
  box-shadow: 0 10px 22px rgba(0,0,0,0.16);
  padding: 10px 12px 12px;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-6px);
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
}

/* painel aparece quando o card estiver aberto */
section#basica .basica-card.aberto .painel-flutuante,
section#mark .basica-card.aberto .painel-flutuante {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0);
}

/* etapas dentro do painel */
section#basica .painel-flutuante .etapa,
section#mark .painel-flutuante .etapa {
  width: 100%;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transform: translateY(-4px);
  margin-top: 0;
  transition:
    max-height 0.25s ease,
    opacity 0.25s ease,
    transform 0.25s ease,
    margin-top 0.25s ease;
}

/* sobrescreve o display:none */
section#basica .painel-flutuante .etapa.oculta,
section#mark .painel-flutuante .etapa.oculta {
  display: block;
}

/* etapa visível */

section#mark .painel-flutuante .etapa.visivel {
  max-height: 90px;
  opacity: 1;
  transform: translateY(0);
  margin-top: 8px;
}

/* botão final */

section#mark .painel-flutuante .etapa.etapa-finalizar.visivel {
  max-height: 70px;
}

/* campos ocupam largura total */

section#basica .painel-flutuante input,
section#basica .painel-flutuante button,
section#mark .painel-flutuante select,
section#mark .painel-flutuante input,

/* ============================= */
/* ÍCONE DO CARRINHO NO MENU     */
/* ============================= */

.carrinho-icone {
  position: relative;
  text-decoration: none;
}

/* ÍCONE EM SI (FORÇA TAMANHO E COR) */
.carrinho-icone i {
  font-size: 2.6rem;          /* ✅ IGUAL WHATS */
  color: var(--accent);       /* ✅ AMARELO */
  transition: transform 0.2s ease;
}

/* hover igual redes sociais */
.carrinho-icone:hover i {
  transform: scale(1.15);
}

/* contador */
.carrinho-qtd {
  position: absolute;
  top: -6px;
  right: -10px;
  background: #FFC107;
  color: #000;
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 50%;
  font-weight: 700;
}

   <script>
document.querySelectorAll('#basica .basica-card, #mark .basica-card').forEach(card => {

  const cor = card.querySelector('.cor');
  const tamanho = card.querySelector('.tamanho');
  const qtd = card.querySelector('.quantidade');

  const etapaTamanho = card.querySelector('.etapa-tamanho');
  const etapaQtd = card.querySelector('.etapa-quantidade');
  const finalizar = card.querySelector('.etapa-finalizar');

  const painel = card.querySelector('.painel-flutuante');

  function esconder(el) {
    if (!el) return;
    el.classList.add('oculta');
    el.classList.remove('visivel');
  }

  function mostrar(el) {
    if (!el) return;
    el.classList.remove('oculta');
    el.classList.add('visivel');
  }

  function atualizarPainel() {
    const aberto =
      etapaTamanho?.classList.contains('visivel') ||
      etapaQtd?.classList.contains('visivel') ||
      finalizar?.classList.contains('visivel');

    card.classList.toggle('aberto', aberto);
  }

  esconder(etapaTamanho);
  esconder(etapaQtd);
  esconder(finalizar);
  atualizarPainel();

  cor?.addEventListener('change', () => {
    if (cor.value) {
      mostrar(etapaTamanho);
    } else {
      esconder(etapaTamanho);
    }

    esconder(etapaQtd);
    esconder(finalizar);

    if (tamanho) tamanho.value = '';
    if (qtd) qtd.value = 0;

    atualizarPainel();
  });

  tamanho?.addEventListener('change', () => {
    if (tamanho.value) {
      mostrar(etapaQtd);
    } else {
      esconder(etapaQtd);
    }

    esconder(finalizar);
    if (qtd) qtd.value = 0;

    atualizarPainel();
  });

  qtd?.addEventListener('input', () => {
    if (Number(qtd.value) > 0) {
      mostrar(finalizar);
    } else {
      esconder(finalizar);
    }

    atualizarPainel();
  });
});
</script>

  <script>
function adicionarAoCarrinho(botao) {

  // ✅ Aviso visual
  alert('✅ Adicionado ao Carrinho!');

  // 🔍 Encontra o card correto
  const card = botao.closest('.basica-card');
  if (!card) return;

  // 🎯 Campos do card
  const cor = card.querySelector('.cor');
  const tamanho = card.querySelector('.tamanho');
  const quantidade = card.querySelector('.quantidade');

  const etapaTamanho = card.querySelector('.etapa-tamanho');
  const etapaQtd = card.querySelector('.etapa-quantidade');
  const finalizar = card.querySelector('.etapa-finalizar');

  // 🔄 RESET DOS CAMPOS
  if (cor) cor.value = '';
  if (tamanho) tamanho.value = '';
  if (quantidade) quantidade.value = 0;

  // 🔒 FECHA O PAINEL FLUTUANTE
  etapaTamanho?.classList.remove('visivel');
  etapaQtd?.classList.remove('visivel');
  finalizar?.classList.remove('visivel');

  etapaTamanho?.classList.add('oculta');
  etapaQtd?.classList.add('oculta');
  finalizar?.classList.add('oculta');

  // 🔙 Volta card ao estado inicial
  card.classList.remove('aberto');
}
</script>

<script>
/* ============================= */
/* ATUALIZAR ÍCONE DO CARRINHO  */
/* ============================= */
function atualizarQtdCarrinho() {
  const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

  const totalItens = carrinho.reduce((soma, item) => soma + item.qtd, 0);

  const qtd = document.getElementById('carrinhoQtd');
  if (!qtd) return;

  if (totalItens > 0) {
    qtd.textContent = totalItens;
    qtd.style.display = 'block';
  } else {
    qtd.style.display = 'none';
  }
}

// ✅ roda sempre que a página carregar
document.addEventListener('DOMContentLoaded', atualizarQtdCarrinho);
</script>
