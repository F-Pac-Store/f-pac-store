<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F Pac Store</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f5f5f5}
.header{background:#003366;position:fixed;top:0;width:100%;height:100px;display:flex;align-items:center;z-index:1000}
.header-content{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 20px}
.logo img{height:70px}
.nav{display:flex;gap:30px}
.nav a{color:#fff;text-decoration:none;font-weight:600}
.hero{margin-top:100px;height:60vh;background:url('assets/img/hero-003.png') center/cover}
.produtos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:30px;padding:80px 20px}
.card{position:relative;height:360px;border-radius:20px;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover}
.card h3{position:absolute;bottom:20px;left:20px;color:#fff}
</style>
</head>

<body>

<header class="header">
  <div class="header-content">
    <a href="index.html" class="logo">
      <img src="assets/img/logos/f-pac-color.png">
    </a>
    <nav class="nav">
      <a href="index.html">Início</a>
      <a href="produto-force.html">Force</a>
      <a href="marca-do-produto.html">Mark</a>
      <a href="produto-prime.html">Prime</a>
      <a href="catalogo.html">Catálogo</a>
    </nav>
  </div>
</header>

<section class="hero"></section>

<section class="produtos-grid">
  <a href="produto-force.html" class="card">
    <img src="assets/img/cards/F-PAC-ESCRITA-peito C.png">
    <h3>Force</h3>
  </a>
  <a href="marca-do-produto.html" class="card">
    <img src="assets/img/cards/FP-peito C.png">
    <h3>Mark</h3>
  </a>
  <a href="produto-prime.html" class="card">
    <img src="assets/img/cards/F-PAC-frente-e-costas.png">
    <h3>Prime</h3>
  </a>
</section>

</body>
</html>
