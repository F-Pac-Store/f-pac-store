<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <!-- ================================= -->
  <!-- CONFIGURAÇÕES BÁSICAS DO SITE -->
  <!-- ================================= -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>F Pac Store | Não é só roupa. É identidade!</title>

  <!-- SEO -->
  <meta name="description" content="Camisas masculinas estampadas para quem se recusa a vestir o comum. Não é só roupa. É identidade.">
  <meta name="author" content="F Pac Store">

  <!-- ================================= -->
  <!-- FONTES -->
  <!-- ================================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonte principal -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- Fonte da logo -->
  <link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">

  <!-- Ícones sociais -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ================================= -->
  <!-- ESTILOS DO SITE -->
  <!-- ================================= -->
  <style>

    /* ============================= */
    /* VARIÁVEIS DE CORES GLOBAIS */
    /* ============================= */
    :root {
      --primary: #003366;
      --accent: #FFC107;
      --bg: #f5f5f5;
      --text: #333;
      --white: #ffffff;
    }

    /* ============================= */
    /* RESET PADRÃO */
    /* ============================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 0 15px;
    }

    html {
      scroll-behavior: smooth;
    }

    /* ============================= */
    /* HEADER FIXO */
    /* ============================= */
    .header {
      background: var(--primary);
      color: var(--white);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 90px;
    }

    /* ============================= */
    /* LOGO */
    /* ============================= */
    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .logo-img {
      max-height: 85px;
    }

    .logo-text {
      font-family: 'blacklisted', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: #FFC107;
      -webkit-text-stroke: 1.5px #000;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }

    /* ============================= */
    /* MENU DE NAVEGAÇÃO */
    /* ============================= */
    .nav {
      display: none;
      gap: 25px;
    }

    .nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    /* MENU LINKS */
    .menu-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    /* ============================= */
    /* ÍCONES SOCIAIS NO MENU */
    /* ============================= */
    .menu-social {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    /* TAMANHO DOS ÍCONES */
    .menu-social a {
      font-size: 1.8rem;
      transition: transform 0.2s ease;
    }

    /* HOVER DOS ÍCONES */
    .menu-social a:hover {
      transform: scale(1.15);
    }

    /* WhatsApp - cor oficial */
    .menu-social .fa-whatsapp {
      color: #25D366;
    }

    /* Instagram - gradiente oficial */
    .menu-social .fa-instagram {
      background: radial-gradient(circle at 30% 110%,
        #fdf497 0%,
        #fd5949 45%,
        #d6249f 60%,
        #285AEB 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ============================= */
    /* MENU MOBILE */
    /* ============================= */
    .menu-toggle {
      font-size: 2rem;
      background: none;
      border: none;
      color: white;
    }

    .nav.active {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 90px;
      width: 100%;
      background: var(--primary);
      padding: 20px;
      gap: 15px;
    }

    @media (min-width: 768px) {
      .nav {
        display: flex;
      }

      .menu-toggle {
        display: none;
      }
    }

    /* ============================= */
    /* HERO (CAPA DO SITE) */
    /* ============================= */
    .hero {
      margin-top: 90px;
      height: 90vh;
      background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url('https://raw.githubusercontent.com/F-Pac-Store/f-pac-store/main/imagens/capa%20de%20fundo.jpeg')
        center / cover no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 20px;
    }

    .hero h1 {
      font-size: 2.8rem;
      margin-bottom: 15px;
      font-weight: 800;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 650px;
      margin: auto;
      margin-bottom: 25px;
    }

    /* BOTÃO PRINCIPAL */
    .btn {
      background: var(--accent);
      color: black;
      padding: 15px 30px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 30px;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    /* ============================= */
    /* SEÇÃO DE PRODUTOS */
    /* ============================= */
    .produtos {
      padding: 70px 0;
    }

    .produtos h2 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      border-radius: 5px;
    }

    .card h3 {
      margin: 15px 0 10px;
    }

    .whatsapp {
      background: #25D366;
      color: white;
      padding: 12px;
      display: block;
      margin-top: 15px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: 600;
    }

    /* ============================= */
    /* FOOTER */
    /* ============================= */
    .footer {
      background: #001a33;
      color: white;
      padding: 25px;
      text-align: center;
      font-size: 0.9rem;
    }

  </style>
</head>

<body>

  <!-- ================================= -->
  <!-- HEADER / MENU -->
  <!-- ================================= -->
  <header class="header">
    <div class="container header-content">

      <!-- LOGO -->
      <a href="#" class="logo">
        <img src="imagens/logo-fpac.png" class="logo-img" alt="F Pac Store">
        <span class="logo-text">F PAC STORE</span>
      </a>

      <!-- MENU -->
      <nav class="nav" id="nav">

        <div class="menu-links">
          <a href="#inicio">Início</a>
          <a href="#produtos">Produtos</a>
        </div>

        <div class="menu-social">
          <a href="https://wa.me/5547997465602" target="_blank">
            <i class="fab fa-whatsapp"></i>
          </a>
          <a href="https://instagram.com/f_pac_store/" target="_blank">
            <i class="fab fa-instagram"></i>
          </a>
        </div>

      </nav>

      <!-- BOTÃO MOBILE -->
      <button class="menu-toggle" id="toggle">
        <i class="fas fa-bars"></i>
      </button>

    </div>
  </header>

  <!-- ================================= -->
  <!-- HERO -->
  <!-- ================================= -->
  <section class="hero" id="inicio">
    <div>
      <h1>Não é só roupa. É identidade.</h1>
      <p>Camisas masculinas estampadas para quem se recusa a vestir o comum.</p>
      <a href="https://wa.me/5547997465602" class="btn">Bora Vestir Isso</a>
    </div>
  </section>

  <!-- ================================= -->
  <!-- PRODUTOS -->
  <!-- ================================= -->
  <section class="produtos" id="produtos">
    <div class="container">

      <h2>Camisas que representam quem você é</h2>

      <div class="grid">

        <div class="card">
          <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
          <h3>Camiseta Militar</h3>
          <a class="whatsapp" href="https://wa.me/5547997465602">Garantir a minha</a>
        </div>

      </div>

    </div>
  </section>

  <!-- ================================= -->
  <!-- FOOTER -->
  <!-- ================================= -->
  <footer class="footer">
    © 2026 F Pac Store — Não é só roupa. É identidade.
  </footer>

  <!-- ================================= -->
  <!-- SCRIPT: MENU MOBILE -->
  <!-- ================================= -->
  <script>
    const toggle = document.getElementById('toggle');
    const nav = document.getElementById('nav');

    // Abre e fecha o menu no mobile
    toggle.onclick = () => {
      nav.classList.toggle('active');
    };
  </script>

</body>
</html>
