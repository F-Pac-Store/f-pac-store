<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F Pac Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box}

:root{
--primary:#003366cc;
--accent:#FFC107;
--bg:#f5f5f5;
--text:#333;
}

html{scroll-behavior:smooth;}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
}

/* HEADER */
.header{
background:var(--primary);
backdrop-filter:blur(10px);
position:fixed;
width:100%;
top:0;
z-index:1000;
transition:.3s;
}

.header.shrink{background:#003366ee;}

.header-content{
display:flex;
justify-content:space-between;
align-items:center;
height:100px;
padding:0 20px;
transition:.3s;
}

.header.shrink .header-content{height:70px;}

/* LOGO PREMIUM */
.logo{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
}

/* SVG LOGO */
.logo-svg{
height:50px;
transition:.4s cubic-bezier(.2,.8,.2,1);
filter:drop-shadow(0 0 0px #FFC107);
}

/* TEXTO */
.logo-text{
font-weight:800;
font-size:clamp(18px,2.2vw,26px);
color:#FFC107;
letter-spacing:1px;
transition:.3s;
}

/* HOVER PROFISSIONAL */
.logo:hover .logo-svg{
transform:translateY(-2px) scale(1.05);
filter:drop-shadow(0 0 8px #FFC107);
}

.logo:hover .logo-text{
transform:translateY(-2px);
}

/* ANIMAÇÃO DE ENTRADA */
.logo{
animation:fadeUp .6s ease;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

/* MENU */
.nav{
display:flex;
gap:30px;
}

.nav a{
color:white;
text-decoration:none;
font-weight:600;
}

/* MENU MOBILE */
.menu-toggle{
display:none;
flex-direction:column;
cursor:pointer;
gap:5px;
}

.menu-toggle span{
width:28px;
height:3px;
background:white;
}

/* HERO */
.hero{
margin-top:100px;
height:calc(100vh - 100px);
background:url('assets/img/hero-003.png') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

.hero::after{
content:'';
position:absolute;
inset:0;
background:linear-gradient(to bottom,rgba(0,0,0,.3),rgba(0,0,0,.6));
}

.hero-content{z-index:1;}

.btn{
background:#FFC107;
padding:12px 25px;
color:black;
text-decoration:none;
font-weight:bold;
border-radius:6px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
}

.card img{
width:100%;
height:200px;
object-fit:contain;
}

section{
padding:60px 20px;
scroll-margin-top:110px;
}

/* MOBILE */
@media(max-width:768px){
.nav{
position:fixed;
right:-100%;
top:0;
height:100vh;
width:200px;
background:#003366;
flex-direction:column;
padding:110px 20px;
transition:.3s;
}
.nav.active{right:0;}
.menu-toggle{display:flex;}
}

</style>
</head>

<body>

<header class="header" id="header">
<div class="header-content">

<a href="#inicio" class="logo">

<!-- SVG ICON -->
<svg class="logo-svg" viewBox="0 0 100 100">
<circle cx="50" cy="50" r="40" stroke="#FFC107" stroke-width="6" fill="none"/>
<path d="M30 65 L50 30 L70 65 Z" fill="#FFC107"/>
</svg>

<span class="logo-text">F PAC</span>

</a>

<div class="menu-toggle" id="menuToggle">
<span></span><span></span><span></span>
</div>

<nav class="nav" id="navMenu">
<a href="#inicio">Início</a>
<a href="#produtos">Produtos</a>
<a href="#">Catálogo</a>
</nav>

</div>
</header>

<section class="hero" id="inicio">
<div class="hero-content">
<a href="#produtos" class="btn">Comprar Agora</a>
</div>
</section>

<section id="produtos">
<h2 style="text-align:center">Produtos</h2>

<div class="grid">
<div class="card">
<img src="assets/img/cards/F-PAC-ESCRITA-peito C.png">
<h3>Force</h3>
</div>

<div class="card">
<img src="assets/img/cards/FP-peito C.png">
<h3>Mark</h3>
</div>
</div>

</section>

<script>
// HEADER SHRINK
window.addEventListener("scroll",()=>{
document.getElementById("header")
.classList.toggle("shrink",window.scrollY>50);
});
</script>

</body>
</html>
