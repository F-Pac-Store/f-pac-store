<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F Pac Store | Não é só roupa. É identidade!</title>

  <meta name="description"
    content="Camisas masculinas estampadas para quem se recusa a vestir o comum. Não é só roupa. É identidade.">
  <meta name="author" content="F Pac Store">

  <!-- FONTES -->
  <link relonts.googleapis.com
  <link://fonts.gstatic.com
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@display=swap
  <link href="https://fonts.cdns/blacklisted

  <!-- ÍCONES -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all     --primary: #003366;
      --accent: #FFC107;
      --bg: #f5f5f5;
      --text: #333;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: 120px;
    }

    /* ===================== HEADER ===================== */

    .header {
      background: var(--primary);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 120px;
      padding: 0 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
    }

    .logo-img {
      max-height: 85px;
    }

    .logo-text {
      font-family: 'blacklisted', sans-serif;
      font-size: 2.2rem;
      color: var(--accent);
      -webkit-text-stroke: 1.5px #000;
    }

    .nav {
      display: none;
      gap: 25px;
      align-items: center;
    }

    .nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    .menu-social {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .menu-social i {
      font-size: 2.4rem;
    }

    .fa-whatsapp {
      color: #25D366;
    }

    .fa-instagram {
      background: radial-gradient(circle at 30% 110%,
          #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .carrinho-icone {
      position: relative;
      text-decoration: none;
    }

    .carrinho-icone i {
      color: var(--accent);
      font-size: 2.6rem;
    }

    .carrinho-qtd {
      position: absolute;
      top: -6px;
      right: -10px;
      background: var(--accent);
      color: #000;
      font-size: .7rem;
      padding: 2px 6px;
      border-radius: 50%;
      display: none;
    }

    .menu-toggle {
      font-size: 2rem;
      background: none;
      border: none;
      color: white;
      display: block;
    }

    .nav.active {
      display: flex;
      flex-direction: column;
      position: absolute;
      background: var(--primary);
      width: 100%;
      top: 120px;
      left: 0;
      padding: 20px;
    }

    @media (min-width: 768px) {
      .nav {
        display: flex;
      }

      .menu-toggle {
        display: none;
      }
    }

    /* ===================== HERO ===================== */

    .hero {
      min-height: 90vh;
      background: url('https://raw.githubusercontent.com/F-Pac-Store/f-pac-store/main/imagens/capa%20de%20fundo.jpeg') center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 40px;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
    }

    .hero-content {
      position: relative;
      max-width: 800px;
      z-index: 1;
    }

    .hero h1 {
      font-size: 2.8rem;
      margin-bottom: 15px;
    }

    .btn {
      background: var(--accent);
      color: #000;
      padding: 14px 30px;
      display: inline-block;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-content">
      <a href="#" class="logo">
        <img src="imagens/logo-fpac.png" class="logo-img" alt="F Pac Store">
        <span class="logo-text">F PAC STORE</span>
      </a>

      <nav class="nav" id="nav">
        <a href="#inicio">Início</a>
        <a href="#catalogo">Catálogo</a>
        <a href="#produtos">Produtos</a>

        <a href="carrinho.html" class="carrinho-icone">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="carrinho-qtd" id="carrinhoQtd">0</span>
        </a>

        <div class="menu-social">
          <a href="https://wa.me/5547997465602" target="_blank"><i class="fab fa-whatsapp"></i></a>
          <a href="https://instagram.com/f_pac_store/" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
      </nav>

      <button class="menu-toggle" id="toggle"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero" id="inicio">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Não é só roupa. É identidade.</h1>
      <p>Estilo que fala antes de você.</p>
      <a href="#produtos" class="btn">Comprar agora</a>
    </div>
  </section>

  <!-- SCRIPTS -->
  <script>
    const toggle = document.getElementById('toggle');
    const nav = document.getElementById('nav');

    toggle.onclick = () => nav.classList.toggle('active');

    document.querySelectorAll('.nav a').forEach(link => {
      link.onclick = () => nav.classList.remove('active');
    });

    function atualizarQtdCarrinho() {
      const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
      const total = carrinho.reduce((s, i) => s + i.qtd, 0);
      const qtd = document.getElementById('carrinhoQtd');
      if (!qtd) return;
      qtd.textContent = total;
      qtd.style.display = total > 0 ? 'block' : 'none';
    }

    document.addEventListener('DOMContentLoaded', atualizarQtdCarrinho);
  </script>

</body>
</html>
