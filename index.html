<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F Pac Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box}

:root{
--primary:#003366cc;
--accent:#FFC107;
--bg:#f5f5f5;
--text:#333;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
}

/* ================= HEADER ================= */

.header{
background:var(--primary);
backdrop-filter:blur(10px);
position:fixed;
top:0;
width:100%;
z-index:1000;
transition:.3s;
}

.header.shrink{background:#003366ee}

.header-content{
height:100px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
transition:.3s;
}

.header.shrink .header-content{height:70px}

.logo{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
}

.logo-img{height:70px;transition:.3s}
.header.shrink .logo-img{height:50px}

.logo-text{
font-family:'blacklisted';
color:#FFC107;
}

/* ================= MENU ================= */

.nav{
display:flex;
gap:30px;
align-items:center;
position:relative;
}

.nav a,
.nav button{
color:white;
font-weight:600;
text-decoration:none;
background:none;
border:none;
cursor:pointer;
font-size:1rem;
}

/* ===== Dropdown Produtos ===== */

.dropdown{
position:relative;
}

.dropdown-menu{
position:absolute;
top:140%;
left:0;
background:#001a33;
min-width:180px;
border-radius:10px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.3);
opacity:0;
visibility:hidden;
transform:translateY(-10px);
transition:.3s ease;
z-index:2000;
}

.dropdown.open .dropdown-menu{
opacity:1;
visibility:visible;
transform:translateY(0);
}

.dropdown-menu a{
display:block;
padding:14px 18px;
color:white;
text-decoration:none;
transition:.3s;
}

.dropdown-menu a:hover{
background:rgba(255,255,255,.1);
color:var(--accent);
}

/* ================= HERO ================= */

.hero{
margin-top:100px;
height:calc(100vh - 100px);
background:url('assets/img/hero-003.png') no-repeat center 35%/cover;
display:flex;
align-items:center;
justify-content:center;
position:relative;
color:white;
}

.hero::after{
content:'';
position:absolute;
inset:0;
background:linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,.6));
}

.hero-content{position:relative;z-index:1}

.btn{
background:#FFC107;
padding:12px 25px;
border-radius:8px;
color:black;
font-weight:800;
text-decoration:none;
}

/* ================= FOOTER ================= */

.footer{
background:#001a33;
color:white;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<header class="header" id="header">
  <div class="header-content">

    <a href="index.html" class="logo">
      <img src="assets/img/logos/f-pac-color.png" class="logo-img">
      <span class="logo-text">F PAC</span>
    </a>

    <nav class="nav">

      <a href="#inicio">Início</a>

      <!-- DROPDOWN PRODUTOS -->
      <div class="dropdown" id="dropdownProdutos">
        <button id="btnProdutos">
          Produtos <i class="fa fa-chevron-down"></i>
        </button>

        <div class="dropdown-menu">
          <a href="force.html">Force</a>
          <a href="mark.html">Mark</a>
          <a href="prime.html">Prime</a>
        </div>
      </div>

      <a href="catalogo.html">Catálogo</a>

    </nav>
  </div>
</header>

<section class="hero" id="inicio">
  <div class="hero-content">
    <a href="catalogo.html" class="btn">Comprar Agora</a>
  </div>
</section>

<footer class="footer">
© 2026 F Pac Store — Não é só roupa. É identidade.
</footer>

<script>
/* HEADER SHRINK */
window.addEventListener("scroll",()=>{
  document.getElementById("header")
  .classList.toggle("shrink",window.scrollY>50);
});

/* DROPDOWN PRODUTOS */
const dropdown = document.getElementById("dropdownProdutos");
const btn = document.getElementById("btnProdutos");

btn.addEventListener("click", e => {
  e.stopPropagation();
  dropdown.classList.toggle("open");
});

/* Fechar ao clicar fora */
document.addEventListener("click",()=>{
  dropdown.classList.remove("open");
});
</script>

</body>
</html>
