<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F PAC Store</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS GLOBAL -->
  <link rel="stylesheet" href="css/global.css">
</head>

<body>

  <!-- HEADER -->
  <div id="header-placeholder"></div>

  <main>

    <section class="hero">
      <a href="#produtos" class="btn">Comprar Agora</a>
    </section>

    <section class="drop">
      <h2 class="drop-title">Destaques</h2>
      <p class="drop-subtitle">Peças selecionadas pela F PAC</p>

      <div class="drop-grid">
        <a href="catalogo.html" class="card-full">
          <img src="assets/img/cards/destaque-01.png">
        </a>
        <a href="catalogo.html" class="card-full">
          <img src="assets/img/cards/destaque-02.png">
        </a>
      </div>
    </section>

    <section id="produtos">
      <h2 class="drop-title">Produtos</h2>
      <p class="drop-subtitle">Escolha o que combina com você</p>

      <div class="produtos-grid">
        <a href="force.html" class="card-full">
          <img src="assets/img/cards/F-PAC-ESCRITA-peito C.png">
        </a>
        <a href="mark.html" class="card-full">
          <img src="assets/img/cards/FP-peito C.png">
        </a>
        <a href="prime.html" class="card-full">
          <img src="assets/img/cards/F-PAC-frente-e-costas.png">
        </a>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <div id="footer-placeholder"></div>

  <script src="js/layout.js"></script>
  <script src="js/header.js"></script>

</body>
</html>
