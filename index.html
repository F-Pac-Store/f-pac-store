<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F Pac Store</title>

  <!-- CSS GLOBAL -->
  <link rel="stylesheet" href="CSS/global.css">

  <!-- FONTE -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

  <!-- ÍCONES -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <!-- ✅ HEADER REUTILIZÁVEL (PASSO 5) -->
  <div id="header-placeholder"></div>

  <!-- ================= HERO ================= -->
  <section class="hero">
    <a href="#produtos" class="btn">Comprar Agora</a>
  </section>

  <!-- ================= DESTAQUES ================= -->
  <section class="drop">
    <h2 class="drop-title">Destaques da Semana</h2>
    <p class="drop-subtitle">Peças em evidência escolhidas pela F PAC</p>

    <div class="drop-grid">
      <a href="catalogo.html" class="card-full">
        <img src="assets/img/cards/destaque-01.png">
      </a>
      <a href="catalogo.html" class="card-full">
        <img src="assets/img/cards/destaque-02.png">
      </a>
    </div>
  </section>

  <!-- ================= PRODUTOS ================= -->
  <section id="produtos">
    <h2 style="text-align:center">Produtos</h2>

    <div class="produtos-grid">
      <a href="produto.html" class="card-full">
        <img src="assets/img/cards/F-PAC-ESCRITA-peito C.png">
      </a>
      <a href="produto.html" class="card-full">
        <img src="assets/img/cards/FP-peito C.png">
      </a>
      <a href="produto.html" class="card-full">
        <img src="assets/img/cards/F-PAC-frente-e-costas.png">
      </a>
    </div>
  </section>

  <!-- ================= LOAD HEADER + JS ================= -->
  <script>
    fetch('inclui/header.html')
      .then(response => response.text())
      .then(headerHTML => {
        document.getElementById('header-placeholder').innerHTML = headerHTML;

        // Carrega o JS do header SOMENTE depois que ele existe
        const script = document.createElement('script');
        script.src = 'js/header.js';
        document.body.appendChild(script);
      })
      .catch(err => console.error('Erro ao carregar header:', err));
  </script>

</body>
</html>
