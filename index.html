<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F PAC Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* =============================
   RESET & VARIÁVEIS
============================= */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --primary:#003366;
  --accent:#FFC107;
}

/* =============================
   BASE
============================= */
body{
  font-family:'Inter',sans-serif;
  color:#000;
  background:#fff;
}

/* =============================
   HEADER
============================= */
.header{
  background:var(--primary);
  position:fixed;
  top:0;
  width:100%;
  z-index:1000;
}

.header-content{
  display:flex;
  justify-content:space-between;
  align-items:center;
  height:100px;
  padding:0 30px;
}

.logo img{height:70px}

/* NAV */
.nav{
  display:flex;
  gap:42px;
}

.nav a{
  color:#fff;
  text-decoration:none;
  font-size:.9rem;
  letter-spacing:2px;
}

.nav a i{font-size:1.9rem}

.icon-cart{position:relative}
.icon-cart i{color:var(--accent)}
.icon-whatsapp i{color:#25D366}
.icon-instagram i{color:#E1306C}

.cart-badge{
  position:absolute;
  top:-6px;
  right:-10px;
  background:var(--accent);
  color:#000;
  font-size:11px;
  font-weight:800;
  border-radius:50%;
  padding:3px 6px;
}

/* =============================
   SEÇÃO PRODUTO / CONTEÚDO
============================= */
section{
  padding:140px 20px 80px;
  max-width:1200px;
  margin:auto;
}

/* =============================
   FOOTER (PADRÃO GLOBAL)
============================= */
.footer{
  background:#0b0b0b;
  color:#fff;
  padding:70px 20px 40px;
}

.footer-content{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  gap:40px;
}

/* MARCA */
.footer-brand img{
  height:60px;
}

.footer-brand p{
  margin-top:15px;
  font-size:0.9rem;
  color:#ccc;
  line-height:1.6;
}

/* LINKS */
.footer-links h3,
.footer-social h3{
  font-size:0.9rem;
  letter-spacing:2px;
  margin-bottom:20px;
}

.footer-links a{
  display:block;
  margin-bottom:12px;
  text-decoration:none;
  color:#ccc;
  font-size:0.9rem;
}

.footer-links a:hover{color:#fff}

/* REDES */
.footer-social a{
  font-size:1.8rem;
  margin-right:18px;
  color:#ccc;
  transition:.3s;
}

.footer-social a:hover{
  color:var(--accent);
}

/* BASE */
.footer-bottom{
  margin-top:40px;
  padding-top:20px;
  border-top:1px solid #222;
  text-align:center;
  font-size:0.8rem;
  color:#777;
}

/* RESPONSIVO */
@media(max-width:768px){
  .nav{display:none}

  .footer-content{
    grid-template-columns:1fr;
    text-align:center;
  }

  .footer-social{
    margin-top:20px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-content">
    <a href="index.html" class="logo">
      <img src="assets/img/logos/f-pac-color.png" alt="F PAC">
    </a>

    <nav class="nav">
      <a href="index.html">INÍCIO</a>
      <a href="index.html#produtos">PRODUTOS</a>
      <a href="catalogo.html">CATÁLOGO</a>

      <a href="carrinho.html" class="icon-cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge">0</span>
      </a>

      <a href="https://wa.me/5547997465602" class="icon-whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
      </a>

      <a href="https://www.instagram.com/f_pac_store" class="icon-instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
    </nav>
  </div>
</header>

<section>
  <h1>Conteúdo da página</h1>
  <p>Seu conteúdo permanece exatamente como já está.</p>
</section>

<!-- =============================
     FOOTER
============================= -->
<footer class="footer">

  <div class="footer-content">

    <div class="footer-brand">
      <img src="assets/img/logos/f-pac-color.png" alt="F PAC">
      <p>
        A F PAC não é apenas vestuário.<br>
        É identidade, atitude e expressão.
      </p>
    </div>

    <div class="footer-links">
      <h3>F PAC</h3>
      <a href="index.html">Início</a>
      <a href="index.html#produtos">Produtos</a>
      <a href="catalogo.html">Catálogo</a>
    </div>

    <div class="footer-social">
      <h3>Conecte-se</h3>
      <a href="https://wa.me/5547997465602" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
      </a>
      <a href="https://www.instagram.com/f_pac_store" target="_blank">
        <i class="fa-brands fa-instagram"></i>
      </a>
    </div>

  </div>

  <div class="footer-bottom">
    © 2026 F PAC Store · Não é só roupa. É identidade!
  </div>

</footer>

</body>
</html>
