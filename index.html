<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F Pac Store</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{ --primary:#003366; --accent:#FFC107; }
        body{font-family:'Inter',sans-serif}

        /* HEADER */
        .header{
            background:var(--primary);
            position:fixed;
            top:0;
            width:100%;
            z-index:1000;
            transition:.35s ease;
        }

        .header-content{
            display:flex;
            justify-content:space-between;
            align-items:center;
            height:100px;
            padding:0 30px;
            transition:.35s ease;
        }

        .logo img{height:70px;transition:.35s ease}
        .header.shrink .header-content{height:58px}
        .header.shrink .logo img{height:38px}

        /* NAV */
        .nav{display:flex;align-items:center;gap:42px}
        .nav a{text-decoration:none;color:white;font-size:.9rem;font-weight:500;letter-spacing:2px}
        .nav a i{font-size:1.9rem}

        .icon-cart i{color:var(--accent)}
        .icon-whatsapp i{color:#25D366}
        .icon-instagram i{color:#E1306C}

        .icon-cart{position:relative}
        .cart-badge{
            position:absolute;
            top:-6px;
            right:-10px;
            background:var(--accent);
            color:#000;
            font-size:11px;
            font-weight:800;
            border-radius:50%;
            padding:3px 6px;
        }

        /* MOBILE */
        .menu-toggle{display:none;font-size:2rem;color:white;cursor:pointer}

        .mobile-overlay{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.45);
            opacity:0;
            visibility:hidden;
            transition:.3s;
            z-index:1500;
        }

        .mobile-overlay.active{opacity:1;visibility:visible}

        /* HERO */
        .hero{
            margin-top:100px;
            height:calc(100vh - 100px);
            background:url('assets/img/hero-003.png') no-repeat center/cover;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .btn{
            background:var(--accent);
            padding:16px 36px;
            border-radius:30px;
            font-weight:800;
            color:black;
            text-decoration:none;
        }

        /* DESTAQUES */
        .drop{background:#0b0b0b;color:white;padding:80px 20px}
        .drop-title{text-align:center;font-size:2rem;font-weight:800}
        .drop-subtitle{text-align:center;color:#ccc;margin:10px 0 40px}

        .drop-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
            gap:30px;
            max-width:1200px;
            margin:auto;
        }

        .card-full{
            height:380px;
            border-radius:18px;
            overflow:hidden;
        }

        .card-full img{width:100%;height:100%;object-fit:cover}

        /* PRODUTOS */
        section{padding:80px 20px}

        .produtos-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
            gap:30px;
            max-width:1200px;
            margin:auto;
        }

        @media(max-width:768px){
            .nav{display:none}
            .menu-toggle{display:block}
        }
    </style>
</head>

<body>

<header class="header" id="header">
    <div class="header-content">
        <a href="#" class="logo" onclick="scrollTopo()">
            <img src="assets/img/logos/f-pac-color.png" alt="F PAC">
        </a>

        <nav class="nav">
            <a href="#" onclick="scrollTopo()">INÍCIO</a>
            <a href="#produtos">PRODUTOS</a>
            <a href="catalogo.html">CATÁLOGO</a>

            <a href="carrinho.html" class="icon-cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </a>

            <a href="https://wa.me/5547997465602" class="icon-whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
            </a>

            <a href="https://www.instagram.com/f_pac_store" class="icon-instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </nav>

        <div class="menu-toggle">☰</div>
    </div>
</header>

<section class="hero">
    <a href="#produtos" class="btn">Comprar Agora</a>
</section>

<section class="drop">
    <h2 class="drop-title">Destaques</h2>
    <p class="drop-subtitle">Peças com maior destaque escolhidas pra você pela F PAC</p>

    <div class="drop-grid">
        <a href="catalogo.html" class="card-full">
            <img src="assets/img/cards/destaque-01.png">
        </a>
        <a href="catalogo.html" class="card-full">
            <img src="assets/img/cards/destaque-02.png">
        </a>
    </div>
</section>

<section id="produtos">
    <h2 class="drop-title">Produtos</h2>
    <p class="drop-subtitle">Escolha oque combina mais com você</p>

    <div class="produtos-grid">

        <!-- CARD 1 → FORÇA -->
        <a href="force.html" class="card-full">
            <img src="assets/img/cards/F-PAC-ESCRITA-peito C.png">
        </a>

        <!-- CARD 2 → MARK -->
        <a href="mark.html" class="card-full">
            <img src="assets/img/cards/FP-peito C.png">
        </a>

        <!-- CARD 3 → PRIME -->
        <a href="prime.html" class="card-full">
            <img src="assets/img/cards/F-PAC-frente-e-costas.png">
        </a>

    </div>
</section>

<script>
    const header = document.getElementById("header");

    function scrollTopo(){
        window.scrollTo({top:0,behavior:'smooth'});
    }

    window.addEventListener("scroll",()=>{
        header.classList.toggle("shrink", window.scrollY > 80);
    });

    function atualizarCarrinho(){
        const carrinho = JSON.parse(localStorage.getItem("fpacCarrinho")) || [];
        document.getElementById("cartCount").innerText = carrinho.length;
    }

    atualizarCarrinho();
</script>

</body>
</html>
