<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F Pac Store | Não é só roupa. É identidade!</title>

  <meta name="description" content="Camisas masculinas estampadas para quem se recusa a vestir o comum. Não é só roupa. É identidade.">
  <meta name="author" content="F Pac Store">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">

  <style>
    :root {
      --primary: #003366;
      --accent: #FFC107;
      --bg: #f5f5f5;
      --text: #333;
      --white: #fff;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      margin: 0;
    }

    .basica {
      padding: 60px 0;
    }

    .basica-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
      justify-items: center;
    }

    .basica-card {
      background: #fff;
      width: 100%;
      max-width: 280px;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.12);
      text-align: center;
    }

    .basica-card img {
      max-width: 210px;
    }

    .preco {
      font-size: 1.25rem;
      font-weight: bold;
      margin: 10px 0;
    }

    .ajuda {
      font-size: 0.8rem;
      color: #666;
      margin-top: 14px;
    }

    .basica-card select,
    .basica-card input {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
    }

    .basica-card button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: var(--accent);
      border: none;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
    }

    .oculta {
      display: none;
    }
  </style>
</head>

<body>

<section class="basica" id="basica">
  <div class="basica-grid">

    <!-- CARD 1 -->
    <div class="basica-card">
      <img src="imagens/logo-no-peito.jpg">
      <p class="preco">R$ 79,90</p>

      <p class="ajuda">1️⃣ Escolha o modelo</p>
      <div class="etapa visivel">
        <select class="cor">
          <option value="">Cor</option>
          <option>Preta</option>
          <option>Branca</option>
          <option>Off White</option>
        </select>
      </div>

      <div class="etapa etapa-tamanho oculta">
        <select class="tamanho">
          <option value="">Tamanho</option>
          <option>M</option>
          <option>G</option>
        </select>
      </div>

      <p class="ajuda">2️⃣ Quantidade</p>
      <div class="etapa etapa-quantidade oculta">
        <input class="quantidade" type="number" min="0" value="0">
      </div>

      <div class="etapa etapa-finalizar oculta">
        <button>Finalizar pedido</button>
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="basica-card">
      <img src="imagens/logo-nas-costas.png">
      <p class="preco">R$ 79,90</p>

      <p class="ajuda">1️⃣ Escolha o modelo</p>
      <div class="etapa visivel">
        <select class="cor">
          <option value="">Cor</option>
          <option>Preta</option>
          <option>Branca</option>
          <option>Off White</option>
        </select>
      </div>

      <div class="etapa etapa-tamanho oculta">
        <select class="tamanho">
          <option value="">Tamanho</option>
          <option>M</option>
          <option>G</option>
        </select>
      </div>

      <p class="ajuda">2️⃣ Quantidade</p>
      <div class="etapa etapa-quantidade oculta">
        <input class="quantidade" type="number" min="0" value="0">
      </div>

      <div class="etapa etapa-finalizar oculta">
        <button>Finalizar pedido</button>
      </div>
    </div>

    <!-- CARDS ESGOTADOS TAMBÉM PADRONIZADOS -->
    <div class="basica-card">
      <img src="imagens/esgotado.png">
      <p class="preco">Esgotado</p>

      <p class="ajuda">1️⃣ Escolha o modelo</p>
      <div class="etapa visivel">
        <select disabled><option>Indisponível</option></select>
      </div>

      <p class="ajuda">2️⃣ Quantidade</p>
      <div class="etapa etapa-quantidade oculta">
        <input disabled>
      </div>
    </div>

  </div>
</section>

</body>
</html>
