<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F PAC Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* =============================
   RESET & VARIÁVEIS
============================= */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --primary:#003366;
  --accent:#FFC107;
}

/* BASE */
body{
  font-family:'Inter',sans-serif;
  color:#000;
  background:#fff;
}

/* HEADER */
.header{
  background:var(--primary);
  position:fixed;
  top:0;
  width:100%;
  z-index:1000;
}

.header-content{
  display:flex;
  justify-content:space-between;
  align-items:center;
  height:100px;
  padding:0 30px;
}

.logo img{height:70px}

/* NAV */
.nav{display:flex;gap:42px}
.nav a{
  color:#fff;
  text-decoration:none;
  font-size:.9rem;
  letter-spacing:2px;
}
.nav a i{font-size:1.9rem}

.icon-cart{position:relative}
.icon-cart i{color:var(--accent)}
.icon-whatsapp i{color:#25D366}
.icon-instagram i{color:#E1306C}

.cart-badge{
  position:absolute;
  top:-6px;
  right:-10px;
  background:var(--accent);
  color:#000;
  font-size:11px;
  font-weight:800;
  border-radius:50%;
  padding:3px 6px;
}

/* HERO */
.hero{
  margin-top:100px;
  height:calc(100vh - 100px);
  background:url('assets/img/hero-003.png') no-repeat center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
}
.btn{
  background:var(--accent);
  padding:16px 36px;
  border-radius:30px;
  font-weight:800;
  color:#000;
  text-decoration:none;
}

/* SEÇÕES */
section{padding:80px 20px}

.drop{
  background:#0b0b0b;
  color:#fff;
}

.drop-title{
  text-align:center;
  font-size:2rem;
  font-weight:800;
}

.drop-subtitle{
  text-align:center;
  margin:10px 0 40px;
  color:#ccc;
}

.drop-grid,
.produtos-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
  max-width:1200px;
  margin:auto;
}

.card-full{
  height:380px;
  border-radius:18px;
  overflow:hidden;
}

.card-full img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =============================
   FOOTER REFINADO
============================= */
.footer{
  background:#0b0b0b;
  color:#fff;
  padding:45px 20px 25px;
}

.footer-content{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:40px;
  align-items:start;
}

/* MARCA */
.footer-brand{
  max-width:320px;
}

.footer-brand img{
  height:50px;
}

.footer-brand p{
  margin-top:12px;
  font-size:.85rem;
  color:#bbb;
  line-height:1.5;
}

/* LINKS */
.footer-links a{
  display:block;
  margin-bottom:8px;
  font-size:.85rem;
  text-decoration:none;
  color:#ccc;
}

.footer-links a:hover{color:#fff}

/* REDES */
.footer-social a{
  font-size:1.6rem;
  margin-right:14px;
  color:#ccc;
  transition:.3s;
}

.footer-social a:hover{color:var(--accent)}

/* BASE */
.footer-bottom{
  margin-top:25px;
  padding-top:15px;
  border-top:1px solid #1c1c1c;
  text-align:center;
  font-size:.75rem;
  color:#777;
}

/* RESPONSIVO */
@media(max-width:768px){
  .nav{display:none}

  .footer-content{
    grid-template-columns:1fr;
    text-align:center;
    gap:25px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-content">
    <a href="index.html" class="logo">
      <img src="assets/img/logos/f-pac-color.png">
    </a>
    <nav class="nav">
      <a href="#">INÍCIO</a>
      <a href="#produtos">PRODUTOS</a>
      <a href="catalogo.html">CATÁLOGO</a>
      <a href="carrinho.html" class="icon-cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge">0</span>
      </a>
      <a href="https://wa.me/5547997465602"><i class="fa-brands fa-whatsapp"></i></a>
      <a href="https://www.instagram.com/f_pac_store"><i class="fa-brands fa-instagram"></i></a>
    </nav>
  </div>
</header>

<section class="hero">
  <a href="#produtos" class="btn">Comprar Agora</a>
</section>

<section class="drop">
  <h2 class="drop-title">Destaques</h2>
  <p class="drop-subtitle">Peças selecionadas pela F PAC</p>
</section>

<section id="produtos">
  <h2 class="drop-title">Produtos</h2>
  <p class="drop-subtitle">Escolha o que combina com você</p>
</section>

<footer class="footer">
  <div class="footer-content">
    <div class="footer-brand">
      <img src="assets/img/logos/f-pac-color.png">
      <p>Não é só roupa.<br>É identidade.</p>
    </div>
    <div class="footer-links">
      <a href="index.html">Início</a>
      <a href="#produtos">Produtos</a>
      <a href="catalogo.html">Catálogo</a>
    </div>
    <div class="footer-social">
      <a href="https://wa.me/5547997465602"><i class="fa-brands fa-whatsapp"></i></a>
      <a href="https://www.instagram.com/f_pac_store"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </div>

  <div class="footer-bottom">
    © 2026 F PAC Store · Não é só roupa. É identidade.
  </div>
</footer>

</body>
</html>
