<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>F Pac Store | Não é só roupa. É identidade!</title>

  <meta name="description" content="Camisas masculinas estampadas para quem se recusa a vestir o comum. Não é só roupa. É identidade.">
  <meta name="author" content="F Pac Store">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.comf="https://fontstps://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="klisted -->
  <link href="https://fonts.cdnfonts.com/css/blacklistedt Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/cssroot {
      --primary: #003366;
      --accent: #FFC107;
      --bg: #f5f5f5;
      --text: #333;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 0 15px;
    }

    /* HEADER */
    .header {
      background: var(--primary);
      color: var(--white);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 120px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      max-height: 80px;
    }

    .logo-text {
      font-family: 'blacklisted', sans-serif;
      color: #FFC107;
      font-size: 2rem;
      text-shadow: 2px 2px 4px #000;
    }

    /* HERO */
    .hero {
      margin-top: 120px;
      min-height: 60vh;
      background:
        linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.6)),
        url("https://raw.githubusercontent.com/F-Pac-Store/f-pac-store/main/imagens/capa%20de%20fundo.jpeg");
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    /* PRODUTOS */
    .produtos {
      padding: 80px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    /* FORMULÁRIOS */
    .basica-card {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      max-width: 360px;
      margin: auto;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    .basica-card label {
      display: block;
      font-weight: 600;
      margin-top: 12px;
    }

    .basica-card select,
    .basica-card input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    .preco {
      font-size: 1.4rem;
      font-weight: bold;
      margin: 15px 0;
      text-align: center;
    }

    .preview-camisa img {
      width: 100%;
      max-width: 260px;
      margin: 0 auto 15px;
      display: block;
    }

    /* BOTÃO FIXO FINALIZAR */
    .botao-fixo-whatsapp {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 20px);
      max-width: 420px;
      z-index: 9999;
    }

    .botao-fixo-whatsapp button {
      width: 100%;
      padding: 14px;
      background: #25D366;
      border: none;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,0,0,.25);
    }

    .botao-fixo-whatsapp button:hover {
      background: #1ebe5d;
    }

    footer {
      background: #001a33;
      color: white;
      padding: 20px;
      text-align: center;
      margin-top: 80px;
    }
  </style>
</head>

<body>

<section class="hero">
  <div>
    <h1>Não é só roupa. É identidade.</h1>
    <p>Camisas masculinas estampadas para quem se recusa a vestir o comum.</p>
  </div>
</section>

<section class="produtos container">
  <div class="grid">

    <div class="card">
      <img src="imagens/logo-no-peito.jpg" alt="Camiseta Básica">
      <h3>Camiseta Básica</h3>
      <a href="#basica">Escolher</a>
    </div>

    <div class="card">
      <img src="imagens/logo-nas-costas.png" alt="Camiseta Premium">
      <h3>Camiseta Premium</h3>
      <a href="#criar">Criar Minha Camisa</a>
    </div>

  </div>
</section>

<section id="basica" class="container">
  <div class="basica-card">
    <img src="imagens/logo-no-peito.jpg">
    <p class="preco" id="preco-basica">R$ 79,90</p>

    <label>Quantidade</label>
    <input type="number" id="qtd-basica" value="1" min="1" onchange="calcularPrecoBasica()">
  </div>
</section>

<section id="criar" class="container">
  <div class="basica-card">
    <div class="preview-camisa">
      <img src="imagens/logo-no-peito.jpg">
    </div>

    <p class="preco" id="preco-premium">R$ 69,90</p>

    <label>Quantidade de Camisas</label>
    <input type="number" id="qtd-camisas" value="1" min="1" onchange="calcularPrecoPremium()">

    <label>Quantidade de Estampas</label>
    <select id="qtd-estampas" onchange="calcularPrecoPremium()">
      <option value="0">Nenhuma</option>
      <option value="1">1 Estampa</option>
      <option value="2">2 Estampas</option>
    </select>
  </div>
</section>

<footer>
  © 2026 F Pac Store — Não é só roupa. É identidade.
</footer>

<!-- BOTÃO FIXO -->
<div class="botao-fixo-whatsapp">
  <button onclick="comprarPremium()">🛒 Finalizar Compra</button>
</div>

<script>
function calcularPrecoBasica() {
  const q = Number(qtd_basica?.value || 1);
  preco_basica.innerText = 'R$ ' + (79.9 * q).toLocaleString('pt-BR', {minimumFractionDigits:2});
}

function calcularPrecoPremium() {
  let base = 69.9;
  const q = Number(qtd_camisas?.value || 1);
  const e = Number(qtd_estampas?.value || 0);
  if(e===1) base+=10;
  if(e===2) base+=30;
  preco_premium.innerText = 'R$ ' + (base*q).toLocaleString('pt-BR', {minimumFractionDigits:2});
}

function comprarPremium() {
  const msg = `Olá! Quero finalizar uma Camiseta Premium.\nQuantidade: ${qtd_camisas.value}\nValor: ${preco_premium.innerText}`;
  window.open("https://wa.me/5547997465602?text="+encodeURIComponent(msg),"_blank");
}
</script>

</body>
</html>
