<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F Pac Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--primary:#003366;
--accent:#FFC107;
--bg:#f5f5f5;
--text:#fff;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
}

/* HEADER */
.header{
background:#003366;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header img{
height:55px;
}

.header a{
color:white;
text-decoration:none;
font-weight:700;
}

/* HERO CORRIGIDO */
.hero{
height:85vh;
background:url('assets/img/hero-003.png') center/cover no-repeat;
position:relative;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero::after{
content:'';
position:absolute;
inset:0;
/* overlay LEVE, não apaga a imagem */
background:linear-gradient(
  180deg,
  rgba(0,0,0,.25) 0%,
  rgba(0,0,0,.45) 100%
);
}

.hero-content{
position:relative;
z-index:1;
max-width:600px;
padding:20px;
}

.hero h1{
font-size:2.5rem;
font-weight:800;
margin-bottom:20px;
}

.hero p{
font-size:1.1rem;
margin-bottom:30px;
}

.btn{
background:var(--accent);
color:#000;
padding:14px 34px;
border-radius:30px;
font-weight:800;
text-decoration:none;
display:inline-block;
}

/* PRODUTOS */
.produtos{
padding:80px 20px;
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
}

.produtos img{
width:100%;
border-radius:16px;
}

/* FOOTER */
.footer{
background:#001a33;
color:white;
text-align:center;
padding:30px;
font-size:.9rem;
}
</style>
</head>

<body>

<header class="header">
  <img src="assets/img/logos/f-pac-color.png" alt="F Pac">
  <a href="catalogo.html">Catálogo</a>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Não é só roupa.<br>É identidade.</h1>
    <p>Estilo, atitude e presença em cada detalhe.</p>
    <a href="catalogo.html" class="btn">Comprar Agora</a>
  </div>
</section>

<section class="produtos">
  <img src="assets/img/cards/F-PAC-ESCRITA-peito C.png">
  <img src="assets/img/cards/FP-peito C.png">
  <img src="assets/img/cards/F-PAC-frente-e-costas.png">
</section>

<footer class="footer">
© 2026 F Pac Store — Não é só roupa. É identidade.
</footer>

</body>
</html>
