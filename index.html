<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F Pac Store | Não é só roupa. É identidade!</title>

<meta name="description" content="Camisas masculinas estampadas para quem se recusa a vestir o comum.">
<meta name="author" content="F Pac Store">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box}

:root{
--primary:#003366;
--accent:#FFC107;
--bg:#f5f5f5;
--text:#333;
--white:#fff;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
}

/* HEADER */
.header{
background:var(--primary);
color:white;
position:fixed;
width:100%;
top:0;
z-index:1000;
}

.header-content{
display:flex;
justify-content:space-between;
align-items:center;
height:100px;
padding:0 20px;
}

.logo{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
}

.logo-img{height:70px}

.logo-text{
font-family:'blacklisted';
color:#FFC107;
}

/* MENU */
.nav{display:flex;gap:25px;align-items:center}

.nav a{
color:white;
text-decoration:none;
font-weight:600;
}

.menu-toggle{display:none}

/* HERO */
.hero{
margin-top:100px;
height:90vh;
background:url('assets/img/hero-002.png') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.6);
}

.hero-content{
position:relative;
z-index:2;
}

.btn{
background:#FFC107;
padding:12px 25px;
text-decoration:none;
color:black;
font-weight:bold;
border-radius:5px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:200px;
object-fit:contain;
}

/* SEÇÕES */
section{padding:60px 20px}

/* FOOTER */
.footer{
background:#001a33;
color:white;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<header class="header">
<div class="header-content">

<a href="#" class="logo">
<img src="assets/img/logos/f-pac-color.png" class="logo-img">
<span class="logo-text">F PAC</span>
</a>

<nav class="nav">

<a href="#inicio">Início</a>
<a href="#produtos">Produtos</a>
<a href="catalogo.html">Catálogo</a>

<a href="carrinho.html">
<i class="fa-solid fa-cart-shopping"></i>
<span id="carrinhoQtd">0</span>
</a>

</nav>

</div>
</header>

<!-- HERO -->
<section class="hero" id="inicio">
<div class="hero-overlay"></div>

<div class="hero-content">
<h1>Não é só roupa. É identidade.</h1>
<p>Vista atitude e exclusividade.</p>
<a href="#produtos" class="btn">Comprar</a>
</div>
</section>

<!-- PRODUTOS -->
<section id="produtos">
<h2 style="text-align:center">Produtos</h2>

<div class="grid">

<div class="card">
<img src="assets/img/cards/F-PAC-ESCRITA-peito C.png">
<h3>Force</h3>
<a href="produto-force.html" class="btn">Comprar</a>
</div>

<div class="card">
<img src="assets/img/cards/FP-peito C.png">
<h3>Mark</h3>
<a href="produto-mark.html" class="btn">Comprar</a>
</div>

<div class="card">
<img src="assets/img/cards/F-PAC-frente-e-costas.png">
<h3>Prime</h3>
<a href="produto-prime.html" class="btn">Personalizar</a>
</div>

</div>
</section>

<footer class="footer">
© 2026 F Pac Store — Não é só roupa. É identidade.
</footer>

<script>

/* CARRINHO */
function getCarrinho(){
return JSON.parse(localStorage.getItem('fpacCarrinho'))||[]
}

function atualizarCarrinho(){
const carrinho=getCarrinho()
const total=carrinho.reduce((s,i)=>s+i.quantidade,0)
document.getElementById("carrinhoQtd").innerText=total
}

document.addEventListener("DOMContentLoaded",atualizarCarrinho)

</script>

</body>
</html>
