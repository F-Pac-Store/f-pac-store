<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F Pac Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box}

:root{
--primary:#003366cc;
--accent:#FFC107;
--bg:#f5f5f5;
--text:#333;
--white:#fff;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
}

/* HEADER */
.header{
background:var(--primary);
backdrop-filter:blur(10px);
position:fixed;
width:100%;
top:0;
z-index:1000;
transition:0.3s;
}

.header.shrink{
height:70px;
background:#003366ee;
}

.header-content{
display:flex;
justify-content:space-between;
align-items:center;
height:100px;
padding:0 20px;
transition:0.3s;
}

.header.shrink .header-content{
height:70px;
}

/* LOGO */
.logo{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
}

.logo-img{
height:70px;
transition:0.3s;
}

.header.shrink .logo-img{
height:50px;
}

.logo-text{
font-family:'blacklisted';
color:#FFC107;
}

/* MENU DESKTOP */
.nav{
display:flex;
gap:30px;
align-items:center;
}

.nav a{
color:white;
text-decoration:none;
font-weight:600;
}

/* BOTÃO MENU */
.menu-toggle{
display:none;
flex-direction:column;
cursor:pointer;
gap:5px;
z-index:1100;
}

.menu-toggle span{
width:28px;
height:3px;
background:white;
transition:0.3s;
}

.menu-toggle.active span:nth-child(1){
transform:rotate(45deg) translate(5px,5px);
}
.menu-toggle.active span:nth-child(2){
opacity:0;
}
.menu-toggle.active span:nth-child(3){
transform:rotate(-45deg) translate(6px,-6px);
}

/* HERO */
.hero{
margin-top:100px;
height:calc(100vh - 100px);

/* AJUSTE PRINCIPAL */
background:url('assets/img/hero-003.png') center no-repeat;
background-size:cover;

display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

/* DESKTOP - NÃO CORTA IMAGEM */
@media (min-width:1024px){
  .hero{
    background-size:contain;
    background-color:#000;
  }
}

.hero-content{
text-shadow:0 3px 15px rgba(0,0,0,0.7);
}

.btn{
background:#FFC107;
padding:12px 25px;
text-decoration:none;
color:black;
font-weight:bold;
border-radius:6px;
display:inline-block;
margin-top:10px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:200px;
object-fit:contain;
}

section{padding:60px 20px}

.footer{
background:#001a33;
color:white;
text-align:center;
padding:20px;
}

/* MOBILE */
@media (max-width:768px){

.nav{
position:fixed;
top:0;
right:-100%;
height:100vh;
width:200px;
background:rgba(0,51,102,0.95);
backdrop-filter:blur(12px);
flex-direction:column;
align-items:flex-start;
padding:110px 20px;
gap:20px;
transition:0.3s ease;
}

.nav a{
font-size:16px;
}

.nav.active{
right:0;
}

.menu-toggle{
display:flex;
}

/* OVERLAY */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.4);
opacity:0;
visibility:hidden;
transition:0.3s;
}

.overlay.active{
opacity:1;
visibility:visible;
}

}

</style>
</head>

<body>

<header class="header" id="header">
<div class="header-content">

<a href="#" class="logo">
<img src="assets/img/logos/f-pac-color.png" class="logo-img">
<span class="logo-text">F PAC</span>
</a>

<div class="menu-toggle" id="menuToggle">
<span></span>
<span></span>
<span></span>
</div>

<nav class="nav" id="navMenu">
<a href="#inicio">Início</a>
<a href="#produtos">Produtos</a>
<a href="catalogo.html">Catálogo</a>
<a href="carrinho.html">
<i class="fa-solid fa-cart-shopping"></i>
<span id="carrinhoQtd">0</span>
</a>
</nav>

</div>
</header>

<div class="overlay" id="overlay"></div>

<section class="hero" id="inicio">
<div class="hero-content">
<h1>Não é só roupa. É identidade.</h1>
<p>Vista atitude e exclusividade.</p>
<a href="#produtos" class="btn">Comprar</a>
</div>
</section>

<section id="produtos">
<h2 style="text-align:center">Produtos</h2>

<div class="grid">

<div class="card">
<img src="assets/img/cards/F-PAC-ESCRITA-peito C.png">
<h3>Force</h3>
<a href="#" class="btn">Comprar</a>
</div>

<div class="card">
<img src="assets/img/cards/FP-peito C.png">
<h3>Mark</h3>
<a href="#" class="btn">Comprar</a>
</div>

<div class="card">
<img src="assets/img/cards/F-PAC-frente-e-costas.png">
<h3>Prime</h3>
<a href="#" class="btn">Personalizar</a>
</div>

</div>
</section>

<footer class="footer">
© 2026 F Pac Store — Não é só roupa. É identidade.
</footer>

<script>

/* MENU */
const menuToggle = document.getElementById("menuToggle");
const navMenu = document.getElementById("navMenu");
const overlay = document.getElementById("overlay");

function fecharMenu(){
menuToggle.classList.remove("active");
navMenu.classList.remove("active");
overlay.classList.remove("active");
}

menuToggle.onclick = () => {
menuToggle.classList.toggle("active");
navMenu.classList.toggle("active");
overlay.classList.toggle("active");
};

overlay.onclick = fecharMenu;

document.querySelectorAll(".nav a").forEach(link => {
link.addEventListener("click", fecharMenu);
});

/* SCROLL HEADER */
window.addEventListener("scroll", () => {
const header = document.getElementById("header");
header.classList.toggle("shrink", window.scrollY > 50);
});

/* CARRINHO */
function getCarrinho(){
return JSON.parse(localStorage.getItem('fpacCarrinho'))||[]
}

function atualizarCarrinho(){
const carrinho=getCarrinho()
const total=carrinho.reduce((s,i)=>s+i.quantidade,0)
document.getElementById("carrinhoQtd").innerText=total
}

document.addEventListener("DOMContentLoaded",atualizarCarrinho)

</script>

</body>
</html>
