<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F Pac Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box}

:root{
--primary:#003366cc;
--accent:#FFC107;
--bg:#f5f5f5;
--text:#333;
--white:#fff;
}

html{
scroll-behavior:smooth;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
}

/* HEADER */
.header{
background:var(--primary);
backdrop-filter:blur(10px);
position:fixed;
width:100%;
top:0;
z-index:1000;
transition:0.3s;
}

.header.shrink{
height:70px;
background:#003366ee;
}

.header-content{
display:flex;
justify-content:space-between;
align-items:center;
height:100px;
padding:0 20px;
transition:0.3s;
}

.header.shrink .header-content{
height:70px;
}

/* LOGO */
.logo{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
}

.logo-img{
height:70px;
transition:0.3s;
}

.header.shrink .logo-img{
height:50px;
}

.logo-text{
font-family:'blacklisted';
color:#FFC107;
}

/* MENU DESKTOP */
.nav{
display:flex;
gap:30px;
align-items:center;
}

.nav a{
color:white;
text-decoration:none;
font-weight:600;
}

/* BOTÃO MENU */
.menu-toggle{
display:none;
flex-direction:column;
cursor:pointer;
gap:5px;
z-index:1100;
}

.menu-toggle span{
width:28px;
height:3px;
background:white;
transition:0.3s;
}

.menu-toggle.active span:nth-child(1){
transform:rotate(45deg) translate(5px,5px);
}
.menu-toggle.active span:nth-child(2){
opacity:0;
}
.menu-toggle.active span:nth-child(3){
transform:rotate(-45deg) translate(6px,-6px);
}

/* HERO */
.hero{
margin-top:100px;
height:calc(100vh - 100px);

background-image:url('assets/img/hero-003.png');
background-repeat:no-repeat;
background-size:cover;
background-position:center 35%;

display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;

position:relative;
}

.hero::after{
content:'';
position:absolute;
inset:0;
background:linear-gradient(
to bottom,
rgba(0,0,0,0.35),
rgba(0,0,0,0.6)
);
}

.hero-content{
position:relative;
z-index:1;
text-shadow:0 3px 15px rgba(0,0,0,0.7);
}

/* DESKTOP GRANDE */
@media
