<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>F Pac Store | Não é só roupa. É identidade!</title>

  <meta name="description"
        content="Camisas masculinas estampadas para quem se recusa a vestir o comum. Não é só roupa. É identidade.">
  <meta name="author" content="F Pac Store">

  <!-- FONTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous"
  />

  <style>
    :root {
      --primary: #003366;
      --accent: #FFC107;
      --bg: #f5f5f5;
      --text: #333;
      --white: #fff;
      --header-height: 120px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: var(--header-height);
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 0 15px;
    }

    /* ============================= */
    /* HERO                          */
    /* ============================= */

    .hero {
      position: relative;
      min-height: calc(110vh - 140px);
      background-image: url('https://raw.githubusercontent.com/F-Pac-Store/f-pac-store/main/imagens/capa%20de%20fundo.jpeg');
      background-size: cover;
      background-position: center 65%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 960px;
      padding: 80px 40px;
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 25px;
    }

    .btn {
      background: var(--accent);
      color: #000;
      padding: 15px 30px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      display: inline-block;
    }

    /* ============================= */
    /* FOOTER                        */
    /* ============================= */

    .footer {
      background: #001a33;
      color: white;
      padding: 25px;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

<!-- ✅ MENU REUTILIZÁVEL -->
<div id="menu"></div>

<!-- ✅ HERO -->
<section class="hero" id="inicio">
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <h1>Não é só roupa. É identidade.</h1>
    <p>
      Camisas masculinas estampadas para quem se recusa a vestir o comum.
    </p>
    <a href="#produtos" class="btn">Comprar Agora</a>
  </div>
</section>

<!-- ⚠️ (seções de produtos continuam aqui – não removidas) -->

<footer class="footer">
  © 2026 F Pac Store — Não é só roupa. É identidade.
</footer>

<!-- ============================= -->
<!-- FUNÇÕES DO CARRINHO           -->
<!-- ============================= -->

<script>
function gerarIdPedido() {
  const data = new Date();
  return `FPAC-${data.getFullYear()}${String(data.getMonth()+1).padStart(2,'0')}${String(data.getDate()).padStart(2,'0')}-${String(Date.now()).slice(-4)}`;
}

function obterCarrinho() {
  const salvo = localStorage.getItem('carrinho');
  if (salvo) return JSON.parse(salvo);

  return {
    id: gerarIdPedido(),
    criadoEm: new Date().toISOString(),
    status: 'aberto',
    itens: [],
    total: 0
  };
}

function salvarCarrinho(carrinho) {
  carrinho.total = carrinho.itens.reduce(
    (s, item) => s + item.subtotal,
    0
  );
  localStorage.setItem('carrinho', JSON.stringify(carrinho));
}

function atualizarQtdCarrinho() {
  const carrinho = JSON.parse(localStorage.getItem('carrinho'));
  const el = document.getElementById('carrinhoQtd');
  if (!el || !carrinho) return;

  const total = carrinho.itens.reduce((s, i) => s + i.qtd, 0);
  if (total > 0) {
    el.textContent = total;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}
</script>

<!-- ============================= -->
<!-- CARREGAR MENU (SEMPRE ÚLTIMO) -->
<!-- ============================= -->

<script>
fetch('menu.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('menu').innerHTML = html;

    // MENU MOBILE
    const toggle = document.getElementById('toggle');
    const nav = document.getElementById('nav');

    if (toggle && nav) {
      toggle.addEventListener('click', () => {
        nav.classList.toggle('active');
      });

      document.querySelectorAll('.nav a').forEach(link => {
        link.addEventListener('click', () => {
          nav.classList.remove('active');
        });
      });
    }

    atualizarQtdCarrinho();
  });
</script>

</body>
</html>
