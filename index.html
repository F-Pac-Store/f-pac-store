<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F Pac Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --primary:#003366;
  --accent:#FFC107;
  --bg:#f5f5f5;
  --text:#333;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ================= HEADER ================= */
.header{
  background:#003366;
  position:fixed;
  top:0;
  width:100%;
  z-index:1000;
}

.header-content{
  display:flex;
  justify-content:space-between;
  align-items:center;
  height:100px;
  padding:0 30px;
}

.logo img{height:70px}

/* DESKTOP NAV */
.nav{
  display:flex;
  align-items:center;
  gap:48px;
}

.nav a{
  text-decoration:none;
  font-size:1.1rem;
  font-weight:700;
  letter-spacing:1px;
  color:white;
}

.nav .produtos{color:var(--accent)}
.nav .catalogo{color:#4ade80}

.nav .cart{
  position:relative;
  font-size:1.4rem;
  color:var(--accent);
}

.cart-badge{
  position:absolute;
  top:-10px;
  right:-12px;
  background:var(--accent);
  color:#000;
  font-size:12px;
  font-weight:800;
  border-radius:50%;
  padding:4px 7px;
}

.nav .whatsapp{font-size:1.4rem;color:#25D366}
.nav .instagram{font-size:1.4rem;color:#E1306C}

/* HAMBURGUER */
.menu-toggle{
  display:none;
  font-size:1.8rem;
  color:white;
  cursor:pointer;
}

/* ================= MOBILE MENU ================= */
.mobile-menu{
  position:fixed;
  top:0;
  right:-100%;
  width:280px;
  height:100vh;
  background:#001a33;
  padding:30px 20px;
  transition:.3s ease;
  z-index:2000;
}

.mobile-menu.active{
  right:0;
}

.mobile-menu .close{
  color:white;
  font-size:1.6rem;
  text-align:right;
  margin-bottom:30px;
  cursor:pointer;
}

.mobile-menu nav{
  display:flex;
  flex-direction:column;
  gap:24px;
}

.mobile-menu nav a{
  color:white;
  font-size:1.2rem;
  font-weight:700;
  text-decoration:none;
}

.mobile-menu .cart{
  color:var(--accent);
  font-size:1.5rem;
}

.mobile-menu .social{
  display:flex;
  gap:20px;
  margin-top:40px;
}

.mobile-menu .social a{
  font-size:1.6rem;
}

.mobile-menu .whatsapp{color:#25D366}
.mobile-menu .instagram{color:#E1306C}

/* ================= HERO ================= */
.hero{
  margin-top:100px;
  height:calc(100vh - 100px);
  background:url('assets/img/hero-003.png') no-repeat center / cover;
  display:flex;
  align-items:center;
  justify-content:center;
}

.btn{
  background:var(--accent);
  padding:16px 36px;
  border-radius:30px;
  font-weight:800;
  color:black;
  text-decoration:none;
}

/* ================= DESTAQUES ================= */
.drop{
  background:#0b0b0b;
  padding:80px 20px;
  color:white;
}

.drop-title{
  text-align:center;
  font-size:2rem;
  font-weight:800;
}

.drop-subtitle{
  text-align:center;
  color:#ccc;
  margin:10px 0 40px;
}

.drop-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
  max-width:1200px;
  margin:auto;
}

.card-full{
  height:380px;
  border-radius:18px;
  overflow:hidden;
}

.card-full img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ================= PRODUTOS ================= */
section{padding:80px 20px}

.produtos-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
  max-width:1200px;
  margin:auto;
}

/* ================= FOOTER ================= */
.footer{
  background:#001a33;
  color:white;
  text-align:center;
  padding:30px 20px;
}

/* ================= RESPONSIVO ================= */
@media(max-width:768px){
  .nav{display:none}
  .menu-toggle{display:block}
}
</style>
</head>

<body>

<header class="header">
  <div class="header-content">
    <a href="#inicio" class="logo">
      <img src="assets/img/logos/f-pac-color.png" alt="F Pac Store">
    </a>

    <nav class="nav">
      <a href="#inicio">INÍCIO</a>
      <a href="#produtos" class="produtos">PRODUTOS</a>
      <a href="catalogo.html" class="catalogo">CATÁLOGO</a>

      <a href="carrinho.html" class="cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge" id="cartCount">0</span>
      </a>

      <a href="https://wa.me/5547997465602" target="_blank" class="whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
      </a>

      <a href="https://www.instagram.com/f_pac_store" target="_blank" class="instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
    </nav>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  </div>
</header>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu">
  <div class="close" onclick="toggleMenu()">✕</div>

  <nav>
    <a href="#inicio" onclick="toggleMenu()">INÍCIO</a>
    <a href="#produtos" onclick="toggleMenu()">PRODUTOS</a>
    <a href="catalogo.html">CATÁLOGO</a>
    <a href="carrinho.html" class="cart">
      <i class="fa-solid fa-cart-shopping"></i> Carrinho
    </a>
  </nav>

  <div class="social">
    <a href="https://wa.me/5547997465602" target="_blank" class="whatsapp">
      <i class="fa-brands fa-whatsapp"></i>
    </a>
    <a href="https://www.instagram.com/f_pac_store" target="_blank" class="instagram">
      <i class="fa-brands fa-instagram"></i>
    </a>
  </div>
</div>

<section class="hero" id="inicio">
  <a href="#produtos" class="btn">Comprar Agora</a>
</section>

<section class="drop">
  <h2 class="drop-title">Destaques da Semana</h2>
  <p class="drop-subtitle">Peças em evidência escolhidas pela F PAC</p>

  <div class="drop-grid">
    <a href="catalogo.html" class="card-full"><img src="assets/img/cards/destaque-01.png"></a>
    <a href="catalogo.html" class="card-full"><img src="assets/img/cards/destaque-02.png"></a>
  </div>
</section>

<section id="produtos">
  <h2 style="text-align:center">Produtos</h2>
  <div class="produtos-grid">
    <a href="produto.html" class="card-full"><img src="assets/img/cards/F-PAC-ESCRITA-peito C.png"></a>
    <a href="produto.html" class="card-full"><img src="assets/img/cards/FP-peito C.png"></a>
    <a href="produto.html" class="card-full"><img src="assets/img/cards/F-PAC-frente-e-costas.png"></a>
  </div>
</section>

<footer class="footer">
© 2026 F Pac Store — Não é só roupa. É identidade.
</footer>

<script>
function atualizarCarrinho(){
  const carrinho = JSON.parse(localStorage.getItem("fpacCarrinho")) || [];
  document.getElementById("cartCount").innerText = carrinho.length;
}
atualizarCarrinho();

function toggleMenu(){
  document.getElementById("mobileMenu").classList.toggle("active");
}
</script>

</body>
</html>
