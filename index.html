<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>F PAC STORE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONTES E ÍCONES -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="css/global.css">
</head>

<body>

  <!-- HEADER -->
  <div id="header-placeholder"></div>

  <!-- HERO (APENAS IMAGEM) -->
  <section class="hero"></section>

  <!-- DESTAQUES -->
  <section class="secao destaques">
    <h2 class="titulo-destaque">Destaques</h2>

    <div class="carousel-wrapper">
      <button class="carousel-btn left" onclick="slideDestaque(-1)">‹</button>

      <div class="carousel" id="carouselDestaques">

        <a href="prime.html" class="card-destaque">
          <img src="assets/img/cards/F-PAC-frente-e-costas.png" alt="PRIME">
          <div class="destaque-overlay">
            <span class="tag">Personalizado</span>
            <h3>PRIME</h3>
            <p>Crie uma peça única</p>
          </div>
        </a>

        <a href="catalogo.html" class="card-destaque">
          <img src="assets/img/cards/FP-peito C.png" alt="Catálogo">
          <div class="destaque-overlay">
            <span class="tag">Exclusivo</span>
            <h3>CATÁLOGO</h3>
            <p>Artes originais F PAC</p>
          </div>
        </a>

      </div>

      <button class="carousel-btn right" onclick="slideDestaque(1)">›</button>
    </div>
  </section>

  <!-- PRODUTOS -->
  <section id="produtos" class="secao">
    <h2>Produtos</h2>
    <p class="secao-sub">Escolha o que mais combina com você</p>

    <div class="produtos-grid">
      <a href="force.html" class="card-produto">
        <img src="assets/img/cards/F-PAC-ESCRITA-peito C.png">
        <span>FORCE</span>
      </a>

      <a href="mark.html" class="card-produto">
        <img src="assets/img/cards/FP-peito C.png">
        <span>MARK</span>
      </a>

      <a href="prime.html" class="card-produto">
        <img src="assets/img/cards/F-PAC-frente-e-costas.png">
        <span>PRIME</span>
      </a>
    </div>
  </section>

  <!-- FOOTER -->
  <div id="footer-placeholder"></div>

  <!-- JS -->
  <script src="js/layout.js"></script>
  <script src="js/header.js"></script>

  <script>
    function slideDestaque(dir){
      const carousel = document.getElementById("carouselDestaques");
      const card = carousel.querySelector(".card-destaque");
      const gap = 30;
      carousel.scrollBy({
        left: dir * (card.offsetWidth + gap),
        behavior: "smooth"
      });
    }
  </script>

</body>
</html>
