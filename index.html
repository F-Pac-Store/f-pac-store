<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Produto | F Pac Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FONTES -->
https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap
https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--primary:#003366;
--accent:#FFC107;
--bg:#f5f5f5;
--text:#1f2933;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
}

/* ================= HEADER PADRÃO ================= */

.header{
background:rgba(0,51,102,.92);
backdrop-filter:blur(10px);
position:fixed;
width:100%;
top:0;
z-index:1000;
}

.header-content{
display:flex;
justify-content:space-between;
align-items:center;
height:100px;
padding:0 20px;
transition:.3s;
}

.header.shrink .header-content{height:70px}

.logo img{
height:70px;
transition:.3s;
}

.header.shrink .logo img{height:50px}

.nav{
display:flex;
gap:30px;
align-items:center;
}

.nav a{
color:white;
text-decoration:none;
font-weight:600;
}

/* ================= PÁGINA PRODUTO ================= */

.main{
margin-top:120px;
display:flex;
justify-content:center;
padding:40px 20px;
}

.card-produto{
background:#fff;
border-radius:18px;
padding:24px;
max-width:520px;
width:100%;
box-shadow:0 10px 40px rgba(0,0,0,.15);
text-align:center;
}

.card-produto img{
width:100%;
height:320px;
object-fit:contain;
background:#f8fafc;
border-radius:12px;
margin-bottom:20px;
}

h1{
font-size:1.8rem;
margin-bottom:10px;
}

/* ================= VARIAÇÕES ================= */

.label{
margin-top:16px;
font-weight:600;
display:block;
}

.opcoes{
display:flex;
gap:12px;
justify-content:center;
margin:10px 0;
}

.cor{
width:30px;
height:30px;
border-radius:50%;
cursor:pointer;
border:2px solid transparent;
}

.cor.ativo{border-color:#000}

.branco{background:#fff;border:1px solid #ccc}
.preto{background:#000}
.offwhite{background:#f3e9dc}

.size{
width:42px;
height:42px;
border-radius:8px;
border:1px solid #ccc;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-weight:600;
}

.size.ativo{
background:#000;
color:#fff;
}

/* ================= AÇÃO ================= */

input[type="number"]{
width:80px;
padding:6px;
text-align:center;
margin-top:6px;
}

.btn{
width:100%;
margin-top:24px;
padding:14px;
background:#000;
color:#fff;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:800;
}

</style>
</head>

<body>

<header class="header" id="header">
  <div class="header-content">
    <a href="index.html" class="logo">
      <img src="assets/img/logos/f-pac-color.png">
    </a>

    <nav class="nav">
      <a href="index.html">Início</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="carrinho.html">Carrinho</a>
    </nav>
  </div>
</header>

<main class="main">
  <div class="card-produto">

    <img id="produtoImagem" src="" alt="Produto F Pac">

    <h1 id="produtoNome">Produto</h1>

    <span class="label">Cor</span>
    <div class="opcoes">
      <div class="cor branco ativo" onclick="selCor('Branco')"></div>
      <div class="cor preto" onclick="selCor('Preto')"></div>
      <div class="cor offwhite" onclick="selCor('Off White')"></div>
    </div>

    <span class="label">Tamanho</span>
    <div class="opcoes">
      <div class="size" onclick="selTam('P')">P</div>
      <div class="size ativo" onclick="selTam('M')">M</div>
      <div class="size" onclick="selTam('G')">G</div>
      <div class="size" onclick="selTam('GG')">GG</div>
    </div>

    <span class="label">Quantidade</span><br>
    <input type="number" id="qtd" value="1" min="1">

    <button class="btn" onclick="comprar()">Adicionar ao Carrinho</button>

    <input type="hidden" id="cor" value="Branco">
    <input type="hidden" id="tamanho" value="M">

  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* CONFIG FIREBASE */
const app = initializeApp({
  apiKey:"SUA_API_KEY",
  authDomain:"SEU_PROJETO.firebaseapp.com",
  projectId:"SEU_PROJETO"
});
const db = getFirestore(app);

/* PRODUTOS */
const produtos = {
  force:{
    nome:"Camisa Force",
    preco:89.90,
    estoque:"FORCE",
    imagem:"assets/img/cards/F-PAC-ESCRITA-peito C.png"
  },
  mark:{
    nome:"Camisa Mark",
    preco:89.90,
    estoque:"MARK",
    imagem:"assets/img/cards/FP-peito C.png"
  },
  prime:{
    nome:"Camisa Prime",
    preco:109.90,
    estoque:"PRIME",
    imagem:"assets/img/cards/F-PAC-frente-e-costas.png"
  }
};

/* STATE */
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const produto = produtos[id];
if(!produto){
  location.href="catalogo.html";
}

/* SET PRODUTO */
document.getElementById("produtoNome").innerText = produto.nome;
document.getElementById("produtoImagem").src = produto.imagem;

const corInput = document.getElementById("cor");
const tamInput = document.getElementById("tamanho");
const qtdInput = document.getElementById("qtd");

window.selCor = c => corInput.value = c;
window.selTam = t => tamInput.value = t;

async function temEstoque(){
  const snap = await getDoc(doc(db,"estoque",produto.estoque+"_"+corInput.value));
  return snap.exists() && (snap.data()[tamInput.value]||0)>0;
}

window.comprar = async ()=>{
  if(!await temEstoque()){
    alert("Produto sem estoque");
    return;
  }

  const item={
    id:id,
    nome:produto.nome,
    preco:produto.preco,
    quantidade:Number(qtdInput.value),
    variacao:{cor:corInput.value,tamanho:tamInput.value}
  };

  adicionarItem(item);
  location.href="carrinho.html";
};

/* HEADER SHRINK */
window.addEventListener("scroll",()=>{
document.getElementById("header").classList.toggle("shrink",scrollY>50);
});
</script>

<script src="js/carrinho.js"></script>

</body>
</html>
