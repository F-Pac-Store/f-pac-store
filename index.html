<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F Pac Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --primary:#003366;
  --accent:#FFC107;
}

/* ================= HEADER ================= */
.header{
  background:#003366;
  position:fixed;
  top:0;
  width:100%;
  z-index:1000;
}

.header-content{
  display:flex;
  justify-content:space-between;
  align-items:center;
  height:100px;
  padding:0 30px;
}

.logo img{height:70px}

/* DESKTOP NAV */
.nav{
  display:flex;
  align-items:center;
  gap:48px;
}

.nav a{
  text-decoration:none;
  color:white;
  font-size:.95rem;
  font-weight:500;
  letter-spacing:2px;
}

/* ÍCONES DESKTOP */
.nav .cart{
  position:relative;
  font-size:1.4rem;
  color:var(--accent);
}

.cart-badge{
  position:absolute;
  top:-8px;
  right:-10px;
  background:var(--accent);
  color:#000;
  font-size:11px;
  font-weight:800;
  border-radius:50%;
  padding:3px 6px;
}

.nav .whatsapp{font-size:1.4rem;color:#25D366}
.nav .instagram{font-size:1.4rem;color:#E1306C}

/* HAMBURGUER */
.menu-toggle{
  display:none;
  font-size:1.8rem;
  color:white;
  cursor:pointer;
}

/* ================= MOBILE MENU ================= */
.mobile-menu{
  position:fixed;
  top:0;
  right:-100%;
  width:280px;
  height:100vh;
  background:#001a33;
  padding:30px 20px;
  transition:.3s ease;
  z-index:2000;
}

.mobile-menu.active{ right:0 }

.mobile-menu .close{
  color:white;
  font-size:1.6rem;
  text-align:right;
  margin-bottom:40px;
  cursor:pointer;
}

.mobile-menu nav{
  display:flex;
  flex-direction:column;
  gap:32px;
}

.mobile-menu nav a{
  color:white;
  text-decoration:none;
  font-size:1.05rem;
  font-weight:500;
  letter-spacing:2px;
}

/* ÍCONES MOBILE */
.mobile-menu .icons{
  display:flex;
  gap:28px;
  margin-top:60px;
  align-items:center;
}

.mobile-menu .icons a{
  font-size:1.5rem;
}

.mobile-menu .cart{ color:var(--accent); }
.mobile-menu .whatsapp{ color:#25D366 }
.mobile-menu .instagram{ color:#E1306C }

/* ================= HERO ================= */
.hero{
  margin-top:100px;
  height:calc(100vh - 100px);
  background:url('assets/img/hero-003.png') no-repeat center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
}

.btn{
  background:var(--accent);
  padding:16px 36px;
  border-radius:30px;
  font-weight:800;
  color:black;
  text-decoration:none;
}

/* ================= RESPONSIVO ================= */
@media(max-width:768px){
  .nav{display:none}
  .menu-toggle{display:block}
}
</style>
</head>

<body>

<header class="header">
  <div class="header-content">
    <a href="#topo" class="logo">
      <img src="assets/img/logos/f-pac-color.png" alt="F Pac Store">
    </a>

    <nav class="nav">
      <a href="#topo" onclick="scrollTopo()">INÍCIO</a>
      <a href="#produtos">PRODUTOS</a>
      <a href="catalogo.html">CATÁLOGO</a>

      <a href="carrinho.html" class="cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge" id="cartCount">0</span>
      </a>

      <a href="https://wa.me/5547997465602" target="_blank" class="whatsapp">
        <i class="fa-brands fa-whatsapp"></i>
      </a>

      <a href="https://www.instagram.com/f_pac_store" target="_blank" class="instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
    </nav>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  </div>
</header>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu">
  <div class="close" onclick="toggleMenu()">✕</div>

  <nav>
    <a href="#topo" onclick="scrollTopo();toggleMenu()">INÍCIO</a>
    <a href="#produtos" onclick="toggleMenu()">PRODUTOS</a>
    <a href="catalogo.html">CATÁLOGO</a>
  </nav>

  <!-- ÍCONES MOBILE (CARRINHO À ESQUERDA DO WHATSAPP) -->
  <div class="icons">
    <a href="carrinho.html" class="cart">
      <i class="fa-solid fa-cart-shopping"></i>
    </a>
    <a href="https://wa.me/5547997465602" target="_blank" class="whatsapp">
      <i class="fa-brands fa-whatsapp"></i>
    </a>
    <a href="https://www.instagram.com/f_pac_store" target="_blank" class="instagram">
      <i class="fa-brands fa-instagram"></i>
    </a>
  </div>
</div>

<a id="topo"></a>

<section class="hero">
  <a href="#produtos" class="btn">Comprar Agora</a>
</section>

<section id="produtos"></section>

<script>
function toggleMenu(){
  document.getElementById("mobileMenu").classList.toggle("active");
}

function scrollTopo(){
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function atualizarCarrinho(){
  const carrinho = JSON.parse(localStorage.getItem("fpacCarrinho")) || [];
  const badge = document.getElementById("cartCount");
  if(badge) badge.innerText = carrinho.length;
}
atualizarCarrinho();
</script>

</body>
</html>
