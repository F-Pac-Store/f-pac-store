<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F Pac Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box}

:root{
--primary:#003366;
--accent:#FFC107;
--bg:#f5f5f5;
--text:#333;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
}

/* ================= HEADER ================= */
.header{
background:rgba(0,51,102,.92);
backdrop-filter:blur(10px);
position:fixed;
top:0;
width:100%;
z-index:1000;
transition:.3s;
}

.header-content{
display:flex;
justify-content:space-between;
align-items:center;
height:100px;
padding:0 20px;
}

.logo img{height:70px}

.nav{
display:flex;
gap:30px;
align-items:center;
}

.nav a,
.nav button{
color:#fff;
background:none;
border:none;
font-weight:600;
text-decoration:none;
cursor:pointer;
font-size:1rem;
}

/* ================= HERO (CORRIGIDA) ================= */
.hero{
margin-top:100px;
height:calc(100vh - 100px);
background:url('assets/img/hero-003.png') no-repeat center / cover;
display:flex;
align-items:center;
justify-content:center;
position:relative;
color:white;
}

/* 🔥 OVERLAY LEVE — IMAGEM VISÍVEL */
.hero::after{
content:'';
position:absolute;
inset:0;
background:linear-gradient(
  to bottom,
  rgba(0,0,0,.15),
  rgba(0,0,0,.35)
);
}

.hero-content{
position:relative;
z-index:1;
}

.btn{
background:var(--accent);
padding:14px 30px;
border-radius:10px;
font-weight:800;
color:black;
text-decoration:none;
}

/* ================= DROP ================= */
.drop{
background:#0b0b0b;
padding:80px 20px;
color:white;
}

.drop h2{text-align:center;font-size:2rem;margin-bottom:10px}
.drop p{text-align:center;color:#ccc;margin-bottom:40px}

.drop-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
max-width:1200px;
margin:auto;
}

.card-full{
position:relative;
height:380px;
border-radius:18px;
overflow:hidden;
display:block;
text-decoration:none;
}

.card-full img{
width:100%;
height:100%;
object-fit:cover;
transition:.6s ease;
}

.card-full:hover img{transform:scale(1.08)}

/* ================= PRODUTOS ================= */
section{padding:80px 20px}

.produtos-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
max-width:1200px;
margin:auto;
}

/* ================= FOOTER ================= */
.footer{
background:#001a33;
color:white;
text-align:center;
padding:30px 20px;
}
</style>
</head>

<body>

<header class="header">
  <div class="header-content">
    <a href="index.html" class="logo">
      <img src="assets/img/logos/f-pac-color.png" alt="F Pac Store">
    </a>

    <nav class="nav">
      <a href="#inicio">Início</a>
      <a href="catalogo.html">Catálogo</a>
    </nav>
  </div>
</header>

<section class="hero" id="inicio">
  <div class="hero-content">
    <a href="catalogo.html" class="btn">Comprar Agora</a>
  </div>
</section>

<section class="drop">
  <h2>Drop em Destaque</h2>
  <p>Lançamentos que representam a identidade F PAC</p>

  <div class="drop-grid">
    <a href="catalogo.html" class="card-full">
      <img src="assets/img/cards/destaque-01.png">
    </a>
    <a href="catalogo.html" class="card-full">
      <img src="assets/img/cards/destaque-02.png">
    </a>
  </div>
</section>

<section id="produtos">
  <h2 style="text-align:center">Produtos</h2>

  <div class="produtos-grid">
    <a href="produto.html" class="card-full">
      <img src="assets/img/cards/F-PAC-ESCRITA-peito C.png">
    </a>
    <a href="produto.html" class="card-full">
      <img src="assets/img/cards/FP-peito C.png">
    </a>
    <a href="produto.html" class="card-full">
      <img src="assets/img/cards/F-PAC-frente-e-costas.png">
    </a>
  </div>
</section>

<footer class="footer">
© 2026 F Pac Store — Não é só roupa. É identidade.
</footer>

</body>
</html>
