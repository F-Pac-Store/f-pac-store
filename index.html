<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>F Pac Store</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/blacklisted" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box}

:root{
--primary:#003366cc;
--accent:#FFC107;
--bg:#f5f5f5;
--text:#333;
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
}

/* HEADER */
.header{
background:var(--primary);
backdrop-filter:blur(10px);
position:fixed;
width:100%;
top:0;
z-index:1000;
transition:.3s;
}

.header.shrink{background:#003366ee}

.header-content{
display:flex;
justify-content:space-between;
align-items:center;
height:100px;
padding:0 20px;
transition:.3s;
}

.header.shrink .header-content{height:70px}

/* LOGO */
.logo{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
}

.logo-img{height:70px;transition:.3s}
.header.shrink .logo-img{height:50px}

.logo-text{
font-family:'blacklisted';
color:#FFC107;
}

/* MENU */
.nav{display:flex;gap:30px}
.nav a{color:white;text-decoration:none;font-weight:600}

/* HERO */
.hero{
margin-top:100px;
height:calc(100vh - 100px);
background:url('assets/img/hero-003.png') no-repeat center 35% / cover;
display:flex;
justify-content:center;
align-items:center;
position:relative;
color:white;
}

.hero::after{
content:'';
position:absolute;
inset:0;
background:linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,.6));
}

.hero-content{position:relative;z-index:1}

.btn{
background:#FFC107;
padding:12px 25px;
border-radius:6px;
color:black;
font-weight:800;
text-decoration:none;
}

/* ======================= */
/* DESTAQUE DE COLEÇÃO     */
/* ======================= */

.drop{
background:#0b0b0b;
color:white;
padding:80px 20px;
}

.drop h2{
text-align:center;
margin-bottom:10px;
}

.drop p{
text-align:center;
max-width:600px;
margin:0 auto 40px;
color:#ccc;
}

.drop-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
max-width:1200px;
margin:0 auto;
}

.drop-card{
position:relative;
height:380px;
border-radius:16px;
overflow:hidden;
text-decoration:none;
}

.drop-card img{
width:100%;
height:100%;
object-fit:cover;
transition:.5s;
}

.drop-card:hover img{transform:scale(1.08)}

.drop-overlay{
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(0,0,0,.75),transparent);
display:flex;
flex-direction:column;
justify-content:flex-end;
padding:20px;
}

/* PRODUTOS */
section{padding:60px 20px}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:200px;
object-fit:contain;
}

/* FOOTER */
.footer{
background:#001a33;
color:white;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<header class="header" id="header">
  <div class="header-content">
    <a href="#" class="logo">
      <img src="assets/img/logos/f-pac-color.png" class="logo-img">
      <span class="logo-text">F PAC</span>
    </a>

    <nav class="nav">
      <a href="#inicio">Início</a>
      <a href="#produtos">Produtos</a>
      <a href="catalogo.html">Catálogo</a>
    </nav>
  </div>
</header>

<section class="hero" id="inicio">
  <div class="hero-content">
    <a href="catalogo.html" class="btn">Comprar Agora</a>
  </div>
</section>

<!-- ======================= -->
<!-- DROP EM DESTAQUE        -->
<!-- ======================= -->

<section class="drop">
  <h2>Drop em Destaque</h2>
  <p>Lançamentos selecionados que representam a identidade F PAC.</p>

  <div class="drop-grid">
    <a href="catalogo.html" class="drop-card">
      <img src="assets/img/cards/destaque-01.png">
      <div class="drop-overlay">
        <span class="btn">Ver catálogo</span>
      </div>
    </a>

    <a href="catalogo.html" class="drop-card">
      <img src="assets/img/logos/FP-branco.png">
      <div class="drop-overlay">
      </div>
    </a>

    <a href="catalogo.html" class="drop-card">
      <img src="assets/img/cards/destaque-02.png">
      <div class="drop-overlay">
        <span class="btn">Últimas peças</span>
      </div>
    </a>
  </div>
</section>

<section id="produtos">
<h2 style="text-align:center">Produtos</h2>

<div class="grid">
  <div class="card">
    <img src="assets/img/cards/F-PAC-ESCRITA-peito C.png">
    <h3>Force</h3>
    <a href="catalogo.html" class="btn">Comprar</a>
  </div>

  <div class="card">
    <img src="assets/img/cards/FP-peito C.png">
    <h3>Mark</h3>
    <a href="catalogo.html" class="btn">Comprar</a>
  </div>

  <div class="card">
    <img src="assets/img/cards/F-PAC-frente-e-costas.png">
    <h3>Prime</h3>
    <a href="catalogo.html" class="btn">Personalizar</a>
  </div>
</div>
</section>

<footer class="footer">
© 2026 F Pac Store — Não é só roupa. É identidade.
</footer>

<script>
window.addEventListener("scroll",()=>{
document.getElementById("header")
.classList.toggle("shrink",window.scrollY>50)
});
</script>

</body>
</html>
