<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | F Pac Store</title>

  CSS/global.css
  https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css
</head>

<body>

<div id="header-placeholder"></div>

<main class="container" style="padding-top:140px;max-width:600px">

  <h1>Checkout</h1>

  <form>
    <input type="text" placeholder="Nome Completo" required><br><br>
    <input type="email" placeholder="Email" required><br><br>
    <input type="text" placeholder="Endereço" required><br><br>
    <button type="submit">Confirmar Pedido</button>
  </form>

</main>

<script>
fetch('inclui/header.html')
  .then(r=>r.text())
  .then(html=>{
    document.getElementById('header-placeholder').innerHTML=html;
    const s=document.createElement('script');
    s.src='js/header.js';
    document.body.appendChild(s);
  });
</script>

</body>
</html>
