<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Checkout | F PAC STORE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="css/global.css">
</head>

<body>

  <div id="header-placeholder"></div>

  <main class="container" style="margin-top:140px;max-width:720px;">

    <h1>Finalizar pedido</h1>

    <div id="resumoPedido"
      style="background:#f5f5f5;padding:20px;border-radius:16px;margin-bottom:30px;">
    </div>

    <form>
      <label>Nome completo</label><br>
      <input required style="width:100%;padding:14px;margin-bottom:16px">

      <label>Email</label><br>
      <input type="email" required style="width:100%;padding:14px;margin-bottom:24px">

      <button type="submit"
        style="width:100%;background:var(--primary);color:#fff;padding:16px;border:none;border-radius:40px;font-weight:800;">
        Confirmar pedido
      </button>
    </form>

    <p style="text-align:center;color:#666;margin-top:20px;">
      Após confirmar, nossa equipe entra em contato pelo WhatsApp.
    </p>

  </main>

  <script src="js/carrinho.js"></script>
</body>
</html>
