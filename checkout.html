<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Checkout | F Pac Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/header.css">
  <style>
    body { font-family: Inter, sans-serif; background:#f4f6f8; padding-top:120px }
    .wrap { max-width:720px; margin:auto; padding:32px }
    .card { background:#fff; padding:24px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.1) }
    label { display:block; margin-top:16px; font-weight:600 }
    input, textarea { width:100%; padding:12px; margin-top:6px }
    button { margin-top:24px; width:100%; padding:16px; font-weight:800; background:#22c55e; border:none; color:#fff }
  </style>
</head>
<body>

<header class="header">
  <div class="container header-content">
    <a href="index.html" class="logo">
      <img src="imagens/logo-fpac.png" class="logo-img">
      <span class="logo-text">F PAC STORE</span>
    </a>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>Dados para Finalização</h2>

    <label>Nome completo</label>
    <input id="nome">

    <label>WhatsApp</label>
    <input id="whatsapp" placeholder="DDD + número">

    <label>Bairro</label>
    <input id="bairro" list="bairros-joinville">

    <label>Observações do pedido</label>
    <textarea id="obs"></textarea>

    <button onclick="confirmarCheckout()">
      Confirmar Pedido
    </button>
  </div>
</div>

<script>
function confirmarCheckout() {
  const dados = {
    nome: document.getElementById('nome').value,
    whatsapp: document.getElementById('whatsapp').value,
    bairro: document.getElementById('bairro').value,
    obs: document.getElementById('obs').value
  };

  localStorage.setItem('fpacCheckout', JSON.stringify(dados));
  window.location.href = 'checkout-confirmacao.html';
}
</script>

</body>
</html>
