<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Checkout | F Pac Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/header.css">

<style>
body {
  font-family: Inter, sans-serif;
  background:#f4f6f8;
  padding-top:120px;
}

.wrap {
  max-width:720px;
  margin:auto;
  padding:32px;
}

.card {
  background:#fff;
  padding:24px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}

label {
  display:block;
  margin-top:16px;
  font-weight:600;
}

input, textarea {
  width:100%;
  padding:12px;
  margin-top:6px;
}

button {
  margin-top:24px;
  width:100%;
  padding:16px;
  font-weight:800;
  background:#22c55e;
  border:none;
  color:#fff;
  cursor:pointer;
}

.resumo {
  background:#f9f9f9;
  padding:16px;
  border-radius:8px;
  margin-bottom:20px;
}

.total {
  font-weight:800;
  margin-top:10px;
}

.erro {
  color:red;
  font-size:0.85rem;
  display:none;
}
</style>
</head>

<body>

<header class="header">
  <div class="container header-content">
    <a href="index.html" class="logo">
      <img src="imagens/logo-fpac.png" class="logo-img">
      <span class="logo-text">F PAC STORE</span>
    </a>
  </div>
</header>

<div class="wrap">
  <div class="card">

    <h2>Finalizar Pedido</h2>

    <!-- RESUMO -->
    <div class="resumo" id="resumoPedido"></div>

    <label>Nome completo</label>
    <input id="nome">

    <label>WhatsApp</label>
    <input id="whatsapp" placeholder="47999999999">

    <label>Bairro</label>
    <input id="bairro">

    <label>Rua</label>
    <input id="rua">

    <label>Número</label>
    <input id="numero">

    <label>Observações</label>
    <textarea id="obs"></textarea>

    <button id="btnFinalizar" onclick="confirmarCheckout()">
      Confirmar Pedido
    </button>

    <div id="erro" class="erro">Preencha todos os campos obrigatórios</div>

    <div id="mensagemEnviada" style="
      display:none;
      margin-top:20px;
      padding:16px;
      background:#22c55e;
      color:#fff;
      font-weight:800;
      text-align:center;
      border-radius:8px;
    ">
      Pedido enviado! Redirecionando para WhatsApp...
    </div>

  </div>
</div>

<script src="js/checkout.js"></script>

</body>
</html>
